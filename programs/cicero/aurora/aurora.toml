# Aurora Program Configuration

[program]
program_id = "com.cicero.aurora"
program_name = "Aurora"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Render", "Atmosphere"]
program_type = "synthesis"
description = "Three shimmering vertical color curtains that drift like aurora borealis with adjustable wavelength and sway."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Wavelength 1"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Wavelength 2"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Wavelength 3"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 192
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Glow Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bands"
value_labels = ["Three", "One"]
initial_value_label = "Three"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Aurora", "Sunset"]
initial_value_label = "Aurora"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Blend"
value_labels = ["Max", "Add"]
initial_value_label = "Max"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Sparkle"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Amplitude"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Calm Sky"
rotary_potentiometer_4 = 96
linear_potentiometer_12 = 256

[[preset]]
name = "Stormy Sunset"
toggle_switch_8 = 1
rotary_potentiometer_4 = 800
linear_potentiometer_12 = 900
