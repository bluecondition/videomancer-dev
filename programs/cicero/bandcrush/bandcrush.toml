# Bandcrush (formerly Posterize) Program Configuration

[program]
program_id = "com.cicero.posterize"
program_name = "Bandcrush"
program_version = "2.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Color", "Print", "Pattern"]
program_type = "processing"
description = "Topographic Y-band colorizer: Y quantized to N levels, each band recolored from a palette, transitions drawn as contour lines."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Y Curve"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Contour"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Palette Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Chroma Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Y Mode"
value_labels = ["Stepped", "Input"]
initial_value_label = "Stepped"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Contour"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Topo", "Heatmap"]
initial_value_label = "Topo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Curve"
value_labels = ["Linear", "Reverse"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bands"
control_mode = "linear"
display_min_value = 2
display_max_value = 16
initial_value = 384
display_float_digits = 0
suffix_label = ""

[[preset]]
name = "Default"

[[preset]]
name = "Sharp Topo"
rotary_potentiometer_2 = 950
linear_potentiometer_12 = 256

[[preset]]
name = "Heat Map"
toggle_switch_9 = 1
toggle_switch_8 = 0
linear_potentiometer_12 = 700
