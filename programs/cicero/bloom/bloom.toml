# Bloom Program Configuration

[program]
program_id = "com.cicero.bloom"
program_name = "Bloom"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Processing", "Lens"]
program_type = "processing"
description = "Highlight glow on bright pixels via 7-tap horizontal blur added back to input. Adjustable threshold, intensity, tint."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Intensity"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Underlay"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 900
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Polarity"
value_labels = ["Bright", "Dark"]
initial_value_label = "Bright"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Channel"
value_labels = ["Luma", "All"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mono"
value_labels = ["Color", "Mono"]
initial_value_label = "Color"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Halo"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bloom Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Heavy Glow"
rotary_potentiometer_2 = 900
linear_potentiometer_12 = 900

[[preset]]
name = "Subtle"
rotary_potentiometer_1 = 800
rotary_potentiometer_2 = 256
