# Echotube Program Configuration

[program]
program_id = "com.cicero.echotube"
program_name = "Echotube"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Temporal", "Glitch", "Color"]
program_type = "processing"
description = "Recursive scanline feedback echo with H-shift, chroma drift, and IIR decay — long fading tube of trails."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Decay"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 850
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "H Shift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue Drift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Inject"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Echo Channels"
value_labels = ["YUV", "Y Only"]
initial_value_label = "YUV"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Drift Direction"
value_labels = ["CW", "CCW"]
initial_value_label = "CW"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Freeze"
value_labels = ["Live", "Freeze"]
initial_value_label = "Live"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Posterize Trail"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Persistence"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Long Tail"
rotary_potentiometer_1 = 970
linear_potentiometer_12 = 920
rotary_potentiometer_3 = 64

[[preset]]
name = "Spinning Wheel"
rotary_potentiometer_2 = 700
rotary_potentiometer_3 = 600
linear_potentiometer_12 = 800
