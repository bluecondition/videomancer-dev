# Embossy Program Configuration

[program]
program_id = "com.cicero.embossy"
program_name = "Embossy"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Processing", "Stylize"]
program_type = "processing"
description = "Directional emboss/relief that brings out edges as lit surfaces. Adjustable depth, light direction, and color blend."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Light Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bias"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 900
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Direction"
value_labels = ["Horizontal", "Vertical"]
initial_value_label = "Horizontal"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Color"
value_labels = ["Mono", "Recolor"]
initial_value_label = "Mono"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Edge"
value_labels = ["Smooth", "Hard"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Light Source"
value_labels = ["NW", "SE"]
initial_value_label = "NW"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Edge Offset"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 64
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Stone Carving"
toggle_switch_9 = 1
rotary_potentiometer_1 = 900

[[preset]]
name = "Color Relief"
toggle_switch_8 = 1
rotary_potentiometer_4 = 700
