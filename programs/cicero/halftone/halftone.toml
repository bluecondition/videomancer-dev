# Halftone Program Configuration

[program]
program_id = "com.cicero.halftone"
program_name = "Halftone"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Processing", "Stylize"]
program_type = "processing"
description = "Newspaper-print dot screen of incoming video. Adjustable screen angle, density, and dot shape."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Screen Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 128
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bleed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 128
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Channel"
value_labels = ["Luma", "Chroma"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Shape"
value_labels = ["Round", "Square"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Colors"
value_labels = ["Mono", "Tinted"]
initial_value_label = "Mono"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Polarity"
value_labels = ["Black/White", "White/Black"]
initial_value_label = "Black/White"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Dot Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Fine Mesh"
linear_potentiometer_12 = 128

[[preset]]
name = "Big Squares"
toggle_switch_8 = 1
linear_potentiometer_12 = 950
