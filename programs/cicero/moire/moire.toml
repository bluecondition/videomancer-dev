# Moire Program Configuration

[program]
program_id = "com.cicero.moire"
program_name = "Moire"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Render", "Pattern"]
program_type = "synthesis"
description = "Two rotated line gratings interfere to produce drifting moire fringes — the classic broadcast subcarrier look."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ring 1 Mod"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Ring 2 Mod"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Drift Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Phase Offset"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Center Sep"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Pattern"
value_labels = ["Concentric", "Linear"]
initial_value_label = "Concentric"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blend"
value_labels = ["Add", "Diff"]
initial_value_label = "Add"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Hue"
value_labels = ["Mono", "Spectrum"]
initial_value_label = "Mono"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Color Cycle"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Frequency"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Sparse Fringes"
linear_potentiometer_12 = 192

[[preset]]
name = "Linear Spectrum"
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 600
