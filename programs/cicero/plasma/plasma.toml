# Plasma Program Configuration

[program]
program_id = "com.cicero.plasma"
program_name = "Plasma"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Organic"]
program_type = "synthesis"
description = "Classic demoscene plasma: sum of four sinusoids over (x, y, x+y, x-y) with animated phase and 8-color palettes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Freq X"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Freq Y"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 320
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Freq Diag"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 192
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Hue Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Luma Mod"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mode"
value_labels = ["Smooth", "Banded"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Sum"
value_labels = ["4-Wave", "3-Wave"]
initial_value_label = "4-Wave"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wave"
value_labels = ["Sine", "Triangle"]
initial_value_label = "Sine"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Master Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Acid"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 700
rotary_potentiometer_4 = 700
toggle_switch_7 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Lava Lamp"
rotary_potentiometer_1 = 96
rotary_potentiometer_2 = 96
rotary_potentiometer_4 = 64
linear_potentiometer_12 = 256
