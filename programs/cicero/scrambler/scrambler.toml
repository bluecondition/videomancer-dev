# Scrambler Program Configuration

[program]
program_id = "com.cicero.scrambler"
program_name = "Scrambler"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Glitch", "Pixel", "Temporal"]
program_type = "processing"
description = "Address-XOR datamosh: BRAM stores incoming line and reads back at hashed (x XOR mask) positions. Slider sets scramble depth."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Block Size"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Dropout"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 900
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mode"
value_labels = ["XOR", "Reverse"]
initial_value_label = "XOR"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Animate"
value_labels = ["Static", "Drift"]
initial_value_label = "Drift"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Channels"
value_labels = ["YUV", "Y Only"]
initial_value_label = "YUV"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tint"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Scramble"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Datamosh"
rotary_potentiometer_1 = 800
rotary_potentiometer_3 = 200
linear_potentiometer_12 = 900

[[preset]]
name = "Compression"
rotary_potentiometer_1 = 200
toggle_switch_7 = 1
linear_potentiometer_12 = 700
