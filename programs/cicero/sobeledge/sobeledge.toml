# Sobeledge Program Configuration

[program]
program_id = "com.cicero.sobeledge"
program_name = "Sobeledge"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Edges", "Color", "Vision"]
program_type = "processing"
description = "Sobel edge detector with 3-line buffer, false-color magnitude, thin/thick edge mode, and bg dim."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Gx Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Gy Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Background"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Edge Color"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mode"
value_labels = ["Color", "Mono"]
initial_value_label = "Color"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Polarity"
value_labels = ["Edges Bright", "Edges Dark"]
initial_value_label = "Edges Bright"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Background"
value_labels = ["Show", "Hide"]
initial_value_label = "Show"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "False Color"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Hard Edges"
rotary_potentiometer_3 = 64
toggle_switch_9 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Soft Overlay"
rotary_potentiometer_3 = 700
linear_potentiometer_12 = 128
