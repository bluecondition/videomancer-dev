# Truchet Program Configuration

[program]
program_id = "com.cicero.truchet"
program_name = "Truchet"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Render", "Pattern"]
program_type = "synthesis"
description = "Truchet tile pattern: random-orientation diagonals form curving paths across a grid of square cells."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell Size"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Pattern Seed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 170
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Anim Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 64
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Line Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Color Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Style"
value_labels = ["Lines", "Triangles"]
initial_value_label = "Lines"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Mono", "Multi"]
initial_value_label = "Multi"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Animate"
value_labels = ["Static", "Live"]
initial_value_label = "Live"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Pattern"
value_labels = ["Lines", "Negative"]
initial_value_label = "Lines"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Fine Mesh"
linear_potentiometer_12 = 900
rotary_potentiometer_4 = 96

[[preset]]
name = "Big Blocks"
toggle_switch_7 = 1
linear_potentiometer_12 = 64
