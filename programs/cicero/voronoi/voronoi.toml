# Voronoi Program Configuration

[program]
program_id = "com.cicero.voronoi"
program_name = "Voronoi"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Pattern", "Render"]
program_type = "synthesis"
description = "Animated 8-seed Voronoi mosaic with Chebyshev/Manhattan metrics, edge glow, and density-scaled cells."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Hue Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Brightness"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Motion"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Edge Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Wobble"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Metric"
value_labels = ["Chebyshev", "Manhattan"]
initial_value_label = "Chebyshev"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Edge"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cycle"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Vibrant", "Pastel"]
initial_value_label = "Vibrant"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Bubbles"
rotary_potentiometer_3 = 200
rotary_potentiometer_6 = 700
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Sharp Cells"
rotary_potentiometer_4 = 64
rotary_potentiometer_6 = 256
toggle_switch_8 = 0
linear_potentiometer_12 = 400

[[preset]]
name = "Diamond Lattice"
rotary_potentiometer_3 = 100
rotary_potentiometer_4 = 512
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 700
