# Waveform Program Configuration

[program]
program_id = "com.cicero.waveform"
program_name = "Waveform"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "cicero"
license = "GPL-3.0"
categories = ["Render", "Signal"]
program_type = "synthesis"
description = "Triple-trace oscilloscope synthesizer with phase-locked harmonics, glow, and animated phase drift."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Amp 1"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Amp 2"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Amp 3"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Phase Drift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Line Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 96
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Sine", "Triangle"]
initial_value_label = "Sine"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Grid"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Glow"
value_labels = ["Sharp", "Soft"]
initial_value_label = "Soft"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Color Mode"
value_labels = ["Mono", "RGB"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Frequency"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Slow Rolling"
rotary_potentiometer_4 = 64
rotary_potentiometer_5 = 200
linear_potentiometer_12 = 128

[[preset]]
name = "Fast Triplet"
rotary_potentiometer_5 = 48
toggle_switch_7 = 1
linear_potentiometer_12 = 768
