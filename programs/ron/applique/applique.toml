# APPLIQUE -- flat matte regions cut from geometric patterned cloth.  See applique.vhd, DESIGN.md.
# The geometric sibling of VENEER (same matte pipeline, organic textures there).

[program]
processing_delay_clks = 84
program_id = "com.czartroniks.applique"
program_name = "Applique"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Craft", "Render", "Material"]
program_type = "processing"
description = "Re-renders video as flat regions cut from patterned cloth: quilt blocks, weaves, stripes, checks, dots and tiles."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pattern"
value_labels = ["Quilt", "Weave", "Stripe", "Check", "Dots", "Tile", "Deco", "Hatch"]
initial_value_label = "Quilt"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Colour"
value_labels = ["Source", "Tint", "Palette", "Patchwork"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Seams"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Thresholds"
value_labels = ["Fixed", "Adaptive"]
initial_value_label = "Adaptive"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Normal", "Invert"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Relief"
value_labels = ["Flat", "Embossed"]
initial_value_label = "Embossed"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Angle"
value_labels = ["Straight", "Bias"]
initial_value_label = "Straight"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Levels"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 512
display_float_digits = 0
suffix_label = ""

