# ATTRACT
#
# An arcade that plays itself.  A 1981-style board -- tile layer, sprite line
# buffer, colour PROM and a little game CPU -- runs fictional DODECA coin-ops
# in attract mode forever: BLIP the walking TV vs the moths.
#
# Every game draws from one shared sheet of 8x8 pixel art.  The program,
# the art and the game code are generated by attract.py from assets/ and
# tools/game.py.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.attract"
program_name = "Attract"
program_version = "0.3.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Game", "Pattern"]
program_type = "processing"
description = "An arcade that plays itself: DODECA coin-ops in attract mode, BLIP the walking TV vs the moths."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Game"
value_labels = ["Cycle", "Dot Matrix", "Skyline Siege", "Crosstalk"]
initial_value_label = "Cycle"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Seed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Attract"
value_labels = ["Endless", "Attract"]
initial_value_label = "Attract"
