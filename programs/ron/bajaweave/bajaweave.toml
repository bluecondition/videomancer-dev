# SPDX-License-Identifier: GPL-3.0-only
#
# Bajaweave Program Configuration
# Two FM-modulated vertical-stripe oscillators (DWO3+BAJA+FKG3 emulation).

[program]
program_id = "com.ron.bajaweave"
program_name = "Bajaweave"
program_version = "0.12.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Synthesis", "Pattern"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Two swaying line oscillators woven together in saturated complementary colour: sway, smooth flow, outlines."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Osc1 Freq"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 341
display_min_value = 0
display_max_value = 90
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Osc1 Wave"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 93
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Color"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 361
display_min_value = 0
display_max_value = 360
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Osc2 Freq"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 251
display_min_value = 0
display_max_value = 90
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Osc2 Wave"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 266
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Sway"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Toggle Switches ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Layering"
value_labels = ["Woven", "Stacked"]
initial_value_label = "Woven"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Edges"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Brightness"
value_labels = ["Normal", "Darker"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Flow"
value_labels = ["Opposite", "Same"]
initial_value_label = "Same"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Shape"
value_labels = ["Sine", "Triangle"]
initial_value_label = "Sine"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Speed"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 407
display_min_value = -100
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Default Weave"
rotary_potentiometer_1 = 341
rotary_potentiometer_2 = 93
rotary_potentiometer_3 = 361
rotary_potentiometer_4 = 251
rotary_potentiometer_5 = 266
rotary_potentiometer_6 = 256
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 1
toggle_switch_11 = 0
linear_potentiometer_12 = 407

[[preset]]
name = "Slow Drift"
rotary_potentiometer_1 = 128
rotary_potentiometer_2 = 96
rotary_potentiometer_3 = 200
rotary_potentiometer_4 = 192
rotary_potentiometer_5 = 128
rotary_potentiometer_6 = 180
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 528

[[preset]]
name = "Frantic Stripes"
rotary_potentiometer_1 = 700
rotary_potentiometer_2 = 800
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 600
rotary_potentiometer_5 = 700
rotary_potentiometer_6 = 900
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_9 = 1
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 64
