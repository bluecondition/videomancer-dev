[program]
program_id = "com.ron.bishop"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
program_name = "Bishop"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Shape", "Demo", "Computer"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Wireframe head. K2=thickness, K4=expression, T7/T8 mouth/eyes, K5 noise speed, K6 noise spread."

# --- Rotary Potentiometers (K1-K6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Thickness"
value_labels = ["1 px", "2 px", "3 px", "4 px"]
initial_value_label = "1 px"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Palette"
value_labels = ["Green", "Amber", "Cyan", "Red", "White", "Magenta", "Yellow", "Blue"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Expression"
value_labels = ["Neutral", "Happy", "Sad", "Angry", "Surprised"]
initial_value_label = "Neutral"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Noise Speed"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Noise Spread"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Toggle Switches (7-11) ---
# T7 = Mouth (Closed default / Open).  T8 = Eyes (Closed default / Open).
# Each toggles independently and layers on any K4 expression.

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mouth"
value_labels = ["Closed", "Open"]
initial_value_label = "Closed"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Eyes"
value_labels = ["Closed", "Open"]
initial_value_label = "Closed"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Noise"
value_labels = ["Smooth", "Streaks"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Grid Lines"
value_labels = ["Thin", "Thick"]
initial_value_label = "Thin"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Background"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Brightness"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 900
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Neutral"
rotary_potentiometer_1   = 512   # Scale
rotary_potentiometer_2   = 0     # Thickness = 1 px
rotary_potentiometer_3   = 0     # Palette = Green
rotary_potentiometer_4   = 0     # Expression = Neutral
rotary_potentiometer_5   = 512   # Noise Speed
rotary_potentiometer_6   = 0     # Noise Spread = off
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 0     # Noise = Smooth
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 900

[[preset]]
name = "Happy"
rotary_potentiometer_1   = 512
rotary_potentiometer_2   = 0
rotary_potentiometer_3   = 256   # Palette = Amber
rotary_potentiometer_4   = 256   # Expression = Happy
rotary_potentiometer_5   = 512   # Noise Speed
rotary_potentiometer_6   = 0     # Noise Spread = off
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 0
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 1000

[[preset]]
name = "Angry"
rotary_potentiometer_1   = 512
rotary_potentiometer_2   = 384   # Thickness = 2 px
rotary_potentiometer_3   = 384   # Palette = Red
rotary_potentiometer_4   = 768   # Expression = Angry
rotary_potentiometer_5   = 512   # Noise Speed
rotary_potentiometer_6   = 0     # Noise Spread = off
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 0
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 900

[[preset]]
name = "Surprised"
rotary_potentiometer_1   = 512
rotary_potentiometer_2   = 256
rotary_potentiometer_3   = 128   # Palette = Cyan
rotary_potentiometer_4   = 896   # Expression = Surprised
rotary_potentiometer_5   = 512   # Noise Speed
rotary_potentiometer_6   = 0     # Noise Spread = off
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 0
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 1000
