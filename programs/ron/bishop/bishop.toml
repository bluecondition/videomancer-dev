[program]
program_id = "com.ron.bishop"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
program_name = "Bishop"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Shape", "Demo", "Computer"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Wireframe head. K4=expression, T7/T8 mouth/eyes, K5 grid period, K6 grid scroll, T10 grid thickness."

# --- Rotary Potentiometers (K1-K6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Thickness"
value_labels = ["1 px", "2 px", "3 px", "4 px"]
initial_value_label = "1 px"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Palette"
value_labels = ["Green", "Amber", "Cyan", "Red", "White", "Magenta", "Yellow", "Blue"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Expression"
value_labels = ["Neutral", "Happy", "Sad", "Angry", "Surprised"]
initial_value_label = "Neutral"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Grid Period"
value_labels = ["16 px", "32 px", "64 px", "128 px"]
initial_value_label = "32 px"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Grid Scroll"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -128
display_max_value = 127
suffix_label = ""

# --- Toggle Switches (7-11) ---
# T7 = Mouth (Closed default / Open).  T8 = Eyes (Closed default / Open).
# Each toggles independently and layers on any K4 expression.

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mouth"
value_labels = ["Closed", "Open"]
initial_value_label = "Closed"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Eyes"
value_labels = ["Closed", "Open"]
initial_value_label = "Closed"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Grid"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Grid Lines"
value_labels = ["Thin", "Thick"]
initial_value_label = "Thin"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Background"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Brightness"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 900
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Neutral"
rotary_potentiometer_1   = 512   # Scale
rotary_potentiometer_2   = 0     # Thickness = 1 px
rotary_potentiometer_3   = 0     # Palette = Green
rotary_potentiometer_4   = 0     # Expression = Neutral
rotary_potentiometer_5   = 384   # Grid Period = 32 px
rotary_potentiometer_6   = 512   # Grid Scroll = stopped
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 1     # Grid on
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 900

[[preset]]
name = "Happy"
rotary_potentiometer_1   = 512
rotary_potentiometer_2   = 0
rotary_potentiometer_3   = 256   # Palette = Amber
rotary_potentiometer_4   = 256   # Expression = Happy
rotary_potentiometer_5   = 384   # 32 px grid
rotary_potentiometer_6   = 512   # Grid Scroll = stopped
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 1
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 1000

[[preset]]
name = "Angry"
rotary_potentiometer_1   = 512
rotary_potentiometer_2   = 384   # Thickness = 2 px
rotary_potentiometer_3   = 384   # Palette = Red
rotary_potentiometer_4   = 768   # Expression = Angry
rotary_potentiometer_5   = 256   # 32 px grid
rotary_potentiometer_6   = 512   # Grid Scroll = stopped
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 1
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 900

[[preset]]
name = "Surprised"
rotary_potentiometer_1   = 512
rotary_potentiometer_2   = 256
rotary_potentiometer_3   = 128   # Palette = Cyan
rotary_potentiometer_4   = 896   # Expression = Surprised
rotary_potentiometer_5   = 768   # 128 px grid (sparse)
rotary_potentiometer_6   = 512   # Grid Scroll = stopped
toggle_switch_7          = 0
toggle_switch_8          = 0
toggle_switch_9          = 1
toggle_switch_10         = 0
toggle_switch_11         = 0
linear_potentiometer_12  = 1000
