[program]
program_id = "com.ron.bishop"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
program_name = "Bishop"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Shape", "Demo", "Computer"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Wireframe head. P12 grows the head to fill the screen. K1 mouth, K2 line weight, K3 palette, K4 expression, K5/K6 noise."

# --- Rotary Potentiometers (K1-K6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Mouth"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Line Weight"
value_labels = ["1 px", "3 px", "5 px", "7 px"]
initial_value_label = "3 px"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Palette"
value_labels = ["Green", "Amber", "Cyan", "Red", "White", "Magenta", "Yellow", "Blue"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Expression"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Noise Speed"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Noise Spread"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Toggle Switches (7-11) ---
# T7 = Fill (eyes/brows/mouth solid).  T8 = Eyes blink.  Mouth is the K1 knob.

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fill"
value_labels = ["Outline", "Solid"]
initial_value_label = "Outline"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Eyes"
value_labels = ["Closed", "Open"]
initial_value_label = "Open"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Noise"
value_labels = ["Smooth", "Streaks"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Brightness"
value_labels = ["Normal", "Bright"]
initial_value_label = "Bright"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Background"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Head Size"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Neutral"
rotary_potentiometer_1   = 1023  # Mouth = open (neutral)
rotary_potentiometer_2   = 384   # Line Weight = 3 px
rotary_potentiometer_3   = 0     # Palette = Green
rotary_potentiometer_4   = 0     # Expression = Neutral
rotary_potentiometer_5   = 512   # Noise Speed
rotary_potentiometer_6   = 0     # Noise Spread = off
toggle_switch_7          = 0     # Fill = Outline
toggle_switch_8          = 0
toggle_switch_9          = 0     # Noise = Smooth
toggle_switch_10         = 1     # Brightness = Bright
toggle_switch_11         = 0
linear_potentiometer_12  = 0     # Head Size

[[preset]]
name = "Happy"
rotary_potentiometer_1   = 1023  # Mouth = open
rotary_potentiometer_2   = 384
rotary_potentiometer_3   = 256   # Palette = Amber
rotary_potentiometer_4   = 256   # Expression = Happy
rotary_potentiometer_5   = 512   # Noise Speed
rotary_potentiometer_6   = 0     # Noise Spread = off
toggle_switch_7          = 0     # Fill = Outline
toggle_switch_8          = 0
toggle_switch_9          = 0
toggle_switch_10         = 1     # Brightness = Bright
toggle_switch_11         = 0
linear_potentiometer_12  = 640   # Head Size

