[program]
program_id = "com.ron.bishop"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Bishop"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Shape", "Demo", "Computer"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Early-80s wireframe vector head: animated mouth, blinking eyes, brow tilt, color, pseudo-3D yaw/pitch."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Size"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 600
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Yaw"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -50
display_max_value = 50
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Pitch"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -50
display_max_value = 50
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Mouth"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Brow"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -50
display_max_value = 50
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Color"
value_labels = ["Green", "Amber", "Cyan", "Red", "White", "Magenta", "Yellow", "Blue"]
initial_value_label = "Green"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Speak"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blink"
value_labels = ["Off", "Auto"]
initial_value_label = "Auto"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mesh"
value_labels = ["Sparse", "Dense"]
initial_value_label = "Sparse"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Glow"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Background"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bright"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 900
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Bishop"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 200
