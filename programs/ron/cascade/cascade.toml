# HYPNOS CASCADE -- concentric circles that push each other (pure B/W, no video).
#
# Move the centre (K1/K2) and the innermost circle leads; each outer ring holds
# until the one inside reaches it, then is pushed rigidly outward -- the rings
# cascade one-by-one and NEVER overlap (a band of the other colour always
# survives between them).  Stop moving and they either glide home to concentric
# (Catch-Up=Home) or freeze in the dragged nest (Catch-Up=Stay).  Each ring stays
# a perfect circle; only the gaps change.  K4 GRADIENT shades the rings by
# ring index -- luma ramps folded over 1/2/4/8/16 rings (leftmost zone = the
# classic hard black/white) -- exact even mid-drag, since the shading rides
# the true ring index, not a radial approximation.
#
# Controls: K1/K2 Centre X/Y, K3 Period, K4 Gradient fineness; S7 Glide,
# S8 Cascade, S9 Ramp (Steps/Smooth), S10 Catch-Up (Stay/Home), S11 Video.
# EVERY RING carries its own ramp-in/out (dark edges, bright mid-ring),
# re-anchored at each true disc edge so the shading cascades with the
# rings; K4 = classic hard (left) then 2/4/8/16/32/64 gray steps within
# each ring.
# S11 Video: the rings REFRACT the incoming video -- P12 Wave sets the
# depth (off at slider bottom, +-9 px at top).  The ring field bends
# the picture horizontally like glass ripples; colour passes through
# untouched, and the circles themselves are never drawn.  (The earlier
# saturation mod was dropped -- refraction carries the mode.)
# K5/K6/P12 are spare.

[program]
program_id = "com.bluecondition.cascade"
program_version = "1.6.0"
abi_version = ">=1.0,<2.0"
program_name = "Hypnos Cascade"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Concentric circles that push each other: move the centre and rings cascade outward one-by-one, never overlapping"
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512            # centred (detent = frame centre)
display_min_value = -100
display_max_value = 100
name_label = "Center X"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512            # centred (detent = frame centre)
display_min_value = -100
display_max_value = 100
name_label = "Center Y"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 430            # ring density: ~0.5 ring across frame -> alias limit
display_min_value = 0
display_max_value = 100
name_label = "Period"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0              # GRADIENT fineness: classic / 2..64 steps WITHIN each ring
display_min_value = 0          # (zone 1 = hard black/white, the classic look)
display_max_value = 100
name_label = "Gradient"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512            # SPIRAL detent = pure circles (CCW/CW = Vertigo twist)
display_min_value = -100
display_max_value = 100
name_label = "Spare"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512            # DUTY ~50% (band A : band B width)
display_min_value = 0
display_max_value = 100
name_label = "Spare"
suffix_label = "%"

# --- Toggle Switches (7-11, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Cascade"
value_labels = ["Uniform", "Cascade"]
initial_value_label = "Cascade"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ramp"
value_labels = ["Steps", "Smooth"]
initial_value_label = "Steps"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Catch-Up"
value_labels = ["Stay", "Home"]
initial_value_label = "Home"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Output"
value_labels = ["Rings", "Video"]
initial_value_label = "Rings"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0              # Wave off at the bottom
display_min_value = 0
display_max_value = 100
name_label = "Wave"
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Cascade"                # centred rings; move the centre to see them push
rotary_potentiometer_1 = 512    # Center X (centred)
rotary_potentiometer_2 = 512    # Center Y (centred)
rotary_potentiometer_3 = 430    # Period
rotary_potentiometer_4 = 0      # Gradient: hard
rotary_potentiometer_5 = 512    # (spare)
rotary_potentiometer_6 = 512    # Duty 50%
toggle_switch_7 = 1            # Glide on
toggle_switch_8 = 1            # Cascade
toggle_switch_9 = 0            # Ramp: Steps
toggle_switch_10 = 1          # Catch-Up: Home (glide back concentric)
toggle_switch_11 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Stay Dragged"           # cascade that freezes offset instead of catching up
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 430
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 512
toggle_switch_7 = 1            # Glide on
toggle_switch_8 = 1            # Cascade
toggle_switch_9 = 0
toggle_switch_10 = 0          # Catch-Up: Stay (hold the dragged nest)
toggle_switch_11 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Fine Rings"             # many close rings -> longer cascade chain
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 680    # higher density
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 512
toggle_switch_7 = 1
toggle_switch_8 = 1            # Cascade
toggle_switch_9 = 0
toggle_switch_10 = 1          # Home
toggle_switch_11 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Ripple Glass"           # rings refract the incoming video (S11 Video + Wave)
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 680    # fine rings -> tight ripples
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 512
toggle_switch_7 = 1            # Glide on
toggle_switch_8 = 1            # Cascade
toggle_switch_9 = 1            # per-ring ramp, full res -> smooth waves
toggle_switch_10 = 1          # Home
toggle_switch_11 = 1          # Output: Video
linear_potentiometer_12 = 1023 # Wave: full depth

[[preset]]
name = "Velvet Rings"          # smooth per-ring ramp riding the cascade
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 430
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 512
toggle_switch_7 = 1
toggle_switch_8 = 1            # Cascade
toggle_switch_9 = 1            # Ramp: Smooth (per-ring, edge-anchored)
toggle_switch_10 = 1          # Home
toggle_switch_11 = 0
linear_potentiometer_12 = 0
