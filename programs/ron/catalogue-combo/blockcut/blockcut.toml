# Blockcut - Program Configuration
#
# Two catalogue effects (seed 20260917): edge detect and datamosh / block
# displacement.  Three knobs each; switches and slider set the
# interaction.  See blockcut.vhd.

[program]
program_id = "com.ron.blockcut"
program_name = "Blockcut"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Edge", "Glitch", "Grid"]
program_type = "processing"
description = "Edge-detected line drawing cut into hashed blocks that shift, hold or go negative; density on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Thresh"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 100
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Block"
control_mode = "linear"
display_min_value = 8
display_max_value = 64
initial_value = 300
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edges"
value_labels = ["White", "Tinted"]
initial_value_label = "White"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blocks"
value_labels = ["Plain", "Negative"]
initial_value_label = "Plain"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Hash"
value_labels = ["Block", "Band"]
initial_value_label = "Block"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mosh"
value_labels = ["Shift", "Hold"]
initial_value_label = "Shift"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Ink"
value_labels = ["Light", "Dark"]
initial_value_label = "Light"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Shattered"
rotary_potentiometer_1 = 600
rotary_potentiometer_4 = 100
rotary_potentiometer_5 = 800
rotary_potentiometer_6 = 900
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Smeared Ink"
rotary_potentiometer_2 = 150
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 200
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Bar Code"
rotary_potentiometer_1 = 500
rotary_potentiometer_4 = 500
rotary_potentiometer_5 = 1023
toggle_switch_9 = 1
linear_potentiometer_12 = 800
