# Cartridge - catalogue combo #15: cel shading + palette quantization.  See cartridge.vhd.

[program]
program_id = "com.ron.cartridge"
program_name = "Cartridge"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Computer", "Print", "Edges"]
program_type = "processing"
description = "Cel shading meets Gameboy, CGA, C64 and EGA palettes: ink edges, posterize levels, Bayer dither, inking slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Edge"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 120
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Levels"
value_labels = ["8 bit", "6 bit", "4 bit", "3 bit", "2 bit"]
initial_value_label = "4 bit"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Width"
value_labels = ["1 px", "2 px", "4 px", "8 px"]
initial_value_label = "2 px"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Palette"
value_labels = ["Gameboy", "CGA", "C64", "EGA"]
initial_value_label = "EGA"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Dither"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Range"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Ink"
value_labels = ["Black", "Palette"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Order"
value_labels = ["Cel First", "Palette First"]
initial_value_label = "Cel First"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Edges"
value_labels = ["Ink", "Original"]
initial_value_label = "Ink"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Luma"
value_labels = ["Palette", "Cel"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Inking"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Handheld"
rotary_potentiometer_1 = 200
rotary_potentiometer_4 = 100
rotary_potentiometer_5 = 600
toggle_switch_7 = 1

[[preset]]
name = "Comic Strip"
rotary_potentiometer_1 = 90
rotary_potentiometer_2 = 700
rotary_potentiometer_4 = 1000
toggle_switch_8 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Colour Ink"
rotary_potentiometer_4 = 600
rotary_potentiometer_6 = 400
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 300
