# Cellcam - Program Configuration
#
# Catalogue combo #86 (seed 20260923): edge detect + chroma subsampling
# + pixelation.  See cellcam.vhd.

[program]
program_id = "com.ron.cellcam"
program_name = "Cellcam"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Stylize", "Retro", "Filter"]
program_type = "processing"
description = "Pixelated cells outlined by the luma steps between them (or raw gradient edges), with held, lagged chroma and dot crawl."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell"
control_mode = "linear"
display_min_value = 2
display_max_value = 64
initial_value = 400
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 1
display_max_value = 32
initial_value = 400
display_float_digits = 0
suffix_label = "ln"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Width"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 300
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Hold"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 500
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Lag"
control_mode = "linear"
display_min_value = 0
display_max_value = 15
initial_value = 200
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edges"
value_labels = ["Over", "On black"]
initial_value_label = "Over"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Source"
value_labels = ["Cells", "Raw"]
initial_value_label = "Cells"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chroma"
value_labels = ["Hold", "Cell"]
initial_value_label = "Hold"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ink"
value_labels = ["Black", "White"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Edges"
value_labels = ["Colour", "Mono"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Crawl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Comic Cells"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 500
toggle_switch_9 = 1

[[preset]]
name = "White Wire"
rotary_potentiometer_3 = 1000
toggle_switch_7 = 1
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Raw Crawl"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 0
rotary_potentiometer_6 = 700
toggle_switch_8 = 1
linear_potentiometer_12 = 1023
