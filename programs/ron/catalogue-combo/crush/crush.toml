# Crush - Program Configuration
#
# Two catalogue effects (seed 20260919): sync loss / horizontal collapse
# and mosaic with per-cell colour averaging.  Three knobs each; switches
# and slider set the interaction.  See crush.vhd.

[program]
program_id = "com.ron.crush"
program_name = "Crush"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Grid", "Glitch", "Retro"]
program_type = "processing"
description = "Averaged mosaic cells squeezed toward a drifting line with sync-loss jitter; cells squeeze with the picture or stay square."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Line"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sync"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Roll"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Cells"
control_mode = "linear"
display_min_value = 2
display_max_value = 64
initial_value = 384
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Aspect"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Grout"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Order"
value_labels = ["Squeeze", "Square"]
initial_value_label = "Squeeze"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Collapse"
value_labels = ["Centre", "Left"]
initial_value_label = "Centre"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Loss"
value_labels = ["Lines", "Bands"]
initial_value_label = "Lines"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Beyond"
value_labels = ["Black", "Stretch"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Grout"
value_labels = ["Black", "White"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Collapse"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Tile Crush"
rotary_potentiometer_3 = 300
rotary_potentiometer_4 = 600
rotary_potentiometer_6 = 700
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Drain Left"
rotary_potentiometer_2 = 400
rotary_potentiometer_4 = 200
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Wide Mosaic"
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 700
rotary_potentiometer_6 = 500
toggle_switch_11 = 1
linear_potentiometer_12 = 0
