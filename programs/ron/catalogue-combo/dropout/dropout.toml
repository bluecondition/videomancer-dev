# Dropout - Program Configuration
#
# Catalogue combo #50 (seed 20260920): datamosh bars + head-switch noise
# band.  See dropout.vhd.

[program]
program_id = "com.ron.dropout"
program_name = "Dropout"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Glitch", "Retro", "VHS"]
program_type = "processing"
description = "Hashed datamosh bars held for N frames (smear, chroma dropout) under a rolling head-switch band with flagging skew and noise."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bars"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Distance"
control_mode = "linear"
display_min_value = 0
display_max_value = 512
initial_value = 400
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hold"
control_mode = "linear"
display_min_value = 1
display_max_value = 64
initial_value = 200
display_float_digits = 0
suffix_label = "fr"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
display_max_value = 255
initial_value = 160
display_float_digits = 0
suffix_label = "ln"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Noise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Skew"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Roll"
value_labels = ["Fixed", "Roll"]
initial_value_label = "Fixed"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Dropout"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Smear"
value_labels = ["Shift", "Smear"]
initial_value_label = "Shift"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Burst"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Noise"
value_labels = ["Snow", "Lines"]
initial_value_label = "Snow"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bands"
control_mode = "linear"
display_min_value = 8
display_max_value = 128
initial_value = 300
display_float_digits = 0
suffix_label = "ln"

[[preset]]
name = "Default"

[[preset]]
name = "P-Frame Smear"
rotary_potentiometer_1 = 600
rotary_potentiometer_3 = 800
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Bad Tracking"
rotary_potentiometer_4 = 400
rotary_potentiometer_5 = 900
rotary_potentiometer_6 = 700
toggle_switch_7 = 1
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 100

[[preset]]
name = "Fat Bars"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 0
linear_potentiometer_12 = 1023
