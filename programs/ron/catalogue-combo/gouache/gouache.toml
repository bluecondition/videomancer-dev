# Gouache - Program Configuration
#
# Catalogue combo #48 (seed 20260920): posterization + hue rotation /
# saturation crush-boost.  See gouache.vhd.

[program]
program_id = "com.ron.gouache"
program_name = "Gouache"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Colorizer", "Stylize", "Retro"]
program_type = "processing"
description = "Dithered per-channel posterize with hue rotation, a rainbow hue offset per luma band, and sat crush/boost before or after."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Luma"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 300
display_float_digits = 0
suffix_label = "b"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Chroma"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 300
display_float_digits = 0
suffix_label = "b"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Dither"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Sat"
control_mode = "linear"
display_min_value = 0
display_max_value = 400
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Order"
value_labels = ["Post-Rot", "Rot-Post"]
initial_value_label = "Post-Rot"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Sat"
value_labels = ["Before", "After"]
initial_value_label = "Before"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bands"
value_labels = ["Luma", "Chroma"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Dither"
value_labels = ["Bayer", "Noise"]
initial_value_label = "Bayer"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "Alt"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spin"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Rainbow Bands"
rotary_potentiometer_1 = 200
rotary_potentiometer_5 = 400
rotary_potentiometer_6 = 700
linear_potentiometer_12 = 600

[[preset]]
name = "Crushed Spin"
rotary_potentiometer_2 = 100
rotary_potentiometer_3 = 600
rotary_potentiometer_5 = 1023
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Op Art"
rotary_potentiometer_1 = 350
rotary_potentiometer_5 = 100
toggle_switch_11 = 1
linear_potentiometer_12 = 512
