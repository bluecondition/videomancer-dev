# Infrared - catalogue combo #10: keystone + false-colour thermal LUT.  See infrared.vhd.

[program]
program_id = "com.ron.infrared"
program_name = "Infrared"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Color", "Camera", "Analysis"]
program_type = "processing"
description = "Keystone meets false colour: thermal, ice, plasma and x-ray ramps with range, offset, isotherms, row drift and cycling heat."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Keystone"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Skew"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Zoom"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Palette"
value_labels = ["Thermal", "Ice", "Plasma", "X-Ray"]
initial_value_label = "Thermal"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Range"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Offset"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Rows"
value_labels = ["Flat", "Drift"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Iso"
value_labels = ["Off", "Lines"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Pins"
value_labels = ["Same", "Mirror"]
initial_value_label = "Same"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Luma"
value_labels = ["Palette", "Original"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Ramp"
value_labels = ["Normal", "Invert"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Heat"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Heat Map"
rotary_potentiometer_5 = 400
toggle_switch_8 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Cold Wall"
rotary_potentiometer_1 = 800
rotary_potentiometer_4 = 300
toggle_switch_7 = 1
toggle_switch_9 = 1

[[preset]]
name = "X-Ray Tilt"
rotary_potentiometer_1 = 200
rotary_potentiometer_2 = 700
rotary_potentiometer_4 = 900
toggle_switch_10 = 1
