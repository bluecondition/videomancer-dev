# Lenticular - Program Configuration
#
# Catalogue combo (2026-10-27): depth-from-luma parallax (two combos) +
# masking (every masking combo was removed) through a lenticular lens array
# (lens distortion, one combo).  The picture becomes N parallax views
# interleaved behind ridges like a 3-D postcard; P12 tilts the card.  See
# lenticular.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.lenticular"
program_name = "Lenticular"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Optics", "Illusion", "Print"]
program_type = "processing"
description = "A lenticular 3-D postcard: parallax views of the picture behind ridged lenses. Tilt to flip, wink or shimmer."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 352
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Views"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 352
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Sheen"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 480
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Card"
value_labels = ["3D", "Flip", "Holo", "Pop"]
initial_value_label = "3D"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Near"
value_labels = ["Light", "Dark"]
initial_value_label = "Light"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Wobble"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Slant"
value_labels = ["Vertical", "Diagonal"]
initial_value_label = "Vertical"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bands"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Ghost"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tilt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Wigglegram"
rotary_potentiometer_2 = 640
rotary_potentiometer_4 = 1023
toggle_switch_8 = 1

[[preset]]
name = "Flip Card"
rotary_potentiometer_2 = 0
rotary_potentiometer_6 = 384
toggle_switch_10 = 1

[[preset]]
name = "Hologram"
rotary_potentiometer_1 = 160
rotary_potentiometer_3 = 800
rotary_potentiometer_6 = 640
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Pop Wink"
rotary_potentiometer_2 = 0
rotary_potentiometer_6 = 896
toggle_switch_11 = 1

[[preset]]
name = "Raw Interleave"
rotary_potentiometer_1 = 600
rotary_potentiometer_5 = 1023
toggle_switch_9 = 1

[[preset]]
name = "Cereal Prize"
rotary_potentiometer_1 = 260
rotary_potentiometer_3 = 1023
