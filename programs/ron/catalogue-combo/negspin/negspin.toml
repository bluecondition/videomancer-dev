# Negspin - Program Configuration
#
# Catalogue combo #76 (seed 20260922): hue rotation / saturation
# + invert / negative / bit-plane isolation.  See negspin.vhd.

[program]
program_id = "com.ron.negspin"
program_name = "Negspin"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Colorizer", "Stylize", "Glitch"]
program_type = "processing"
description = "Spinning hue rotation with per-band spread and sat gain; a luma or sat bit-plane can flip the hue; luma and chroma negatives."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sat"
control_mode = "linear"
display_min_value = 0
display_max_value = 400
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Plane"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 300
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Chroma"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Luma"
value_labels = ["Normal", "Negative"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Chroma"
value_labels = ["Normal", "Negative"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Source"
value_labels = ["Luma", "Sat"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Order"
value_labels = ["Before", "After"]
initial_value_label = "Before"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spin"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Plane Flip"
rotary_potentiometer_4 = 400
rotary_potentiometer_5 = 0
toggle_switch_9 = 1
linear_potentiometer_12 = 640

[[preset]]
name = "Solar Negative"
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 800
rotary_potentiometer_5 = 1000
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 512

[[preset]]
name = "Crushed Chroma"
rotary_potentiometer_2 = 1023
rotary_potentiometer_6 = 300
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 400
