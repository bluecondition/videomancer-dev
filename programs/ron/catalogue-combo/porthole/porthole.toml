# Porthole - catalogue combo #6: spherize + Perlin displacement + warped PiP.  See porthole.vhd.

[program]
program_id = "com.ron.porthole"
program_name = "Porthole"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Optics", "Noise", "Mask"]
program_type = "processing"
description = "Warped picture-in-picture: spherize and scrolling value noise inside, original or warped outside; framed, mirrored, drifting."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Curve"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Zoom"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Noise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Size"
control_mode = "linear"
display_min_value = 10
display_max_value = 100
initial_value = 500
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Position"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Outside"
value_labels = ["Original", "Warped"]
initial_value_label = "Original"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Noise"
value_labels = ["Window", "Everywhere"]
initial_value_label = "Window"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Frame"
value_labels = ["None", "Black"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Window"
value_labels = ["Crop", "Fit"]
initial_value_label = "Fit"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Drift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Ship Window"
rotary_potentiometer_1 = 850
rotary_potentiometer_3 = 500
rotary_potentiometer_5 = 400
toggle_switch_9 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Funhouse"
rotary_potentiometer_1 = 120
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 600
rotary_potentiometer_5 = 900
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Inset Crop"
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 700
rotary_potentiometer_5 = 300
toggle_switch_11 = 0
toggle_switch_9 = 1
linear_potentiometer_12 = 600
