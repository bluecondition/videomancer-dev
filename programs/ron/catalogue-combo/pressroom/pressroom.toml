# Pressroom - Program Configuration
#
# Three catalogue effects (seed 20260919): ASCII / dither-art / halftone,
# head-switch noise band, and chroma / luma / difference key.  Two knobs
# each; switches and slider set the interaction.  See pressroom.vhd.

[program]
program_id = "com.ron.pressroom"
program_name = "Pressroom"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Dither", "Keyer", "Retro"]
program_type = "processing"
description = "Halftone screens keyed into the picture by luma or saturation, with a noisy head-switch band that can break the screen up."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell"
control_mode = "linear"
display_min_value = 4
display_max_value = 32
initial_value = 300
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Screen"
control_mode = "linear"
display_min_value = 0
display_max_value = 3
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
display_max_value = 63
initial_value = 250
display_float_digits = 0
suffix_label = " ln"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Noise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Level"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Soft"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Key"
value_labels = ["Luma", "Sat"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Halftone"
value_labels = ["Inside", "Outside"]
initial_value_label = "Inside"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ink"
value_labels = ["Dark", "Light"]
initial_value_label = "Dark"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Band"
value_labels = ["Bottom", "Rolling"]
initial_value_label = "Bottom"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Band"
value_labels = ["Noise", "Break"]
initial_value_label = "Noise"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Front Page"
rotary_potentiometer_1 = 200
rotary_potentiometer_5 = 0
rotary_potentiometer_3 = 0
linear_potentiometer_12 = 600

[[preset]]
name = "Cut Out"
rotary_potentiometer_1 = 500
rotary_potentiometer_2 = 300
rotary_potentiometer_5 = 600
rotary_potentiometer_6 = 400
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Bad Tracking"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 800
toggle_switch_9 = 1
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 512
