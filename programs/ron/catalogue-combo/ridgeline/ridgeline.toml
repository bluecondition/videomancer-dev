# Ridgeline - Program Configuration
#
# Catalogue combo #98 (seed 20260924): Perlin-style displacement + edge
# detect.  See ridgeline.vhd.

[program]
program_id = "com.ron.ridgeline"
program_name = "Ridgeline"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Stylize", "Distortion", "Generative"]
program_type = "processing"
description = "Drifting sine-noise displacement with Roberts or gradient edges on the displaced picture, or displaced edges; edges can push."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Amount"
control_mode = "linear"
display_min_value = 0
display_max_value = 255
initial_value = 300
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Edges"
control_mode = "linear"
display_min_value = 0
display_max_value = 3
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edges"
value_labels = ["Over", "On black"]
initial_value_label = "Over"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Order"
value_labels = ["Warp-Edge", "Edge-Warp"]
initial_value_label = "Warp-Edge"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chroma"
value_labels = ["Follow", "Own"]
initial_value_label = "Follow"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Push"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Octaves"
value_labels = ["One", "Two"]
initial_value_label = "One"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "White Ridges"
rotary_potentiometer_4 = 900
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Pushed Lines"
rotary_potentiometer_1 = 100
rotary_potentiometer_5 = 3
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Colour Ripple"
rotary_potentiometer_1 = 500
rotary_potentiometer_2 = 400
rotary_potentiometer_4 = 200
toggle_switch_9 = 1
linear_potentiometer_12 = 800
