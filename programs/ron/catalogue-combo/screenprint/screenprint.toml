# Screenprint - Program Configuration
#
# Catalogue combo #77 (seed 20260922): halftone + multi-source mixing.
# See screenprint.vhd.

[program]
program_id = "com.ron.screenprint"
program_name = "Screenprint"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Stylize", "Mixer", "Retro"]
program_type = "processing"
description = "Dot, diamond, square or line halftone screens (plus rosette) blended in by add, screen, multiply, difference or overlay."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell"
control_mode = "linear"
display_min_value = 4
display_max_value = 32
initial_value = 300
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 2
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Dot"
control_mode = "linear"
display_min_value = 0
display_max_value = 3
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Blend"
control_mode = "linear"
display_min_value = 0
display_max_value = 4
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Ink"
value_labels = ["Black", "Colour"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Order"
value_labels = ["Ink over", "Pic over"]
initial_value_label = "Ink over"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Chroma"
value_labels = ["Picture", "Ink"]
initial_value_label = "Picture"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Rosette"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Mix"
control_mode = "linear"
display_min_value = 10
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Pop Print"
rotary_potentiometer_1 = 500
rotary_potentiometer_4 = 600
rotary_potentiometer_5 = 5
toggle_switch_7 = 1
toggle_switch_10 = 1
toggle_switch_11 = 1

[[preset]]
name = "Screen Burn"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 300
rotary_potentiometer_6 = 800
toggle_switch_8 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Line Overlay"
rotary_potentiometer_1 = 100
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 1023
rotary_potentiometer_4 = 1023
toggle_switch_9 = 1
