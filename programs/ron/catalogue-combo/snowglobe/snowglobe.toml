# Snowglobe - Program Configuration
#
# Catalogue combo #68 (seed 20260922): pixelation + RF noise / snow / VHS
# tracking + polar warp.  See snowglobe.vhd.

[program]
program_id = "com.ron.snowglobe"
program_name = "Snowglobe"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Retro", "Distortion", "VHS"]
program_type = "processing"
description = "Pixelated cells (lens or screen space) through a sphere or tunnel lens, with per-cell or fine snow and lost-tracking lines."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cell"
control_mode = "linear"
display_min_value = 2
display_max_value = 64
initial_value = 400
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 1
display_max_value = 32
initial_value = 400
display_float_digits = 0
suffix_label = "ln"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Snow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Tracking"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 100
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bulge"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 800
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Radius"
control_mode = "linear"
display_min_value = 16
display_max_value = 783
initial_value = 600
display_float_digits = 0
suffix_label = "ln"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Cells"
value_labels = ["Lens", "Screen"]
initial_value_label = "Lens"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Snow"
value_labels = ["Fine", "Cells"]
initial_value_label = "Fine"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lens"
value_labels = ["Sphere", "Tunnel"]
initial_value_label = "Sphere"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Edges"
value_labels = ["Black", "Mirror"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Snow"
value_labels = ["Mono", "Colour"]
initial_value_label = "Mono"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Zoom"
control_mode = "linear"
display_min_value = 50
display_max_value = 200
initial_value = 340
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Chunky Storm"
rotary_potentiometer_1 = 800
rotary_potentiometer_2 = 800
rotary_potentiometer_3 = 900
toggle_switch_8 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Mosaic Tunnel"
rotary_potentiometer_1 = 500
rotary_potentiometer_2 = 300
rotary_potentiometer_5 = 1000
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Bad Reception"
rotary_potentiometer_1 = 100
rotary_potentiometer_2 = 0
rotary_potentiometer_4 = 500
rotary_potentiometer_5 = 512
linear_potentiometer_12 = 340
