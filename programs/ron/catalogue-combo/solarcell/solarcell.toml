# Solarcell - Program Configuration
#
# Catalogue combo #81 (seed 20260923): solarization + mosaic with per-cell
# colour averaging.  See solarcell.vhd.

[program]
program_id = "com.ron.solarcell"
program_name = "Solarcell"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Colorizer", "Stylize", "Retro"]
program_type = "processing"
description = "Colour-averaged mosaic cells solarized by a Sabattier fold before or after averaging; staircase threshold per row, iso lines."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 1023
initial_value = 400
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Gain"
control_mode = "linear"
display_min_value = 100
display_max_value = 500
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rows"
control_mode = "linear"
display_min_value = 1
display_max_value = 32
initial_value = 500
display_float_digits = 0
suffix_label = "ln"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Cell"
control_mode = "linear"
display_min_value = 4
display_max_value = 64
initial_value = 400
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Offset"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Chroma"
value_labels = ["Keep", "Fold"]
initial_value_label = "Keep"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Order"
value_labels = ["Solar-Mos", "Mos-Solar"]
initial_value_label = "Solar-Mos"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chroma"
value_labels = ["Average", "Sample"]
initial_value_label = "Average"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Grid"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Iso"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Staircase"
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 800
rotary_potentiometer_6 = 900
toggle_switch_7 = 1
toggle_switch_10 = 1

[[preset]]
name = "Iso Mosaic"
rotary_potentiometer_2 = 900
toggle_switch_8 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 400

[[preset]]
name = "Fine Fold"
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 600
toggle_switch_9 = 1
linear_potentiometer_12 = 800
