# Subsample - Program Configuration
#
# Two catalogue effects (seed 20260918): datamosh / block displacement and
# chroma subsampling artifacts (4:1:1, composite).  Three knobs each;
# switches and slider set the interaction.  See subsample.vhd.

[program]
program_id = "com.ron.subsample"
program_name = "Subsample"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Glitch", "Retro", "Grid"]
program_type = "processing"
description = "Chroma held every N pixels, bled and dot-crawling like a bad composite feed, cut into hashed blocks that shift or hold."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Block"
control_mode = "linear"
display_min_value = 8
display_max_value = 64
initial_value = 300
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hold"
control_mode = "linear"
display_min_value = 1
display_max_value = 32
initial_value = 400
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bleed"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 300
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Crawl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 250
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Blocks"
value_labels = ["Shift", "Hold"]
initial_value_label = "Shift"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Chroma"
value_labels = ["After", "Before"]
initial_value_label = "After"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Crawl"
value_labels = ["Checker", "Bars"]
initial_value_label = "Checker"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Moshed"
value_labels = ["Colour", "Grey"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Hold"
value_labels = ["Boxes", "Bled"]
initial_value_label = "Boxes"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "VHS Dub"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 200
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 600
rotary_potentiometer_6 = 500
toggle_switch_11 = 1
linear_potentiometer_12 = 150

[[preset]]
name = "Broken Codec"
rotary_potentiometer_1 = 100
rotary_potentiometer_2 = 700
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 1023
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Dot Crawl"
rotary_potentiometer_4 = 200
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 900
toggle_switch_9 = 1
linear_potentiometer_12 = 0
