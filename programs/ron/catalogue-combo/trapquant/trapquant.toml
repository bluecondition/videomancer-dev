# Trapquant - Program Configuration
#
# Two catalogue effects (seed 20260926, #120): perspective keystone /
# corner-pin and posterization.  Three knobs each; switches and slider set
# the interaction.  See trapquant.vhd.

[program]
program_id = "com.ron.trapquant"
program_name = "Trapquant"
program_version = "0.1.4"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Retro", "Glitch", "Stylize"]
program_type = "processing"
description = "Keystoned picture (top/bottom width, slide, tilt) posterized with dither, in source or screen space; bands ride the trapezoid."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Top"
control_mode = "linear"
display_min_value = 25
display_max_value = 225
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bottom"
control_mode = "linear"
display_min_value = 25
display_max_value = 225
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Slide"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Luma"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 400
display_float_digits = 0
suffix_label = " b"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Chroma"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 300
display_float_digits = 0
suffix_label = " b"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Dither"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edges"
value_labels = ["Fill", "Mirror"]
initial_value_label = "Fill"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Order"
value_labels = ["Source", "Screen"]
initial_value_label = "Source"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ramp"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Dither"
value_labels = ["2x2", "Lines"]
initial_value_label = "2x2"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Chroma"
value_labels = ["Poster", "Keep"]
initial_value_label = "Poster"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tilt"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Road Ahead"
rotary_potentiometer_1 = 100
rotary_potentiometer_2 = 900
rotary_potentiometer_4 = 256
rotary_potentiometer_6 = 900
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Screen Bands"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 200
rotary_potentiometer_4 = 128
rotary_potentiometer_5 = 128
rotary_potentiometer_6 = 0
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Soft Lean"
rotary_potentiometer_1 = 400
rotary_potentiometer_2 = 400
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 800
rotary_potentiometer_6 = 300
toggle_switch_11 = 1
linear_potentiometer_12 = 900
