# Vitrail - Program Configuration
#
# Three catalogue effects (seed 20260915): bloom / glow, palette
# quantization and mirror / kaleidoscope.  Two knobs each; switches and
# slider set the interaction.  See vitrail.vhd.

[program]
program_id = "com.ron.vitrail"
program_name = "Vitrail"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Mirror", "Colorizer", "Glitch"]
program_type = "processing"
description = "A strip of the picture mirrored into a kaleidoscope, posterized to a few levels, with a box bloom that can wash to white."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Strip"
control_mode = "linear"
display_min_value = 64
display_max_value = 512
initial_value = 512
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Axis"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Thresh"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Radius"
control_mode = "linear"
display_min_value = 4
display_max_value = 64
initial_value = 400
display_float_digits = 0
suffix_label = " px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Levels"
control_mode = "linear"
display_min_value = 2
display_max_value = 16
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Chroma"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bloom"
value_labels = ["Luma", "White"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Kaleido", "Tile"]
initial_value_label = "Kaleido"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Order"
value_labels = ["Pal Last", "Pal First"]
initial_value_label = "Pal Last"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Axis"
value_labels = ["Fixed", "Sweep"]
initial_value_label = "Fixed"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bloom"
value_labels = ["Lights", "Shadows"]
initial_value_label = "Lights"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 250
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Rose Window"
rotary_potentiometer_1 = 200
rotary_potentiometer_2 = 512
rotary_potentiometer_5 = 300
rotary_potentiometer_6 = 512
toggle_switch_10 = 1
linear_potentiometer_12 = 400

[[preset]]
name = "Whiteout"
rotary_potentiometer_1 = 900
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 900
rotary_potentiometer_5 = 1023
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Inkwell"
rotary_potentiometer_1 = 600
rotary_potentiometer_3 = 500
rotary_potentiometer_5 = 100
rotary_potentiometer_6 = 0
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 700
