[program]
program_id = "com.bluecondition.chromaphaser"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Chroma Phaser"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Color", "Warp"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Colour slides off a sharp luma on a travelling sine: U/V split, resonant echo trains, hue swing, bend, mirror, glow, blocks."
url = "https://github.com/lzxindustries/videomancer-sdk"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 600
display_min_value = -100
display_max_value = 100
name_label = "Rate"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 420
display_min_value = 0
display_max_value = 100
name_label = "Waves"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Tilt"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 160
display_min_value = 0
display_max_value = 180
name_label = "Spread"
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 420
display_min_value = 0
display_max_value = 100
name_label = "Resonance"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 0
display_max_value = 180
name_label = "Hue Swing"
suffix_label = "deg"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Sine", "Square"]
initial_value_label = "Sine"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bend"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Glow"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Blocks"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 380
display_min_value = 0
display_max_value = 100
name_label = "Depth"
suffix_label = "%"

