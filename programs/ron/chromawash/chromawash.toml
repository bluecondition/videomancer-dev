# Chroma Wash: generated by vm-nodes/tools/generate.ts from graphs/chromawash.json

[program]
program_id = "com.ron.chromawash"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Chroma Wash"
author = "ron"
license = "GPL-3.0"
categories = ["Color"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Proc amp, chroma H blur, 2-line V blur, chroma posterize; V-channel key against a palette. P12 fades to the source."
url = "https://github.com/lzxindustries/videomancer-sdk"

