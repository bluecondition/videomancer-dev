# DVD Logo Bouncer
#
# Classic bouncing DVD-logo screensaver: a 128x64 1-bit logo bitmap drifts
# diagonally across the screen and changes palette color on every wall hit.

[program]
program_id = "com.ron.dvdlogo"
program_name = "DVD Logo"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "Ron"
license = "GPL-3.0"
categories = ["Pattern", "Game"]
program_type = "processing"
description = "Classic bouncing DVD logo screensaver with palette-cycling color on each wall bounce"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X Spd"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y Spd"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Count"
value_labels = ["1", "2", "3", "4"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Clr Step"
control_mode = "steps_8"
display_min_value = 1
display_max_value = 8
initial_value = 128

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint"
control_mode = "steps_8"
display_min_value = 1
display_max_value = 8
initial_value = 0

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bright"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 940
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Color"
value_labels = ["Mono", "Palette"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Matte"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "BG"
value_labels = ["Video", "Black"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Pause"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Overlap"
value_labels = ["Bounce", "Mix"]
initial_value_label = "Bounce"

# --- Linear Fader (12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Classic DVD"

[[preset]]
name = "Fast Chaos"
rotary_potentiometer_1 = 768
rotary_potentiometer_2 = 640
rotary_potentiometer_4 = 384

[[preset]]
name = "Big & Slow"
rotary_potentiometer_1 = 192
rotary_potentiometer_2 = 128
rotary_potentiometer_3 = 614
