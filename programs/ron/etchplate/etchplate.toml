# Etchplate v3.0 -- "shred" rework 2026-08-04
#
# Target look (see memory etchplate-intended-look): stark 1-bit white on
# black, the picture ripped into fine strands -- ragged horizontal streaks
# off every vertical edge, vertical filaments dripping from horizontal
# edges, black tear-cuts shredding the white body.  Mostly H/V, crackling.
#
# K1 Threshold  luma cut point
# K2 Streaks    horizontal streak length off vertical edges (random per edge)
# K3 Filaments  vertical strand length below horizontal edges
# K4 Tear       black dash-cuts shredding the white body
# K6 Grain      break-up gaps inside strands and streaks
# P12 Shred     master climax: lengthens streaks/filaments, deepens tear+grain
# S7 Negate     invert B/W before everything
# S8 Body/Bones Bones: white body shows only its tear-fibres (skeleton)
# S9 Bypass     latency-matched passthru

[program]
program_id = "com.ron.etchplate"
program_version = "3.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Etchplate"
author = "ron"
license = "GPL-3.0"
categories = ["Process", "Edges"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Stark 1-bit shredder: video ripped into fine white strands on black. Ragged streaks, vertical filaments, tear-cuts."
url = "https://github.com/lzxindustries/videomancer-sdk"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Threshold"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Streaks"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Filaments"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 384
display_min_value = 0
display_max_value = 100
name_label = "Tear"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 100
name_label = "Grain"
suffix_label = "%"

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Shred"
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Negate"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mode"
value_labels = ["Body", "Bones"]
initial_value_label = "Body"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"
