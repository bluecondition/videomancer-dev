# Etchplate v3.1 -- "hatch" rework 2026-08-04
#
# Target look (see memory etchplate-intended-look): solid white, solid
# black, and coherent GROUPS OF PARALLEL SINGLE-PIXEL LINES -- hatched
# patches around every edge where the picture decomposes into thin white
# lines with clean black gaps.  No static, no per-pixel noise.
#
# K1 Threshold  luma cut point
# K2 Streaks    fringe width off edges over black (patch width, px)
# K3 Height     patch height (lines) + solo filament length
# K4 Tear       fringe depth into the white body (px)
# K6 Pitch      line/column spacing inside the groups (2..5 px)
# P12 Shred     master climax: widens/deepens/tallens all patches
# S7 Negate     invert B/W before everything
# S8 Body/Bones Bones: entire white body rendered as thin lines
# S9 Bypass     latency-matched passthru

[program]
program_id = "com.ron.etchplate"
program_version = "3.2.2"
abi_version = ">=1.0,<2.0"
program_name = "Etchplate"
author = "ron"
license = "GPL-3.0"
categories = ["Process", "Edges"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Stark 1-bit shredder: edges decompose into hatched groups of single thin white lines on black. No noise, all structure."
url = "https://github.com/lzxindustries/videomancer-sdk"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Threshold"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Streaks"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Height"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 384
display_min_value = 0
display_max_value = 100
name_label = "Tear"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 384
display_min_value = 2
display_max_value = 5
name_label = "Pitch"
suffix_label = "px"

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Shred"
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Negate"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mode"
value_labels = ["Body", "Bones"]
initial_value_label = "Body"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Thresh"
value_labels = ["Hyst", "Raw"]
initial_value_label = "Hyst"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Edges"
value_labels = ["Strict", "Loose"]
initial_value_label = "Strict"
