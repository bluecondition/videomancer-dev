[program]
processing_delay_clks = 8
program_id = "com.czartroniks.farside"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Farside"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Shape", "Mask"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "The whole Moon as a turning globe: Spin brings the far side round, Phase swings the sun from new to full."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 277
display_min_value = 0
display_max_value = 100
name_label = "Size"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "X Position"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Y Position"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 352
display_min_value = 0
display_max_value = 100
name_label = "Relief"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 360
name_label = "Turn"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = -100
display_max_value = 100
name_label = "Spin"
suffix_label = ""

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Sky"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Surface"
value_labels = ["Moon", "Video"]
initial_value_label = "Moon"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lit Side"
value_labels = ["Right", "Left"]
initial_value_label = "Right"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Earthshine"
value_labels = ["Faint", "Bright"]
initial_value_label = "Faint"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Halo"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 720
display_min_value = 0
display_max_value = 100
name_label = "Phase"
suffix_label = "%"

# --- Presets ---
# (Phase is the performance gesture: the sun swinging from behind the Moon
#  (new) to behind the viewer (full).  Spin is bipolar with a still centre.
#  Hand-typed placeholders until captured from the hardware with
#  capture_preset.sh.)

[[preset]]
name = "Slow Turn"
rotary_potentiometer_1 = 277
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 352
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 640
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 720

[[preset]]
name = "Far Side"
rotary_potentiometer_1 = 277
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 352
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 512
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Day And Night"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 520
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 800
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 1
toggle_switch_11 = 0
linear_potentiometer_12 = 512

[[preset]]
name = "Video Globe"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 600
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 700
toggle_switch_7 = 0
toggle_switch_8 = 1
