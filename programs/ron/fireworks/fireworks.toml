rotary_potentiometer_6 = 700
toggle_switch_7 = 1
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 1
toggle_switch_11 = 0
linear_potentiometer_12 = 640

[[preset]]
