rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 64
rotary_potentiometer_6 = 640
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 1
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 512

[[preset]]
name = "Quiet Night"
rotary_potentiometer_1 = 300
