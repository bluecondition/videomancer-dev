# FLATLINE (build A) -- bilateral + edge lines + temporal vote.  The drop shadow,
# soft quantization, XDoG and Canny live in the sibling builds (see DESIGN.md).

[program]
processing_delay_clks = 84
program_id = "com.czartroniks.flatline"
program_name = "Flatline"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Edges", "Render", "Analysis"]
program_type = "processing"
description = "Flatline A: separable bilateral smoothing, flat mattes with region-boundary ink, temporal vote. Raw video on the wipe."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Smoother"
value_labels = ["Off", "Bilateral"]
initial_value_label = "Bilateral"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Strength"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Levels"
value_labels = ["2", "3", "4", "5", "6", "7", "8", "8 Coarse"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Lines"
value_labels = ["None", "Edge", "Edge White", "Edge Bold"]
initial_value_label = "Edge"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Shadow n/a"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Quant n/a"
value_labels = ["Hard", "(n/a)"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Levels"
value_labels = ["Fixed", "Adaptive"]
initial_value_label = "Adaptive"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cleanup"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Temporal"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "View"
value_labels = ["Final", "Lines"]
initial_value_label = "Final"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wipe"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

