# Fringe — a moiré interference instrument.
#
# Two layers of transparent black-and-white line-work over a solid field.
# Ten procedural textures per layer, each infinite and seamless at any scale;
# where the two layers' pitches, forms or phases approach one another, large
# interference fringes bloom across the frame.
#
# Nothing animates by itself.  Scale, X phase and the slider's Y phase are
# smoothed by a subtle one-pole glide (~16 frames); texture select and every
# switch snap instantly.  All motion is performed.
#
# Author: bluecondition

[program]
program_id = "com.bluecondition.fringe"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Fringe"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Illusion", "Pattern", "Optics", "Grid"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Moire instrument: two transparent black-and-white line textures overlaid, scale and phase performed by hand."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Layer A ---------------------------------------------------------------

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Texture A"
value_labels = ["Circles", "Squares", "Spokes", "Wavy H", "Wavy V",
                "Diagonal", "Grid", "Hex", "Checker", "Brick"]
initial_value_label = "Circles"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Scale A"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Phase A"
suffix_label = "%"

# --- Layer B ---------------------------------------------------------------

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Texture B"
value_labels = ["Circles", "Squares", "Spokes", "Wavy H", "Wavy V",
                "Diagonal", "Grid", "Hex", "Checker", "Brick"]
initial_value_label = "Circles"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 560
display_min_value = 0
display_max_value = 100
name_label = "Scale B"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Phase B"
suffix_label = "%"

# --- Performance slider: Y phase of whichever layer is on top --------------

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Y Phase"
suffix_label = "%"

# --- Switches --------------------------------------------------------------

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Invert A"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Invert B"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Order"
value_labels = ["B Front", "A Front"]
initial_value_label = "B Front"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Backgrnd"
value_labels = ["Black", "White"]
initial_value_label = "White"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Inv Mode"
value_labels = ["Mask", "Colour"]
initial_value_label = "Mask"

