[program]
program_id = "com.ron.gilt"
program_version = "3.1.2"
abi_version = ">=1.0,<2.0"
program_name = "Gilt"
author = "ron"
license = "GPL-3.0"
categories = ["Color", "Render", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Klimt gold paint swimming in oil: luma or chroma picks 16 ornament textures - dots, rings, spirals, squares, eyes, mosaic."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Theme"
value_labels = ["Adele", "Kiss", "Tree of Life", "Danae", "Stoclet", "Frieze", "Mosaic", "Oil", "Spirals", "Eyes", "Dots", "Squares", "Garden", "Byzantine", "Jewels", "All"]
initial_value_label = "Adele"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Poster"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
value_labels = ["16 px", "32 px", "64 px", "128 px"]
initial_value_label = "64 px"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Contrast"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = 0
display_max_value = 100
name_label = "Ink"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = 0
display_max_value = 100
name_label = "Density"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Map"
value_labels = ["Luma", "Chroma"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Flow"
value_labels = ["Luma X", "Luma Y"]
initial_value_label = "Luma X"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Outline"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "UV Test"
value_labels = ["Standard", "Swapped"]
initial_value_label = "Standard"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = 0
display_max_value = 100
name_label = "Swirl"
suffix_label = "%"

