[program]
program_id = "com.ron.gilt"
program_version = "0.9.1"
abi_version = ">=1.0,<2.0"
program_name = "Gilt"
author = "ron"
license = "GPL-3.0"
categories = ["Color", "Render", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Video re-rendered as a Klimt Golden Phase painting: flesh stays human, everything else becomes gold leaf, mosaic and ornament."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 563
display_min_value = 0
display_max_value = 100
name_label = "Flesh"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 460
display_min_value = 0
display_max_value = 100
name_label = "Patina"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 614
display_min_value = 0
