[program]
program_id = "com.ron.gilt"
program_version = "2.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Gilt"
author = "ron"
license = "GPL-3.0"
categories = ["Material", "Pattern", "Color"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Video as a Klimt Golden Phase painting: gold-brown painted picture, porcelain faces, ornament placed by its light and colour."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Figure"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 460
display_min_value = 0
display_max_value = 100
suffix_label = "%"

