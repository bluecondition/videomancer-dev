min_value = 0
max_value = 1023
initial_value = 716
display_min_value = 0
display_max_value = 100
name_label = "Chaos"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Flow"
value_labels = ["Luma X", "Luma Y"]
initial_value_label = "Luma X"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Outline"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Luma"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bank"
value_labels = ["Adele", "Kiss"]
initial_value_label = "Adele"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Halo"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
name_label = "Gild"
suffix_label = "%"

