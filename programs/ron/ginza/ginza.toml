[program]
processing_delay_clks = 40
program_id = "com.czartroniks.ginza"
program_version = "0.4.0"
abi_version = ">=1.0,<2.0"
program_name = "Ginza"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Color", "Geometric"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "The picture as a 1930s Japanese poster: striped pillars, kanji bars, beams with text, olive ground, a disc, a ring, an echo."
url = "https://github.com/lzxindustries/videomancer-sdk"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Ink"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 352
display_min_value = 0
display_max_value = 100
name_label = "Grid"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 768
display_min_value = -4
display_max_value = 4
name_label = "Slant"
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 8
name_label = "Register"
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 350
display_min_value = 0
display_max_value = 100
name_label = "Circles"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Grain"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Pillars"
value_labels = ["Thin", "Wide"]
initial_value_label = "Thin"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Echo"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Faces"
value_labels = ["Flat", "Striped"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Lettering"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Paper"
value_labels = ["Cream", "Night"]
initial_value_label = "Cream"

# --- Linear Potentiometer (Slider 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 450
display_min_value = 0
display_max_value = 100
name_label = "Depth"
suffix_label = "%"
