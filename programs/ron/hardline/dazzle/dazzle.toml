# Dazzle - Hardline (v0.1.0, 2026-11-15).  Dazzle camouflage: the screen cut into hard-edged shards, each
# filled with bold stripes that run against its neighbours'.  Black and white; the camera bends the stripes.
# See dazzle.vhd, dazzle.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.dazzle"
program_name = "Dazzle"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Dazzle camouflage: shards of clashing black and white stripes. Scatter the cuts; the camera bends the stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Cuts"
value_labels = ["2", "3", "4", "5", "6", "7", "8"]
initial_value_label = "6"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Turn"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fill"
value_labels = ["Stripes", "Checks"]
initial_value_label = "Stripes"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Angles"
value_labels = ["Free", "Square"]
initial_value_label = "Free"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Scatter"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Drydock"

[[preset]]
name = "Pinwheel"
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 1023
linear_potentiometer_12 = 0

[[preset]]
name = "Wadsworth"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 300
toggle_switch_9 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Harlequin"
rotary_potentiometer_3 = 640
rotary_potentiometer_4 = 830
rotary_potentiometer_5 = 700
toggle_switch_8 = 1
linear_potentiometer_12 = 760

[[preset]]
name = "Pinstripe"
rotary_potentiometer_3 = 380
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 420
toggle_switch_10 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Tartan"
rotary_potentiometer_3 = 560
rotary_potentiometer_4 = 340
toggle_switch_8 = 1
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 512
