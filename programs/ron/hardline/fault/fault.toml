# FAULT - Hardline set (v0.1.0, 2026-11-15).  A perfect ring target cut into strips, the strips slid along
# the cut (Marina Apollonio's "Dinamica circolare", Soto's dislocations).  Black and white only; nothing
# moves by itself.  See fault.vhd, fault.py and SUMMARY.md.

[program]
processing_delay_clks = 40
program_id = "com.czartroniks.fault"
program_name = "Fault"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Op-art ring target cut into strips or tiles that slip along the cut; the camera bends the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512            # detent = frame centre; ends = 2 screens off
display_min_value = -100
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 614            # ring spacing 448 -> 14 px (of 1080 lines), exponential; 56 px here
display_min_value = 0
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Slices"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 526            # strip height 640 -> 20 px, exponential; 108 px here
display_min_value = 0
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Angle"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512            # detent = horizontal cuts; ends = vertical
display_min_value = -90
display_max_value = 90
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023           # how hard the video bends the rings (2.5 periods at white)
display_min_value = 0
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Cut"
value_labels = ["Strips", "Tiles"]
initial_value_label = "Strips"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Order"
value_labels = ["Alternate", "Staircase"]
initial_value_label = "Alternate"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Slip"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 618            # centre = unbroken rings; +-3.9 ring periods at the ends; 0.75 here
display_min_value = -100
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

