# Fresnel - Hardline (v0.2.0, 2026-11-16; v0.1.0 2026-11-15).  Zone plates and their moire: two displaced plates beat into
# straight stripes that march as the rings stream (P12 Speed).  Black and white; the camera bends the rings
# and is never shown.  See fresnel.vhd, fresnel.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.fresnel"
program_name = "Fresnel"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Zone plates in black and white: rings stream from the centre, two plates beat into marching moire. Video bends them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 526
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 505
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Form"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Turn"
control_mode = "linear"
display_min_value = 0
display_max_value = 180
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Pair"
value_labels = ["Single", "Pair"]
initial_value_label = "Pair"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ghosts"
value_labels = ["Clean", "Raw"]
initial_value_label = "Clean"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 850
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Moire"

[[preset]]
name = "Zone Plate"
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 520
toggle_switch_8 = 0

[[preset]]
name = "Warp"
rotary_potentiometer_1 = 532
rotary_potentiometer_2 = 500
rotary_potentiometer_3 = 520
linear_potentiometer_12 = 1023

[[preset]]
name = "Still"
linear_potentiometer_12 = 512

[[preset]]
name = "Saddle"
rotary_potentiometer_3 = 560
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 128

[[preset]]
name = "Chirp Bars"
rotary_potentiometer_3 = 680
rotary_potentiometer_4 = 450
rotary_potentiometer_5 = 200
toggle_switch_8 = 0

[[preset]]
name = "Ghost Plates"
rotary_potentiometer_1 = 512
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 330
toggle_switch_8 = 0
toggle_switch_9 = 1

[[preset]]
name = "Pencil Web"
rotary_potentiometer_1 = 545
rotary_potentiometer_2 = 490
rotary_potentiometer_3 = 700
toggle_switch_10 = 1
