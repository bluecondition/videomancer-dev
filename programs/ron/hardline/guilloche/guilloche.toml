# Guilloche - Hardline (v0.1.0, 2026-11-22).  Banknote engine-turned lace: M phase-shifted copies of one wave,
# filled by parity into braided lozenges; three laces of different counts and wavelengths overlaid per band.
# P12 morphs the wave from triangle through sine to cusped cycloid; the camera bends the lace.  Black and white.
# See guilloche.vhd, guilloche.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.guilloche"
program_name = "Guilloche"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Print", "Pattern", "Curve"]
program_type = "processing"
description = "Banknote guilloche lace in black and white: shifted copies of one wave woven into bands. Slider: wave shape."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Lines"
value_labels = ["2", "3", "4", "6", "8", "12", "16", "24"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Bands", "Sheet"]
initial_value_label = "Bands"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Layers"
value_labels = ["Single", "Triple"]
initial_value_label = "Triple"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Cam"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Banknote"

[[preset]]
name = "Diamonds"
rotary_potentiometer_4 = 576
linear_potentiometer_12 = 0

[[preset]]
name = "Gothic Lace"
rotary_potentiometer_3 = 640
toggle_switch_8 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Engraving"
rotary_potentiometer_3 = 640
rotary_potentiometer_4 = 576
toggle_switch_10 = 1

[[preset]]
name = "Rope"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 192
toggle_switch_9 = 0

[[preset]]
name = "Still"
rotary_potentiometer_5 = 512
