# Kagome - Hardline (v0.1.0, 2026-11-22).  The triaxial bamboo basket weave: white strips in three directions,
# truly woven over and under on black, hexagonal eyes ringed by small triangles; the basket turns and glides.
# Black and white; the camera widens the canes (bright closes the eyes) and is never shown.
# See kagome.vhd, kagome.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.kagome"
program_name = "Kagome"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Material", "Pattern"]
program_type = "processing"
description = "Kagome basket weave in black and white: three strip families woven over and under. It turns; video swells the canes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 440
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Shift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Strand"
value_labels = ["Single", "Double"]
initial_value_label = "Single"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shade"
value_labels = ["Flat", "Shade"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Weave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Kagome"

[[preset]]
name = "Chair Cane"
rotary_potentiometer_3 = 520
toggle_switch_8 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Bamboo Tubes"
rotary_potentiometer_3 = 600
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 540

[[preset]]
name = "Wire Weave"
rotary_potentiometer_3 = 380
toggle_switch_10 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Six-Way Knots"
rotary_potentiometer_4 = 1023
linear_potentiometer_12 = 600

[[preset]]
name = "Tight Basket"
rotary_potentiometer_5 = 600
linear_potentiometer_12 = 1023

[[preset]]
name = "Star Lattice"
rotary_potentiometer_3 = 300
linear_potentiometer_12 = 60
