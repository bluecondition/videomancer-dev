# Kinegram - Hardline (v0.2.0, 2026-11-16).  A barrier-grid animation (Scanimation, kinegrams, "magic
# moving pictures"): the picture is N interleaved slivers of N frames of a ring target (or a spoked
# wheel), seen through a sheet of black bars with clear slits.  The sheet slides by itself at the
# slider's Speed (up = forward, down = backward, centre = stopped on a clean frame): one sliver of
# travel steps the frame, so the animation plays.  The camera pushes the sheet locally.  Black and white.  See kinegram.vhd, kinegram.py and SUMMARY.md.

[program]
processing_delay_clks = 39
program_id = "com.czartroniks.kinegram"
program_name = "Kinegram"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Barrier-grid animation: rings or spokes in N interleaved frames, played by a sliding slit sheet."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 636
display_min_value = 0
display_max_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Frames"
value_labels = ["2", "3", "4", "5", "6", "7", "8"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Pitch"
control_mode = "linear"
min_value = 0
