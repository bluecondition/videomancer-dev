# Scallop - Hardline (v0.1.0, 2026-11-15).  Seigaiha: rows of overlapping concentric-arc scales in black and
# white; the slider opens the fan, the camera bends the arcs inside each scale.
# See scallop.vhd, scallop.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.scallop"
program_name = "Scallop"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Print", "Illusion"]
program_type = "processing"
description = "Seigaiha wave scales in black and white: arc fans that open on the slider; video bends the arcs."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 760
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rings"
value_labels = ["1", "2", "3", "4", "5", "6", "7", "8"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Overlap"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Round", "Pointed"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shade"
value_labels = ["Flat", "Shade"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 683
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Seigaiha"

[[preset]]
name = "Shell"
rotary_potentiometer_3 = 830
rotary_potentiometer_4 = 320
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Deco Fan"
rotary_potentiometer_3 = 880
rotary_potentiometer_4 = 704
rotary_potentiometer_5 = 300
toggle_switch_10 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Chevron"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 320
toggle_switch_8 = 1

[[preset]]
name = "Buds"
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 320
rotary_potentiometer_5 = 1023
linear_potentiometer_12 = 200

[[preset]]
name = "Dragon Scale"
rotary_potentiometer_3 = 720
rotary_potentiometer_4 = 192
rotary_potentiometer_5 = 900
toggle_switch_9 = 1
linear_potentiometer_12 = 760
