# Streamline - Hardline (v0.1.0, 2026-11-22).  Potential flow past a cylinder: level black-and-white bands part
# round a solid disc, squeeze over it and close behind; dashes run along the streamlines; spin lifts the flow.
# See streamline.vhd, streamline.py and SUMMARY.md.

[program]
processing_delay_clks = 49
program_id = "com.czartroniks.streamline"
program_name = "Streamline"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Warp"]
program_type = "processing"
description = "Flow past a cylinder in black and white: bands part round a disc, dashes run along them, spin lifts it, video bends it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 416
display_min_value = -100
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
