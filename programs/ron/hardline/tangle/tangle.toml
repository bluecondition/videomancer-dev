# Tangle - Hardline (v0.1.0, 2026-11-15).  Truchet tiles in Cyril Stanley Smith's quarter-arc form, several
# concentric arcs per tile, joining into endless ribbons of parallel lines; black and white.  The camera turns
# the tiles and swells the lines.  See tangle.vhd, tangle.py and SUMMARY.md.

[program]
processing_delay_clks = 48
program_id = "com.czartroniks.tangle"
program_name = "Tangle"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Pattern", "Grid"]
program_type = "processing"
description = "Truchet ribbons of parallel lines in black and white. Bend them from elbows to arcs to diagonals."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 668
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Lines"
value_labels = ["1", "2", "3", "4", "5", "6", "7", "8"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Order"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fill"
value_labels = ["Lines", "Blobs"]
initial_value_label = "Lines"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shade"
value_labels = ["Flat", "Shade"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Tangle"

[[preset]]
name = "Circles"
rotary_potentiometer_3 = 760
rotary_potentiometer_5 = 1023

[[preset]]
name = "Circuit"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 320
toggle_switch_10 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "10 PRINT"
rotary_potentiometer_3 = 330
rotary_potentiometer_4 = 64
linear_potentiometer_12 = 1023

[[preset]]
name = "Blobs"
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 320
toggle_switch_8 = 1

[[preset]]
name = "Pipes"
rotary_potentiometer_3 = 850
rotary_potentiometer_4 = 192
rotary_potentiometer_5 = 0
toggle_switch_9 = 1
toggle_switch_10 = 1
