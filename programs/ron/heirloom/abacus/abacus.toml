# Abacus - Heirloom #42, rebuilt 2026-10-27 (v0.5.0) from WIN_20230605_01_03_50; phase 2 v0.6.0 2026-10-28.
# Rows of glossy red beads between wavy blue/green bands: one measured scalar field (a knot grid) through
# one measured palette, plus a measured gloss layer (glints, lenses, eyes).  v0.6: every bead resized in its
# own slot (Width / Height); v0.6.1: Slide / Roll pulse each bead's / row's size on its own;
# v0.6.2: S11 Theme (Photo / Gold) replaces Source (the camera Etch is always on; K6 = 0 turns it off);
# v0.6.3: S9 V Mirror (top / bottom about the screen centre) replaces Stack (the rows are always mirrored).  See abacus.vhd, abacus.py and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.abacus"
program_name = "Abacus"
program_version = "0.6.3"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Grid", "Shape"]
program_type = "processing"
description = "Rows of glossy red beads between wavy blue and green bands; each bead swells and shrinks on its own as it slides and rolls."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Width"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Height"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rims"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Slide"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Roll"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Photo", "Swap"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "V Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Theme"
value_labels = ["Photo", "Gold"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Swell"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 0

[[preset]]
name = "Twin Rods"
toggle_switch_7 = 1
rotary_potentiometer_4 = 512

[[preset]]
name = "Red Bars"
linear_potentiometer_12 = 900
rotary_potentiometer_3 = 760

[[preset]]
name = "Pips"
linear_potentiometer_12 = 60
rotary_potentiometer_1 = 300

[[preset]]
name = "Blue Beads"
toggle_switch_8 = 1
rotary_potentiometer_5 = 600

[[preset]]
name = "Breathing"
rotary_potentiometer_4 = 980
rotary_potentiometer_5 = 330

[[preset]]
name = "Pillars"
rotary_potentiometer_1 = 820
rotary_potentiometer_2 = 900
rotary_potentiometer_3 = 820

[[preset]]
name = "Gold"
toggle_switch_11 = 1
rotary_potentiometer_5 = 700
