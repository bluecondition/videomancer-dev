# Archway - Heirloom #36 (2026-10-20), from WIN_20230523_01_26_43.
# A tall arch of cyan/blue parabola rays, stepped colour blocks on its flanks.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.archway"
program_name = "Archway"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Shape", "Pattern"]
program_type = "processing"
description = "A tall arch of thin cyan and blue parabola rays over the darkened picture, pink and yellow blocks on the flanks."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rays"
value_labels = ["4", "8", "16", "32", "64", "128", "256", "512"]
initial_value_label = "16"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blocks"
value_labels = ["32", "64", "128", "256"]
initial_value_label = "64"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
value_labels = ["Cyan", "Yellow", "Magenta", "Green"]
initial_value_label = "Cyan"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Rays"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Flanks"
value_labels = ["Blocks", "Picture"]
initial_value_label = "Blocks"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chevron"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Arch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Needle"
rotary_potentiometer_1 = 400
linear_potentiometer_12 = 900

[[preset]]
name = "Wide Gate"
rotary_potentiometer_6 = 900
toggle_switch_8 = 1
linear_potentiometer_12 = 40

[[preset]]
name = "Magenta Flow"
rotary_potentiometer_4 = 640
rotary_potentiometer_5 = 800
toggle_switch_9 = 1
linear_potentiometer_12 = 300
