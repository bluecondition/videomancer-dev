# Argus - Heirloom #21, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230325_11_04_55.
# Camera silhouettes folded top to bottom into olive keys; a horizontal ramp reset by the silhouettes and
# sped up by their low-passed darkness echoes every trailing edge in bunching sawtooth ribs, coloured by an
# RGB colourizer (G = |H-V + V-triangle|, R = |x| x vertical ramp, B = the saw).  See argus.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.argus"
program_name = "Argus"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Pattern", "Color"]
program_type = "processing"
description = "Camera silhouettes folded into olive keys, echoed by bunching pastel ribs: a reset-and-FM ramp through an RGB colourizer."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Echo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shadow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Tint"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Grain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Fold", "Repeat"]
initial_value_label = "Fold"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Specks"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Swap"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Kaleido"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Ribs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"
toggle_switch_11 = 1

[[preset]]
name = "Zip"
toggle_switch_11 = 1
linear_potentiometer_12 = 900
rotary_potentiometer_1 = 760

[[preset]]
name = "Broad Bands"
toggle_switch_11 = 1
linear_potentiometer_12 = 120
rotary_potentiometer_5 = 300

[[preset]]
name = "Kaleido"
toggle_switch_10 = 1
toggle_switch_11 = 1
rotary_potentiometer_3 = 300

[[preset]]
name = "Camera Echo"
rotary_potentiometer_1 = 700
rotary_potentiometer_4 = 760
