# Argyle - Heirloom #8, v0.5.0 (2026-10-21): rebuilt from the photo WIN_20230207_23_50_54.
# A lattice of nested diamonds: magenta lens-shaped cores, fine pink/white -> lavender -> blue -> cyan/green
# rings, green and cyan junctions, big/small cores alternating.  See argyle.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.argyle"
program_name = "Argyle"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Grid", "Illusion"]
program_type = "processing"
description = "Nested-diamond lattice: magenta cores in fine neon rings, green and cyan junctions; video bends the field."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Columns"
control_mode = "linear"
display_min_value = 2
display_max_value = 16
initial_value = 389
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 1
display_max_value = 10
initial_value = 357
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Pairs"
control_mode = "linear"
display_min_value = 0
display_max_value = 400
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 648
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 394
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Fringe"
control_mode = "linear"
display_min_value = 0
display_max_value = 64
initial_value = 240
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Saw"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Hard"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shape"
value_labels = ["Lens", "Diamond"]
initial_value_label = "Lens"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Neon", "Warm"]
initial_value_label = "Neon"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Cores"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Flat Argyle"
linear_potentiometer_12 = 1023

[[preset]]
name = "Soft Rings"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 760

[[preset]]
name = "Chevrons"
toggle_switch_7 = 1
rotary_potentiometer_2 = 160

[[preset]]
name = "Amber Quilt"
toggle_switch_10 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Big Diamonds"
rotary_potentiometer_1 = 150
rotary_potentiometer_2 = 130
rotary_potentiometer_3 = 600
