# Argyle - Heirloom #8 (2026-10-20), from WIN_20230207_23_50_54.
# Diamond lattice of nested rhombus rings. See argyle.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.argyle"
program_name = "Argyle"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Grid", "Illusion"]
program_type = "processing"
description = "A quilt of nested rhombus rings, magenta cores ringed in fine blue, green and pink, the picture etched into them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 960
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Aspect"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 250
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Glow"
control_mode = "linear"
display_min_value = 50
display_max_value = 100
initial_value = 900
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Brick"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Rings"
value_labels = ["Smooth", "Hard"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Magenta", "Amber"]
initial_value_label = "Magenta"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Lattice"
value_labels = ["Mirror", "Tile"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Big Diamonds"
rotary_potentiometer_1 = 300
linear_potentiometer_12 = 150

[[preset]]
name = "Amber Scales"
toggle_switch_7 = 1
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Fine Quilt"
rotary_potentiometer_1 = 1023
toggle_switch_8 = 1
linear_potentiometer_12 = 900
