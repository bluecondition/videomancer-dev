# Batwing - Heirloom (video phase), built 2026-11-09 (v0.1.0) from the clip WIN_20230927_23_58_07 at 2.5 s.
# Mirrored magenta bat-wing kaleido: a lilac bowtie inside rolling violet / yellow / dark-green contour bands, magenta
# seams that pinch into a dark-green waist and a magenta dome under every bowtie.  See batwing.vhd, batwing.py, SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.batwing"
program_name = "Batwing"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Pattern", "Mask"]
program_type = "processing"
description = "Mirrored magenta bat-wing kaleido: a lilac bowtie in rolling violet, yellow and green bands, magenta seams."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Roll"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 772
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Waist"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 120
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Zigzag"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Colours"
value_labels = ["Magenta", "Meadow"]
initial_value_label = "Magenta"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wingspan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Folded"
linear_potentiometer_12 = 0
rotary_potentiometer_2 = 640

[[preset]]
name = "Chevrons"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 700

[[preset]]
name = "Meadow Zigzag"
toggle_switch_8 = 1
toggle_switch_9 = 1
rotary_potentiometer_1 = 760
linear_potentiometer_12 = 600

[[preset]]
name = "Hex Cells"
toggle_switch_10 = 1
toggle_switch_9 = 1
rotary_potentiometer_4 = 640

[[preset]]
name = "Hard Sync"
toggle_switch_7 = 1
rotary_potentiometer_1 = 640

[[preset]]
name = "Dense Roll"
rotary_potentiometer_2 = 760
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 860

[[preset]]
name = "Pinched"
rotary_potentiometer_5 = 1023
rotary_potentiometer_1 = 420
