# Beacon - Heirloom #26, rebuilt 2026-10-27 from WIN_20230424_23_53_49; phase 2 v0.6.0 2026-10-29.
# A candle flame over a hyperbolic bell and cone, keyed into blue/black bars that fade
# around the light. See beacon.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.beacon"
program_name = "Beacon"
program_version = "0.6.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Glitch"]
program_type = "processing"
description = "A blue candle flame on a bell-shaped tower keyed into rolling, swelling bars; the camera is warped into the flame."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bars"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Columns"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Dusk"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 635
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
