# Blossom - Heirloom #22, v0.6.0 (2026-10-30, phase 2): rebuilt from the photo WIN_20230406_23_49_00.
# Magenta hearts and lobes in rows mirrored top/bottom, wrapped in red, pink, green and violet bands,
# running into a flat magenta flood: one fitted field through a two-palette colourizer.
# See blossom.vhd, blossom.py (fitted data) and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.blossom"
program_name = "Blossom"
program_version = "0.6.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Color"]
program_type = "processing"
description = "Rows of magenta hearts in red, green and violet bands cascade, sway, twist and beat; Bloom floods them magenta."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rows"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Garden"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Sway"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Breathe"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Photo", "Indigo"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Edge"
value_labels = ["Soft", "Hard"]
initial_value_label = "Soft"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wave"
value_labels = ["Fold", "Twist"]
initial_value_label = "Fold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bloom"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Blossom"

[[preset]]
name = "Closed Buds"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 300

[[preset]]
name = "Full Bloom"
linear_potentiometer_12 = 1023
rotary_potentiometer_6 = 700

[[preset]]
name = "Twin Hearts"
toggle_switch_7 = 1
rotary_potentiometer_1 = 260

[[preset]]
name = "Indigo Garden"
toggle_switch_8 = 1
rotary_potentiometer_2 = 820
rotary_potentiometer_3 = 760

[[preset]]
name = "Tower"
toggle_switch_7 = 1
rotary_potentiometer_1 = 1023
rotary_potentiometer_6 = 600

[[preset]]
name = "Ribbon"
