# Blossom - Heirloom #22 (2026-10-20), from WIN_20230406_23_49_00.
# Nested chevron petals opening from the centre against flat magenta.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.blossom"
program_name = "Blossom"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Transition"]
program_type = "processing"
description = "Nested red, green and magenta chevron petals open across flat magenta; the picture etches into the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Ragged"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Centre"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Garden", "Ember"]
initial_value_label = "Garden"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Rings"
value_labels = ["Colour", "Solid"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Lobes"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Open"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 620
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Closed Bud"
linear_potentiometer_12 = 150

[[preset]]
name = "Ember Field"
rotary_potentiometer_1 = 500
toggle_switch_8 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Solid Osc"
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 800
