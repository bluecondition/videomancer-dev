# Bottleneck - Heirloom #28, rebuilt 2026-10-27 (v0.5.0) from WIN_20230429_22_57_43.
# Two lathe bottles (lime necks, pink bodies, glass rims) on halo'd horizontal stripes, cut by sliding
# glitch blocks and a staircase.  See bottleneck.vhd, bottleneck.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.bottleneck"
program_name = "Bottleneck"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Glitch", "Mask"]
program_type = "processing"
description = "Two glass bottles, lime necks and pink bodies, on glowing stripes, torn by sliding glitch blocks. Shatter on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Width"
control_mode = "linear"
display_min_value = -128
display_max_value = 128
initial_value = 512
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Spread"
control_mode = "linear"
display_min_value = -128
display_max_value = 128
initial_value = 512
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Level"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Stripes"
control_mode = "linear"
display_min_value = -256
display_max_value = 256
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bottles"
value_labels = ["Two", "One"]
initial_value_label = "Two"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Hold"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Rims"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Photo", "Negative"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shatter"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Clean Glass"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 600

[[preset]]
name = "Shattered"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 760

[[preset]]
name = "Full Bottles"
rotary_potentiometer_3 = 900
rotary_potentiometer_1 = 700

[[preset]]
name = "Bare Lilac"
toggle_switch_9 = 1
toggle_switch_10 = 1
