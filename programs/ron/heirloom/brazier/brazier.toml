# Brazier - Heirloom from the video clips (phase 3), v0.1.0 (2026-11-09), from the still WIN_20230930_01_37_53 @ 0.5 s.
# A blue / violet nested diamond with pink rims and red / green fringes over a red / black ground with three rows
# of keyed fins (grey crescents, pink fins, magenta flames).  One LFO scrolls the fins' FM wave and makes the diamond
# breathe (squeeze, drop, rise), as in the clip.  See brazier.vhd, brazier.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.brazier"
program_name = "Brazier"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Warp"]
program_type = "processing"
description = "A violet nested diamond breathing over a red ground of scrolling crescents, fins and flames."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fins"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Sweep"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 360
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Size"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Flames"
value_labels = ["Rose", "Ember"]
initial_value_label = "Rose"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Slip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Violet", "Copper"]
initial_value_label = "Violet"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Still Diamond"
rotary_potentiometer_4 = 512
linear_potentiometer_12 = 0

[[preset]]
name = "Twin Embers"
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Liquid"
rotary_potentiometer_4 = 820
linear_potentiometer_12 = 1023

[[preset]]
name = "Tunnel"
rotary_potentiometer_1 = 900
rotary_potentiometer_5 = 900
linear_potentiometer_12 = 300

[[preset]]
name = "Torn Signal"
toggle_switch_9 = 1
rotary_potentiometer_3 = 700
