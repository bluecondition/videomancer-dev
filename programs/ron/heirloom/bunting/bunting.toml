# Bunting - Heirloom #35, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230521_23_37_25.
# Yellow and cyan pennants cut by two bow-tie X's and a flaring band on a white ground, under a
# grid of blocky glyph marks keyed red / blue / grey into whatever lies beneath them.
# See bunting.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.bunting"
program_name = "Bunting"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Grid", "Pattern"]
program_type = "processing"
description = "Yellow and cyan bow-tie pennants on white under a grid of blocky glyphs keyed red, blue and grey into the ground."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Flags"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 506
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
