# Cateye - Heirloom (phase 3, video clips), v0.1.1 built from the clip WIN_20240102_00_30_49 at 1.0 s.
# A pink and yellow chevron eye: dashed magenta walls bending into a ">", a cream valley, a ringed bullet eye with
# a kite pupil and a pink glow; the colourizer heat drains the blue.  See cateye.vhd, cateye.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.cateye"
program_name = "Cateye"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Color"]
program_type = "processing"
description = "A pink and yellow chevron eye: ringed bullet eye in a cream valley between dashed magenta walls; heat drains the blue."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Chevron"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Eye"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 683
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Facing"
value_labels = ["Right", "Left"]
initial_value_label = "Right"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Stripes"
value_labels = ["Dashes", "Bars"]
initial_value_label = "Dashes"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Pupil"
value_labels = ["Pink", "Black"]
initial_value_label = "Pink"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Walls"
value_labels = ["Magenta", "Black"]
initial_value_label = "Magenta"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Heat"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 348
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Pale Dawn"
linear_potentiometer_12 = 0
rotary_potentiometer_2 = 430

[[preset]]
name = "Blaze"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 700

[[preset]]
name = "Looking Back"
toggle_switch_7 = 1
toggle_switch_9 = 1
rotary_potentiometer_1 = 700

[[preset]]
name = "Night Eye"
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 640

[[preset]]
name = "Bar Code"
toggle_switch_8 = 1
rotary_potentiometer_5 = 760

[[preset]]
name = "Deep Rings"
rotary_potentiometer_3 = 1023
rotary_potentiometer_2 = 760
rotary_potentiometer_4 = 860

[[preset]]
name = "Osc Ripple"
toggle_switch_11 = 1
rotary_potentiometer_6 = 560
