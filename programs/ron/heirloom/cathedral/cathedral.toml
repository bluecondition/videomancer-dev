# Cathedral - Heirloom #41, rebuilt 2026-10-27 from WIN_20230602_01_30_58.
# Mirrored stained glass: teal egg-crate arches and X crossings around a pink
# diamond, pink triangles and wedges, warm stripes on a green-to-black ramp.
# See cathedral.vhd, cathedral.py and SUMMARY.md.

[program]
processing_delay_clks = 56
program_id = "com.czartroniks.cathedral"
program_name = "Cathedral"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Mirror", "Color"]
program_type = "processing"
description = "Teal arches and X crossings around a pink diamond, wedges and warm stripes on a green ramp. Tracery on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

