# Cathode - Heirloom #23 (rebuilt 2026-10-27), from WIN_20230407_23_48_05.
# A sample-and-hold colour mosaic (cyclic green / pink / yellow / mint colourizer, phase ramping down
# every column) with two purple three-tube flames keyed over it.  See cathode.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.cathode"
program_name = "Cathode"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Glitch", "Shape"]
program_type = "processing"
description = "S&H colour mosaic cycling green, pink, yellow and mint down its columns, with two purple tube flames keyed over it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 12
display_max_value = 160
initial_value = 487
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 17
display_max_value = 270
initial_value = 502
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Cycle"
control_mode = "linear"
display_min_value = 0
display_max_value = 300
initial_value = 342
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Flames"
control_mode = "linear"
display_min_value = 1
display_max_value = 4
initial_value = 351
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Patch"
value_labels = ["RGB", "RBG", "GRB", "GBR", "BRG", "BGR"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fringe"
value_labels = ["Blue", "Off"]
initial_value_label = "Blue"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Glow"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Core"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Flip"
value_labels = ["Down", "Up"]
initial_value_label = "Down"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Flames"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Generator"
toggle_switch_11 = 1

[[preset]]
name = "Pillars"
toggle_switch_11 = 1
linear_potentiometer_12 = 1023
rotary_potentiometer_5 = 180

[[preset]]
name = "Embers"
rotary_potentiometer_6 = 900
linear_potentiometer_12 = 300
rotary_potentiometer_1 = 700

[[preset]]
name = "Rising"
toggle_switch_10 = 1
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 760
