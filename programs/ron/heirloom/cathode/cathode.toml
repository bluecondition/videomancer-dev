# Cathode - Heirloom #23 (2026-10-20), from WIN_20230407_23_48_05.
# A torn magenta / green / yellow mosaic with two purple tubes sweeping through it.
# See cathode.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.cathode"
program_name = "Cathode"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Glitch", "Shape"]
program_type = "processing"
description = "The picture as a torn magenta, green and yellow mosaic with two purple parabolic tubes sweeping down through it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Blocks"
control_mode = "linear"
display_min_value = 8
display_max_value = 263
initial_value = 120
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Curve"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 250
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Spacing"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Palette"
value_labels = ["Cathode", "Phosphor", "Amber", "Ice"]
initial_value_label = "Cathode"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Sweep"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tubes"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mosaic"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tube"
value_labels = ["Purple", "Cyan"]
initial_value_label = "Purple"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Poster"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tubes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Hairlines"
rotary_potentiometer_6 = 620
linear_potentiometer_12 = 0

[[preset]]
name = "Purple Flood"
rotary_potentiometer_2 = 900
linear_potentiometer_12 = 1023

[[preset]]
name = "Ice Picture"
rotary_potentiometer_5 = 768
rotary_potentiometer_1 = 20
toggle_switch_9 = 1
linear_potentiometer_12 = 200
