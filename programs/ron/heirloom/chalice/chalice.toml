linear_potentiometer_12 = 700

[[preset]]
name = "Ice Goblet"
rotary_potentiometer_4 = 700
toggle_switch_10 = 1

[[preset]]
name = "Camera Cup"
rotary_potentiometer_6 = 800
linear_potentiometer_12 = 350

[[preset]]
name = "Horizon"
rotary_potentiometer_1 = 700
linear_potentiometer_12 = 0

[[preset]]
name = "Upturned"
