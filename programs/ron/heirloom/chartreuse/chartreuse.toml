# Chartreuse - Heirloom #51 (2026-10-20), from WIN_20231211_00_38_58.
# Fold field (or video luma) chrome-shaded in one hue.
# See chartreuse.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.chartreuse"
program_name = "Chartreuse"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Material", "Curve"]
program_type = "processing"
description = "Glossy lime-green folds with chrome highlight lines and a soft orb, or the picture shaded the same way. Fold on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Folds"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shine"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 250
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Orb"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 25
display_max_value = 225
initial_value = 400
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shine"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Orb"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Hue"
value_labels = ["Mono", "Duo"]
initial_value_label = "Mono"
[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Osc"
[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"
[[preset]]
name = "Default"

[[preset]]
name = "Chrome Face"
toggle_switch_11 = 0
linear_potentiometer_12 = 300

[[preset]]
name = "Deep Folds"
linear_potentiometer_12 = 1000
rotary_potentiometer_1 = 400

[[preset]]
name = "Duo Mirror"
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 600

