# Coastline - Heirloom (video phase), built 2026-11-09 (v0.1.0) from the clip WIN_20240117_22_55_32 at 0.5 s.
# A blue field cut by a curved coastline; a rainbow ridge on the coast whose bands wave more the further they lie
# from it, a clean second arc offshore.  See coastline.vhd, coastline.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.coastline"
program_name = "Coastline"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Curve", "Color"]
program_type = "processing"
description = "A rainbow ridge on a curved coastline in a blue sea, its bands waving harder away from the shore."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bend"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Waves"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Weave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Coast"
value_labels = ["Clean", "Ripple"]
initial_value_label = "Clean"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Rainbows"
value_labels = ["Ridge", "All"]
initial_value_label = "Ridge"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Sky"
value_labels = ["Day", "Sunset"]
initial_value_label = "Day"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Surf"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 464
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Calm Shore"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 600

[[preset]]
name = "Storm"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 820

[[preset]]
name = "Weave"
rotary_potentiometer_5 = 560
linear_potentiometer_12 = 520

[[preset]]
name = "Canyon"
toggle_switch_9 = 1
rotary_potentiometer_1 = 800
linear_potentiometer_12 = 560

[[preset]]
name = "Rainbow Bay"
toggle_switch_8 = 1
rotary_potentiometer_2 = 700

[[preset]]
name = "Sunset River"
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Hook"
rotary_potentiometer_1 = 1023
rotary_potentiometer_3 = 700
