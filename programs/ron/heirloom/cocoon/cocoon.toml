# Cocoon - Heirloom #2 (2026-10-20), from WIN_20220829_23_30_37.
# A woven chevron cocoon in a red-to-blue glow, the video keyed in around it.
# See cocoon.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.cocoon"
program_name = "Cocoon"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Mask", "Glitch"]
program_type = "processing"
description = "A hexagonal cocoon of woven chevrons glowing red to blue, the posterized video keyed in and torn around it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Key"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Weave"
control_mode = "linear"
display_min_value = 1
display_max_value = 64
initial_value = 500
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 380
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Hexagon", "Ellipse"]
initial_value_label = "Hexagon"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Fire", "Ice"]
initial_value_label = "Fire"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Poster"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Weave"
value_labels = ["Chevron", "Diagonal"]
initial_value_label = "Chevron"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Cocoon"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Ice Egg"
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Full Weave"
rotary_potentiometer_2 = 900
rotary_potentiometer_3 = 800
linear_potentiometer_12 = 1023

[[preset]]
name = "Osc Flanks"
rotary_potentiometer_1 = 300
rotary_potentiometer_5 = 800
toggle_switch_10 = 1
linear_potentiometer_12 = 500
