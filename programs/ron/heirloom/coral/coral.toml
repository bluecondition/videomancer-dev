# Coral - Heirloom from the video clips (phase 3), v0.1.1, built 2026-11-09 from the still
# WIN_20230905_00_44_28 t0.5 (the 17 s clip, and clip 00_44_50, is one patch cycling with an 8.9 s period).
# A red bulb under a shallow "v" bar and an eye of chevrons, red/cyan arc fans from the upper corners, a violet
# ground: a rolling vertical sine + a mirrored horizontal cosine + a diamond key, through a triangle wavefolder.
# See coral.vhd, coral.py, SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.coral"
program_name = "Coral"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Color"]
program_type = "processing"
description = "A red bulb and chevron eye in fans of red and cyan coral rings; a rolling vertical sine swells them through the frame."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Arcs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Eye"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bulb"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Coral", "Lagoon"]
initial_value_label = "Coral"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bands"
value_labels = ["Fold", "Steps"]
initial_value_label = "Fold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Swell"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 360
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Calm Eye"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 760

[[preset]]
name = "Red Tide"
linear_potentiometer_12 = 1023
rotary_potentiometer_5 = 600

[[preset]]
name = "Hanging Bulb"
toggle_switch_7 = 1
rotary_potentiometer_4 = 330

[[preset]]
name = "Lagoon Twins"
toggle_switch_8 = 1
toggle_switch_9 = 1

[[preset]]
name = "Dense Coral"
rotary_potentiometer_1 = 820
rotary_potentiometer_2 = 760

[[preset]]
name = "Poster"
toggle_switch_10 = 1
rotary_potentiometer_1 = 380

[[preset]]
name = "Camera Coral"
rotary_potentiometer_6 = 800
linear_potentiometer_12 = 300
