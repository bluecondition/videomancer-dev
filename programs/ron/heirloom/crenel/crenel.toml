# Crenel - Heirloom #10, v0.5.0 (2026-10-21): rebuilt from the photo WIN_20230223_01_46_41.
# A picture tiled twice across the line by a bent horizontal oscillator: a row of hot-pink "+"
# crenels with feedback echoes over a navy ground, a blue camera dome, pink V's, rows of camera
# blocks / arcs / dashes, a pink arch ring and pink blocks below.  See crenel.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.crenel"
program_name = "Crenel"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Glitch", "Color"]
program_type = "processing"
description = "Hot-pink crenels, camera domes, V's and arcs tiled twice by a bent oscillator; torn, echoing, rolling."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Crenels"
control_mode = "linear"
display_min_value = 1
display_max_value = 6
initial_value = 410
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 1
display_max_value = 4
initial_value = 341
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Echo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Ripples"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Palette"
value_labels = ["Photo", "Ember", "Jade", "Rust"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tear"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Outline"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Roll"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 410
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"
toggle_switch_11 = 1

[[preset]]
name = "Battlements"
linear_potentiometer_12 = 0
toggle_switch_7 = 0
toggle_switch_11 = 1

[[preset]]
name = "Torn Slashes"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 800

[[preset]]
name = "Outline Echo"
toggle_switch_8 = 1
rotary_potentiometer_3 = 1023

[[preset]]
name = "Ember Roll"
rotary_potentiometer_6 = 1
toggle_switch_10 = 1

[[preset]]
name = "Jade Mirror"
rotary_potentiometer_6 = 2
toggle_switch_9 = 1
rotary_potentiometer_1 = 600
