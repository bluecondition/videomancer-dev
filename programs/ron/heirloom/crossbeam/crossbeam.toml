# Crossbeam - Heirloom #37, v0.6.0 (2026-11-01, phase 2): rebuilt from the photo WIN_20230527_01_43_26.
# A glowing cyan cross beam luma-keyed over torn colour bars, with mirrored red/black zebra contours
# in the corners and along the bottom.  Phase 2: rows and columns scale one by one (Scatter / Lens),
# the zebra lookup warps, the beam swings and pushes the contours, rows slip.  See SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.crossbeam"
program_name = "Crossbeam"
program_version = "0.6.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Grid", "Glitch", "Color"]
program_type = "processing"
description = "A cyan cross beam keyed over torn colour bars and red zebra contours; rows and columns scale, the beam swings and pushes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 289
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Warp"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Swing"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Columns"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bars"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Tear"
value_labels = ["Still", "Slip"]
initial_value_label = "Still"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Stack"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Photo", "Swap"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Beam"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Lens"
rotary_potentiometer_2 = 1000
rotary_potentiometer_6 = 1000

[[preset]]
name = "Mosaic"
rotary_potentiometer_2 = 40
rotary_potentiometer_6 = 40
toggle_switch_8 = 1

[[preset]]
name = "Liquid"
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 860
toggle_switch_7 = 0

[[preset]]
name = "Scissors"
rotary_potentiometer_5 = 900
rotary_potentiometer_6 = 800

[[preset]]
name = "Ghost"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 500

[[preset]]
name = "Rising"
rotary_potentiometer_5 = 150
rotary_potentiometer_2 = 960

[[preset]]
name = "Blaze"
linear_potentiometer_12 = 1000
rotary_potentiometer_4 = 760
