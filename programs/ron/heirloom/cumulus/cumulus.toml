# Cumulus - Heirloom (phase 3, video clips), built 2026-11-09 (v0.1.0) from the clip WIN_20231009_00_32_55 at 0.5 s.
# Mirrored mint clouds (ellipse, tilted petals, heart, teardrop) with dark shadows in a blue sky, scalloped yellow /
# green bands with a bulb and green X wedges, pink with white spikes, magenta fringes; the bands roll up 5 lines a
# field and the clouds rise 1.33.  See cumulus.vhd, cumulus.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.cumulus"
program_name = "Cumulus"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Mirror", "Pattern"]
program_type = "processing"
description = "Mirrored mint clouds in a blue sky over scalloped yellow and pink bands with spikes, rolling up like the analog patch."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Lean"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scallop"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 768
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spikes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Cumulus", "Orchid"]
initial_value_label = "Cumulus"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Slip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Billow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Overcast"
linear_potentiometer_12 = 900

[[preset]]
name = "Clear Sky"
linear_potentiometer_12 = 60
rotary_potentiometer_3 = 900

[[preset]]
name = "Twin Clouds"
toggle_switch_7 = 1
rotary_potentiometer_2 = 380

[[preset]]
name = "Orchid"
toggle_switch_8 = 1

[[preset]]
name = "Negative"
toggle_switch_9 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Torn Sky"
toggle_switch_10 = 1
rotary_potentiometer_4 = 900

[[preset]]
name = "Many Tiles"
rotary_potentiometer_1 = 760
rotary_potentiometer_5 = 700
