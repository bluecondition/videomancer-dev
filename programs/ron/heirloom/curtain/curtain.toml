# Curtain - Heirloom #34 (2026-10-20), from WIN_20230521_01_34_12.
# Magenta rippled drapes on red, blue pools, lime piping on the crests, torn rows.
# See curtain.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.curtain"
program_name = "Curtain"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Material", "Warp", "Organic"]
program_type = "processing"
description = "Magenta drapes wrung into S-curves by the video, blue pools where they part, lime piping on the crests. Wring on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 180
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Pools"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 280
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Piping"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
value_labels = ["Red Magenta", "Blue Cyan", "Green Yellow", "Violet Pink"]
initial_value_label = "Red Magenta"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 180
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Pools"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Piping"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Shade"
value_labels = ["Dark", "Light"]
initial_value_label = "Dark"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Drape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Blue Velvet"
rotary_potentiometer_4 = 256
toggle_switch_9 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Straight Folds"
rotary_potentiometer_2 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Osc Drapes"
rotary_potentiometer_4 = 768
toggle_switch_11 = 1
linear_potentiometer_12 = 1023
