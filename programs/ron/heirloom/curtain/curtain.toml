# Curtain - Heirloom #34 (rebuilt 2026-10-27), from WIN_20230521_01_34_12.
# Two line-locked oscillators into a keyed colourizer: folds (green arcs, cyan pools, magenta
# striation) cut by pleats (red flames, grey domes, red drapes below the seam).
# See curtain.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.curtain"
program_name = "Curtain"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Material", "Warp", "Organic"]
program_type = "processing"
description = "Red drapes and magenta striation: swept folds with green piping and cyan pools, cut by pleats. Drape on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Folds"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Pleats"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Pools"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tear"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Piping"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Flames"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Velvet"
value_labels = ["Red", "Blue"]
initial_value_label = "Red"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Drape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Hanging"
linear_potentiometer_12 = 0

[[preset]]
name = "Whipped"
rotary_potentiometer_4 = 760
linear_potentiometer_12 = 1023

[[preset]]
name = "Blue Velvet"
toggle_switch_10 = 1
rotary_potentiometer_5 = 700

[[preset]]
name = "Many Folds"
rotary_potentiometer_1 = 820
rotary_potentiometer_2 = 760
rotary_potentiometer_3 = 700
