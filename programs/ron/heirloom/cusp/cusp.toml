# Cusp - Heirloom #17, v0.6.0 (2026-11-01, phase 2): rebuilt from the photo WIN_20230315_00_30_57.
# Rows of fine stripes cut by right-pointing arrowheads: black cores with blue X tips, cyan fish that
# grow across the frame, broad rainbow bands, red X's in the orange rows.  Phase 2: the two row types are
# separate modules (rate, height, drift, pointing); stripes scroll and curl; the rainbow cycles.  See SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.cusp"
program_name = "Cusp"
program_version = "0.6.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Warp", "Analysis"]
program_type = "processing"
description = "Stripes cut by arrowheads: black-core and orange rows as separate modules, fish, curling stripes; video bends cusps."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cusps"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Split"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Fish"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
