# Cutout - Heirloom #55, v0.5.0 (2026-10-27), rebuilt from tezcatlipoca.jpg (a paper collage).
# A skull-like head in profile cut out of a yellow ground, filled with torn magazine scraps that print
# the camera picture; a soup-cup eye, a plate of pastries, stone teeth, a "Love." label, a black jaw.
# See cutout.vhd and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.cutout"
program_name = "Cutout"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mask", "Shape", "Craft"]
program_type = "processing"
description = "A collage head cut from a yellow ground, its torn scraps printing the camera: soup-cup eye, plate, stone teeth."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rag"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Zoom"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Jaw"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Paint"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Facing"
value_labels = ["Left", "Right"]
initial_value_label = "Left"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fringe"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chatter"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Eye"
value_labels = ["Soup", "Mirror"]
initial_value_label = "Soup"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Collage"

[[preset]]
name = "Torn Strips"
linear_potentiometer_12 = 620
rotary_potentiometer_1 = 700

[[preset]]
name = "Chatterbox"
rotary_potentiometer_4 = 420
toggle_switch_9 = 1

[[preset]]
name = "Smoking Mirror"
toggle_switch_10 = 1
rotary_potentiometer_5 = 380
rotary_potentiometer_2 = 300

[[preset]]
name = "Shredded"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 1023
rotary_potentiometer_3 = 900
