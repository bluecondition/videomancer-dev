# Effigy - Heirloom (video clips), built 2026-11-09 (v0.1.0) from the clip still WIN_20231229_00_46_59 at 6.0 s.
# A yellow idol column mirrored about the centre, cut by black bands with red halos and orange teeth, its outline
# echoed outward as nested zigzag contours; the idol's profile scrolls upward.  See effigy.vhd, effigy.py, SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.effigy"
program_name = "Effigy"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Shape", "Color"]
program_type = "processing"
description = "A yellow idol in red and black flames: mirrored blobs cut by glowing bands, its outline echoed in zigzag contours."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Idol"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

