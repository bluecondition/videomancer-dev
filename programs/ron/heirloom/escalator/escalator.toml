# Escalator - Heirloom #1, v0.5.0 (2026-10-21): rebuilt from the photo WIN_20220629_23_49_20.
# A pastel tile grid (lavender halves, violet blobs fading pale, pink bands with yellow/orange blobs)
# under green stair-stepped slabs that ride down the columns.  See escalator.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.escalator"
program_name = "Escalator"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Grid", "Color"]
program_type = "processing"
description = "Pastel tile grid with pink bands and violet blobs; green stair-stepped slabs ride down the columns."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Columns"
control_mode = "linear"
display_min_value = 2
display_max_value = 14
initial_value = 438
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 2
display_max_value = 10
initial_value = 275
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blob"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Flood"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 615
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 480
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Climb"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Vivid"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 681
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"
toggle_switch_11 = 1

[[preset]]
name = "Level Bars"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 420

[[preset]]
name = "Chevron Stairs"
toggle_switch_7 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Green Flood"
toggle_switch_9 = 1
rotary_potentiometer_4 = 760

[[preset]]
name = "Vivid Cascade"
toggle_switch_10 = 1
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 620
