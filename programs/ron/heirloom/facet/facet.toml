# Facet - Heirloom #40, rebuilt 2026-10-21 from WIN_20230602_01_26_17.
# A mirrored row of green eyes (red cone / caps where the purple wedge and
# floor cut them) on a blue-green gradient, x-order white edge lines.
# See facet.vhd, facet.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.facet"
program_name = "Facet"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Mirror", "Render"]
program_type = "processing"
description = "Mirrored green eyes with a red cone on a blue-green gradient, white-edged purple wedge and floor. Open the eyes on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Eyes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 491
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Wedge"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 489
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Floor"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 341
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 410
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Halo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 371
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Picture"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 307
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Lines"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Glow"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Jewel", "Ember"]
initial_value_label = "Jewel"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Open"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 482
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Wide Open"
linear_potentiometer_12 = 1023

[[preset]]
name = "Six Eyes"
rotary_potentiometer_1 = 1023
linear_potentiometer_12 = 600

[[preset]]
name = "Ember Fan"
toggle_switch_10 = 1
rotary_potentiometer_2 = 900

[[preset]]
name = "Twin Eyes"
toggle_switch_9 = 1
rotary_potentiometer_5 = 600
