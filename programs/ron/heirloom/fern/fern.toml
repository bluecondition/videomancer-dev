# Fern - Heirloom #46 (2026-10-20), from WIN_20230713_00_17_11.
# Nested parabola fronds in flame colours over a teal ripple field.
# See fern.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.fern"
program_name = "Fern"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Mirror", "Organic"]
program_type = "processing"
description = "Nested pink, orange and yellow parabola fronds, mirrored, over a teal ripple field with a blue zone. Curvature on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Duty"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 380
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ripple"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Edge"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Top", "Centre"]
initial_value_label = "Centre"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Flame", "Ice"]
initial_value_label = "Flame"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Field"
value_labels = ["Ripple", "Source"]
initial_value_label = "Ripple"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Blue"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Picture Fronds"
toggle_switch_9 = 1
rotary_potentiometer_2 = 200

[[preset]]
name = "Ice Bars"
toggle_switch_8 = 1
linear_potentiometer_12 = 40

[[preset]]
name = "Tight Curl"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 150
toggle_switch_10 = 0
