# Fern - Heirloom #46, v0.5.0 (2026-10-27): rebuilt from WIN_20230713_00_17_11.
# Nested pink frond arms on vertical stems over a green maze, a blue scanline ground and a small dart.
# See fern.vhd and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.fern"
program_name = "Fern"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Mirror", "Organic"]
program_type = "processing"
description = "Nested pink fronds on stems over a green maze, a blue scanline ground and a small dart. Arrow sets the chevron depth."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fronds"
control_mode = "linear"
display_min_value = 50
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Stems"
control_mode = "linear"
display_min_value = 50
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Flesh"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Maze"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 280
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Photo", "Sweep"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Pink", "Green"]
initial_value_label = "Pink"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Dart"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Stems"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Arrow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 438
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Wireframe"
rotary_potentiometer_4 = 120
rotary_potentiometer_5 = 200

[[preset]]
name = "Deep Arrow"
linear_potentiometer_12 = 1000
rotary_potentiometer_3 = 760

[[preset]]
name = "Green Fern"
toggle_switch_8 = 1
rotary_potentiometer_1 = 640

[[preset]]
name = "Sweep"
toggle_switch_7 = 1
toggle_switch_9 = 1

[[preset]]
name = "Chevrons"
toggle_switch_10 = 1
rotary_potentiometer_1 = 760
