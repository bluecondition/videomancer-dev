# Flamecrest - Heirloom phase 3 (video clips), v0.1.1 (2026-11-09), from clip WIN_20240213_23_38_52 at 3.0 s.
# v0.1.1: K5 Strokes bold (none .. the still .. heavy strokes slashing across the tongues and into the black).
# A mirrored crest of flames hanging from the top on black: pink arch tops, cyan / green side tongues, a yellow / red
# fan into a central X, black diamond notches with islands, hard red strokes, a wavy pink strip and left-edge bars.
# See flamecrest.vhd, flamecrest.py and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.flamecrest"
program_name = "Flamecrest"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Color"]
program_type = "processing"
description = "A mirrored crest of rainbow flames hanging on black: arch tops, diamond notches, red strokes, cycling colour."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tongues"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Diamonds"
