# Frogspawn - Heirloom (video phase), built 2026-11-04 (v0.1.0; v0.1.1 sharp heart palette, bold switches) from the clip WIN_20230206_00_35_06 at 0.5 s.
# A green/black cellular contour lattice: one field H(x) + V(y) through a rainbow-fringed green colouriser.
# Circles at the H maxima, narrow eyes between them, hearts on the saddle rows, black ovals where the field
# saturates on the right.  See frogspawn.vhd, frogspawn.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.frogspawn"
program_name = "Frogspawn"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Organic", "Shape"]
program_type = "processing"
description = "Green/black cellular contour lattice: circles, eyes and hearts in rainbow-fringed rings, scrolling down."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Eyes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 716
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tilt"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 768
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Colours"
value_labels = ["Green", "Pink"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cells"
value_labels = ["Round", "Diamond"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Top"
value_labels = ["Black", "Rings"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Split"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Stacked"
linear_potentiometer_12 = 600

[[preset]]
name = "Diamonds"
toggle_switch_9 = 1
rotary_potentiometer_3 = 300

[[preset]]
name = "Pink Twin"
toggle_switch_7 = 1
toggle_switch_8 = 1

[[preset]]
name = "Wrapped"
toggle_switch_10 = 1
rotary_potentiometer_5 = 900

[[preset]]
name = "Rapids"
rotary_potentiometer_4 = 1023
rotary_potentiometer_2 = 300
linear_potentiometer_12 = 350

[[preset]]
name = "Flat Field"
rotary_potentiometer_5 = 512
rotary_potentiometer_3 = 700
rotary_potentiometer_1 = 350
