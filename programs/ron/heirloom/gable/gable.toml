# Gable - Heirloom (video phase), built 2026-11-09 (v0.1.0) from the clip WIN_20230129_23_23_56 at 0.5 s.
# A fan of pointed cyan chevrons on dark, torn into horizontal strokes, red hairlines thickening into red flanks,
# a red / white core; the stroke pattern rolls down.  See gable.vhd, gable.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.gable"
program_name = "Gable"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Signal", "Color"]
program_type = "processing"
description = "A fan of pointed cyan chevrons torn into rolling strokes, red hairlines thickening into red flanks."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fan"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Strokes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["One", "Two"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Flip"
value_labels = ["Gable", "Valley"]
initial_value_label = "Gable"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Colours"
value_labels = ["Red Cyan", "Magenta"]
initial_value_label = "Red Cyan"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Arch"
value_labels = ["Pointed", "Round"]
initial_value_label = "Pointed"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Strata"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 760

[[preset]]
name = "Spire"
linear_potentiometer_12 = 1023
rotary_potentiometer_5 = 700

[[preset]]
name = "Clean Roof"
rotary_potentiometer_3 = 0
rotary_potentiometer_5 = 0

[[preset]]
name = "Twin Arches"
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Magenta Valley"
toggle_switch_8 = 1
toggle_switch_9 = 1
rotary_potentiometer_1 = 800

[[preset]]
name = "Shredded"
rotary_potentiometer_3 = 1023
rotary_potentiometer_5 = 1023
rotary_potentiometer_2 = 700
