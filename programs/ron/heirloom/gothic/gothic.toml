# Gothic - Heirloom (video clips), built 2026-11-10 (v0.1.0) from clip WIN_20230817_00_06_49 at 0.5 s.
# Nested pointed arches of ribbons (blue leaves, wavy red-line patches, a cyan edge line) over rolling
# green stripes; the arches sink, the stripes roll down.  See gothic.vhd, gothic.py and SUMMARY.md.
# v0.1.1 (2026-11-10): camera luma smoothed (8 px box + vertical IIR), default camera bend lowered, Osc on its own x32.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.gothic"
program_name = "Gothic"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Warp"]
program_type = "processing"
description = "Nested gothic arches of blue leaves and wavy red lines, cyan-edged, over rolling green stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Arches"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Curve"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ribbons"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Waves"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 120
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Stripes"
value_labels = ["Green", "Cyan"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Swap"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tear"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Vault"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Chevrons"
rotary_potentiometer_2 = 0
linear_potentiometer_12 = 300

[[preset]]
name = "Sway"
rotary_potentiometer_2 = 900
toggle_switch_7 = 1

[[preset]]
name = "Colonnade"
rotary_potentiometer_1 = 700
linear_potentiometer_12 = 0

[[preset]]
name = "Slip"
toggle_switch_9 = 1
rotary_potentiometer_4 = 850

[[preset]]
name = "Hanging"
toggle_switch_10 = 1
toggle_switch_8 = 1

[[preset]]
name = "Cascade"
rotary_potentiometer_3 = 700
linear_potentiometer_12 = 1000

[[preset]]
name = "Lattice"
toggle_switch_11 = 1
rotary_potentiometer_6 = 600
