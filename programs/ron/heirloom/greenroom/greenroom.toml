# Greenroom - Heirloom #54, v0.5.0 (2026-10-27): rebuilt from television.jpg (a painted paper collage).
# Green/teal wash scraped over magazine cut-outs; a TV in the middle shows the camera.  P12 Wash scrapes
# the paint off (the camera under the collage) or floods it.  See greenroom.vhd and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.greenroom"
program_name = "Greenroom"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Material", "Mask", "Craft"]
program_type = "processing"
description = "Painted collage: green wash over cut-outs, a TV showing the camera. Wash scrapes to the camera or floods."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Orange"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Brush"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Grain"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Tuning"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 614
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tint"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Crawl"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Screen"
value_labels = ["Colour", "Mono"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Clock"
value_labels = ["Camera", "Paint"]
initial_value_label = "Camera"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Lines"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wash"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Scraped"
linear_potentiometer_12 = 150

[[preset]]
name = "Flooded"
linear_potentiometer_12 = 900
rotary_potentiometer_5 = 760

[[preset]]
name = "Late Show"
rotary_potentiometer_4 = 560
toggle_switch_8 = 1
toggle_switch_7 = 1

[[preset]]
name = "Splatter"
rotary_potentiometer_1 = 1000
rotary_potentiometer_2 = 800
rotary_potentiometer_3 = 760
