# Grommets - Heirloom from the video clips, built 2026-11-04 (v0.1.0) from the still WIN_20230216_01_27_34 @ 2.5 s.
# Two black keyhole holes scrolling down a purple ring lattice of 9.5-line colour bands, with fanning black stems.
# See grommets.vhd, grommets.py and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.grommets"
program_name = "Grommets"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Signal"]
program_type = "processing"
description = "Two black keyhole holes drifting down a purple lattice of scanline colour bands, with fanning stems."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Lattice"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Columns"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 764
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Stems"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bands"
value_labels = ["Fine", "Bold"]
initial_value_label = "Fine"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Violet", "Rainbow"]
initial_value_label = "Violet"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shape"
value_labels = ["Round", "Diamond"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Negative"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Holes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 409
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Rainbow Rows"
rotary_potentiometer_3 = 760
toggle_switch_8 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Diamonds"
rotary_potentiometer_1 = 700
toggle_switch_9 = 1
linear_potentiometer_12 = 480

[[preset]]
name = "Black Tide"
rotary_potentiometer_4 = 850
linear_potentiometer_12 = 900

[[preset]]
name = "Open Lattice"
rotary_potentiometer_5 = 0
linear_potentiometer_12 = 60

[[preset]]
name = "Negative"
toggle_switch_10 = 1
rotary_potentiometer_5 = 800

[[preset]]
name = "Four Across"
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 900
toggle_switch_7 = 1

[[preset]]
name = "Camera Lace"
rotary_potentiometer_6 = 900
rotary_potentiometer_1 = 300
