# Halo - Heirloom #47 v0.5.0 (2026-10-27), rebuilt from the photo WIN_20230801_00_19_00.
# Glowing yellow ellipses in red-crescent cells between blue hourglass contour columns with
# concave diamonds; a white noise band right of every seam; torn line starts near the cusps.
# See halo.vhd and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.halo"
program_name = "Halo"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Mirror"]
program_type = "processing"
description = "Glowing ellipses in red-crescent cells between blue hourglass contour columns and diamonds; torn line starts."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rings"
control_mode = "linear"
display_min_value = 45
display_max_value = 150
initial_value = 550
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Cells"
control_mode = "linear"
display_min_value = 1
display_max_value = 4
initial_value = 349
display_float_digits = 2
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Pinch"
control_mode = "linear"
display_min_value = 0
display_max_value = 160
initial_value = 639
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Warp"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 153
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Seam"
value_labels = ["Cut", "Mirror"]
initial_value_label = "Cut"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Noise"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ember"
value_labels = ["Short", "Long"]
initial_value_label = "Short"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Halo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 472
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Bare Rings"
linear_potentiometer_12 = 0
rotary_potentiometer_5 = 0

[[preset]]
name = "Suns"
linear_potentiometer_12 = 1023
toggle_switch_9 = 1

[[preset]]
name = "Lattice"
rotary_potentiometer_2 = 900
rotary_potentiometer_1 = 300
rotary_potentiometer_3 = 900

[[preset]]
name = "Straight"
rotary_potentiometer_3 = 0
toggle_switch_7 = 1
toggle_switch_8 = 1
