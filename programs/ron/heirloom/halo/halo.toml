# Halo - Heirloom #47 (2026-10-20), from WIN_20230801_00_19_00.
# Glowing yellow-green rings on dark olive, blue / violet chevrons between, mirrored cells.
# See halo.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.halo"
program_name = "Halo"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Mirror"]
program_type = "processing"
description = "Glowing yellow-green rings on dark olive with blue and violet chevrons between, mirrored cells; the video lights the glow."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 1
display_max_value = 4
initial_value = 384
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 240
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Chevrons"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
value_labels = ["Lime", "Gold", "Cyan", "Magenta"]
initial_value_label = "Lime"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Rings"
value_labels = ["Glow", "Hard"]
initial_value_label = "Glow"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Chevrons"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Rows"
value_labels = ["One", "Grid"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Ring"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 380
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Gold Grid"
rotary_potentiometer_1 = 1000
rotary_potentiometer_4 = 256
toggle_switch_10 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Hard Cyan"
rotary_potentiometer_4 = 512
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Big Halo"
rotary_potentiometer_1 = 0
rotary_potentiometer_2 = 60
linear_potentiometer_12 = 1023
