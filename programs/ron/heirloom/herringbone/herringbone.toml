# Herringbone - Heirloom (phase 3, video clips), v0.1.0 (2026-11-09) from WIN_20231119_00_47_47 at 0.5 s.
# Lavender/blue and cyan/navy bands of soft stripes that zigzag band to band; a rolling band VCO bunches the
# bands and swings the stripes.  See herringbone.vhd, herringbone.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.herringbone"
program_name = "Herringbone"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Material", "Illusion"]
program_type = "processing"
description = "Blue and white stripes zigzag band to band; a rolling band oscillator bunches the bands and swings the stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fan"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 772
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Roll"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 693
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bunch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Colours"
value_labels = ["Blue", "Ember"]
initial_value_label = "Blue"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Weave"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wave"
value_labels = ["Square", "Ramp"]
initial_value_label = "Square"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Zigzag"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 337
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Even Weave"
rotary_potentiometer_5 = 0
toggle_switch_9 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Chevrons"
toggle_switch_7 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Ember Fan"
rotary_potentiometer_2 = 1023
rotary_potentiometer_4 = 820
toggle_switch_8 = 1

[[preset]]
name = "Deep Bunch"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 1000
rotary_potentiometer_4 = 760

[[preset]]
name = "Gradients"
rotary_potentiometer_1 = 380
toggle_switch_10 = 1
linear_potentiometer_12 = 480

[[preset]]
name = "Fine Twill"
rotary_potentiometer_1 = 200
rotary_potentiometer_3 = 820
linear_potentiometer_12 = 900

[[preset]]
name = "Camera Etch"
rotary_potentiometer_6 = 820
rotary_potentiometer_4 = 512
