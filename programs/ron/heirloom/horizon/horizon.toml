# Horizon - Heirloom from the video clips (phase 3), v0.1.0, built 2026-11-04 from the still
# WIN_20230703_01_29_07 t10.0.  A planet horizon at dusk from an RGB-colouriser patch: a cyan sky with lavender
# lobes, a magenta sun between black mountains, striped water and two dark masses dissolving into yellow-rimmed
# ribs.  See horizon.vhd, horizon.py, SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.horizon"
program_name = "Horizon"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Shape", "Color"]
program_type = "processing"
description = "A dusk horizon: lavender sky lobes, a magenta sun between black mountains, striped water, masses dissolving into ribs."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ribs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bowl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Tide"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 672
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Lobes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fan"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Beads"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Dawn"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Dusk", "Mono"]
initial_value_label = "Dusk"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Ribcage"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Hills"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 300

[[preset]]
name = "Ribcage"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 760

[[preset]]
name = "Flood"
rotary_potentiometer_3 = 0
rotary_potentiometer_5 = 760

[[preset]]
name = "Bead Curtain"
toggle_switch_8 = 1
linear_potentiometer_12 = 800
rotary_potentiometer_1 = 650

[[preset]]
name = "Fan Dawn"
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Grey Comb"
toggle_switch_10 = 1
rotary_potentiometer_1 = 300
linear_potentiometer_12 = 900

[[preset]]
