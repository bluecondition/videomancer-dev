# Idol - Heirloom #31 (v0.6.1 phase 2, 2026-11-03: the v0.6 diag merged, bold Axis; v0.5.0 2026-10-27), rebuilt from WIN_20230515_23_14_37.
# A camera idol folded top-to-bottom, through a cyclic yellow/orange/blue/brown colourizer on a
# flat yellow ground, smeared sideways and feathered into per-line streaks.

[program]
processing_delay_clks = 30
program_id = "com.czartroniks.idol"
program_name = "Idol"
program_version = "0.6.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
