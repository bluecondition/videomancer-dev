[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Idol Osc"
toggle_switch_11 = 1

[[preset]]
name = "Totem"
toggle_switch_8 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Feathers"
rotary_potentiometer_1 = 1000
rotary_potentiometer_5 = 900
toggle_switch_11 = 1
