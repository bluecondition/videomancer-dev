# Idol - Heirloom #31 (v0.5.0, 2026-10-27), rebuilt from WIN_20230515_23_14_37.
# A camera idol folded top-to-bottom, through a cyclic yellow/orange/blue/brown colourizer on a
# flat yellow ground, smeared sideways and feathered into per-line streaks.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.idol"
program_name = "Idol"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Color", "Glitch"]
program_type = "processing"
description = "A camera idol folded in a frame-store mirror, colourized blue/orange/brown on flat yellow, smeared and feathered."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Feather"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 409
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Axis"
control_mode = "linear"
display_min_value = 30
display_max_value = 70
initial_value = 463
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Smear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Ground"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 307
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Fold", "Off"]
