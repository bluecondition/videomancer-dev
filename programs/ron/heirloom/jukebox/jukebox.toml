# Jukebox - Heirloom #16, rebuilt 2026-10-21 (v0.5.0) from WIN_20230315_00_28_42.
# A wall of rainbow capsules: flat contour bands that bend into rounded noses after every column cut.
# See jukebox.vhd, jukebox.py (measured tables and constants) and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.jukebox"
program_name = "Jukebox"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Grid", "Demo"]
program_type = "processing"
description = "A wall of rainbow capsules: contour bands run flat and curl into rounded noses after every column cut."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Columns"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 583
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 475
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Nose"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Pairs"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Photo", "Swap"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Stack"
value_labels = ["Mirror", "Saw"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 406
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Capsules"
toggle_switch_7 = 1
rotary_potentiometer_3 = 760

[[preset]]
name = "Soft Glow"
linear_potentiometer_12 = 60
rotary_potentiometer_1 = 380

[[preset]]
name = "Filigree"
linear_potentiometer_12 = 1000
rotary_potentiometer_4 = 700

[[preset]]
name = "Ember Wall"
toggle_switch_9 = 1
rotary_potentiometer_5 = 640
