# Kiln - Heirloom #32 (2026-10-20), from WIN_20230515_23_17_11.
# Fire palette by luma with vertical band glow and horizontal smear.
# See kiln.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.kiln"
program_name = "Kiln"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Film", "Render"]
program_type = "processing"
description = "The picture fired in a kiln: violet shadows, red mids, yellow highs, glowing vertical bands, streaked. Heat on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Smear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 25
display_max_value = 225
initial_value = 400
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""
[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Bands"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Fire", "Ice"]
initial_value_label = "Fire"
[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"
[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Poster"
value_labels = ["Off", "On"]
initial_value_label = "Off"
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"
[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Heat"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"
[[preset]]
name = "Default"

[[preset]]
name = "Cold Kiln"
toggle_switch_8 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "White Hot"
linear_potentiometer_12 = 1000
rotary_potentiometer_5 = 900

[[preset]]
name = "Glazed"
toggle_switch_10 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 450

