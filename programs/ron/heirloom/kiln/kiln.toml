# Kiln - Heirloom #32, v0.6.1 phase-2 final (2026-11-03); v0.5.0 (2026-10-27) rebuilt from the photo
# WIN_20230515_23_17_11.  Camera video in a frame store zoomed to a quadrant, repeated across (1.94 copies)
# with the bottom row mirrored, through a fire colouriser (blue / violet / purple / magenta / red / orange /
# yellow) and torn into rising horizontal fibres with an interlace comb.  Phase 2: wider Tiles / Blocks /
# Rims, a fibre tear to 3.9x, Video rims on the camera's edges, S9 Strips; v0.6.1 S10 Tile Lock (was Quench):
# whole copies across, gliding between counts.  See kiln.vhd and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.kiln"
program_name = "Kiln"
program_version = "0.6.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Color", "Glitch"]
program_type = "processing"
description = "Camera tiled and mirrored in a frame store, fired through a yellow-red-blue colourizer, torn into rising fibres."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

# --- Rotary Potentiometers (1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 551
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fibres"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blocks"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Rims"
control_mode = "linear"
display_min_value = -100
display_max_value = 300
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Glaze"
value_labels = ["Fire", "Ice", "Ember", "Toxic", "Violet", "Mono", "Neon", "Rust"]
initial_value_label = "Fire"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Mirror", "Repeat"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Kaleido"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Strips"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tile Lock"
value_labels = ["Free", "Lock"]
initial_value_label = "Free"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

# --- Linear Potentiometer (12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Heat"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

# --- Presets (hand-written placeholders; preset 0 = the defaults, in Osc) ---

[[preset]]
name = "Photo"
rotary_potentiometer_1 = 551
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 640
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 0
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
