# Lantern - Heirloom (phase 3, video clips), v0.1.0 built from the clip WIN_20231002_01_20_50 at 0.5 s.
# A hot-pink lantern in nested petal contours (yellow lines, brown cores) that cross in X rows; it sinks
# and the next one arrives from the top.  See lantern.vhd, lantern.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.lantern"
program_name = "Lantern"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Mirror"]
program_type = "processing"
description = "A hot-pink lantern in nested yellow petal contours that cross in X rows, sinking as the next one arrives."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Point"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Height"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 739
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Lantern"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ink"
value_labels = ["Neon", "Night"]
initial_value_label = "Neon"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Gel"
value_labels = ["Magenta", "Cyan"]
initial_value_label = "Magenta"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Lattice"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Clean Lantern"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 650

[[preset]]
name = "Lattice Net"
rotary_potentiometer_3 = 220
linear_potentiometer_12 = 760

[[preset]]
name = "Night Twins"
toggle_switch_7 = 1
toggle_switch_8 = 1
rotary_potentiometer_1 = 640

[[preset]]
name = "Cyan Diamond"
toggle_switch_9 = 1
toggle_switch_10 = 1
rotary_potentiometer_2 = 820

[[preset]]
name = "Onion Dome"
rotary_potentiometer_2 = 150
rotary_potentiometer_3 = 760
rotary_potentiometer_5 = 700

[[preset]]
name = "Many Petals"
rotary_potentiometer_1 = 900
linear_potentiometer_12 = 520
rotary_potentiometer_4 = 860

[[preset]]
name = "Osc Ripple"
toggle_switch_11 = 1
rotary_potentiometer_6 = 520
toggle_switch_8 = 1
