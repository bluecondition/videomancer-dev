# Lava - Heirloom #43 (2026-10-20), from WIN_20230605_01_14_56.
# Flame lobes dripping down into blue-violet pods, a striped curtain at the left.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.lava"
program_name = "Lava"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Organic", "Pattern"]
program_type = "processing"
description = "Red and orange flame lobes drip down into blue-violet pods past a striped magenta curtain; the picture glows inside the lobes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Lobes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Pods"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Curtain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Smear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 350
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Curtain"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Pods"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Lava", "Ice"]
initial_value_label = "Lava"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Short Drips"
linear_potentiometer_12 = 250

[[preset]]
name = "Ice Mirror"
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Osc Flood"
rotary_potentiometer_4 = 600
toggle_switch_11 = 1
linear_potentiometer_12 = 1023
