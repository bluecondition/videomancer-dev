# Lentil - Heirloom (phase 3, video clips), built 2026-11-04 (v0.1.0) from the clip WIN_20230501_01_34_42 at 0.5 s.
# Blue lumpy lenses pinched in a band, pink saw stripes flung out of each lens, ")" chevron stripes above and below;
# the patch breathes at 1.6 Hz.  See lentil.vhd, lentil.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.lentil"
program_name = "Lentil"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Warp"]
program_type = "processing"
description = "Blue lenses pinched in a band, pink saw stripes fanning out of each lens, chevrons above and below; it breathes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lenses"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Breath"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Pinch"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Lumpy", "Round"]
initial_value_label = "Lumpy"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fill"
value_labels = ["Solid", "Ghost"]
initial_value_label = "Solid"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Chevrons"
value_labels = ["Bow", "Wave"]
initial_value_label = "Bow"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Flamingo", "Lagoon"]
initial_value_label = "Flamingo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Broad Lens"
rotary_potentiometer_1 = 347
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 436

[[preset]]
name = "Dense Ghost"
rotary_potentiometer_1 = 861
toggle_switch_8 = 1

[[preset]]
name = "Seeds"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 120
linear_potentiometer_12 = 450

[[preset]]
name = "River"
rotary_potentiometer_2 = 760
rotary_potentiometer_5 = 860

[[preset]]
name = "Lagoon"
rotary_potentiometer_2 = 740
rotary_potentiometer_3 = 760
toggle_switch_10 = 1

[[preset]]
name = "Flutter"
rotary_potentiometer_2 = 900
rotary_potentiometer_4 = 1000

[[preset]]
name = "Tall Lenses"
rotary_potentiometer_3 = 300
linear_potentiometer_12 = 1023
