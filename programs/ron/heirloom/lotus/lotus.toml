# Lotus - Heirloom #33, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230515_23_23_36.
# Two orange/green contour eyes over a zigzag band and pink-white cushions on green, a stuttering
# sync staircase at the left edge.  See lotus.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.lotus"
program_name = "Lotus"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Glitch", "Color"]
program_type = "processing"
description = "Twin orange-green contour eyes over pink-white cushions on green, torn by a stuttering sync staircase."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Lobes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Stutter"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bloom"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Ripple"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Palette"
value_labels = ["Photo", "Night"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Contour"
value_labels = ["Soft", "Hard"]
initial_value_label = "Soft"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Fold"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 534
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Lotus"

[[preset]]
name = "Broad Petals"
linear_potentiometer_12 = 120

[[preset]]
name = "Moire Bloom"
rotary_potentiometer_3 = 760
linear_potentiometer_12 = 1000

[[preset]]
name = "Clean Sync"
rotary_potentiometer_2 = 0
rotary_potentiometer_4 = 700

[[preset]]
name = "Night Eyes"
rotary_potentiometer_1 = 760
toggle_switch_7 = 1
toggle_switch_10 = 1
