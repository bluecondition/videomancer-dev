# Lotus - Heirloom #33 (2026-10-20), from WIN_20230515_23_23_36.
# Orange/green nested diamonds above a seam, pink-white lobes on acid green below.
# See lotus.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.lotus"
program_name = "Lotus"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Organic"]
program_type = "processing"
description = "Nested orange and green diamonds above a seam, pink-white lobes on acid green below; the video etches both."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 1
display_max_value = 4
initial_value = 384
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 240
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lobes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 520
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
value_labels = ["Orange Green", "Blue Pink", "Red Cyan", "Mono"]
initial_value_label = "Orange Green"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Zones"
value_labels = ["Diamonds Up", "Lobes Up"]
initial_value_label = "Diamonds Up"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Rings"
value_labels = ["Hard", "Soft"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Grid"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Seam"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "All Lobes"
rotary_potentiometer_3 = 800
linear_potentiometer_12 = 0

[[preset]]
name = "All Diamonds"
rotary_potentiometer_2 = 600
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Blue Quilt"
rotary_potentiometer_1 = 1000
rotary_potentiometer_4 = 256
toggle_switch_10 = 1
linear_potentiometer_12 = 500
