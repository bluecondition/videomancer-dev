# Lozenge - Heirloom #24, rebuilt 2026-10-27 (v0.5.0) from WIN_20230410_01_10_37.
# Nested diamonds: black bands with navy/grey rings, pink/olive bands swapped by squeezing stripes,
# road-marking lines on the black bands' leading edges.  See lozenge.vhd, lozenge.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.lozenge"
program_name = "Lozenge"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Illusion"]
program_type = "processing"
description = "Nested black diamonds with road-marking edges, pink and olive bands swapped by squeezing stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Chirp"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 772
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Aspect"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Black"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Stripes"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Marks"
value_labels = ["Road", "Glow"]
initial_value_label = "Road"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Pink Olive", "Cyan Rust"]
initial_value_label = "Pink Olive"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 379
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Tunnel"
rotary_potentiometer_5 = 600
linear_potentiometer_12 = 900

[[preset]]
name = "Twin Glow"
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Cyan Rush"
rotary_potentiometer_4 = 900
toggle_switch_10 = 1
linear_potentiometer_12 = 600
