# Magma - Heirloom #29, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230515_00_46_28.
# Fanned cyan/pink streaks and blue/magenta bands from one line-locked sawtooth oscillator swept per
# line, red pockets riding the bands, and fitted lava blobs (yellow cores, red rims) with a lens row.
# See magma.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.magma"
program_name = "Magma"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Organic", "Color"]
program_type = "processing"
description = "Fanned cyan and blue stripe flow with red pockets and yellow-red lava blobs; video bends the bands. Lava on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 800
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Pockets"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Sky"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Cores"
value_labels = ["Hot", "Flat"]
initial_value_label = "Hot"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ripple"
value_labels = ["Fine", "Coarse"]
initial_value_label = "Fine"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Magma", "Ice"]
initial_value_label = "Magma"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Lava"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Magma"

[[preset]]
name = "Calm Stripes"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 680

[[preset]]
name = "Lava Flood"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 800

[[preset]]
name = "Chevrons"
toggle_switch_9 = 1
rotary_potentiometer_2 = 800

[[preset]]
name = "Ice Night"
toggle_switch_10 = 1
rotary_potentiometer_6 = 200
