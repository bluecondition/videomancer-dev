# Magma - Heirloom #29 (2026-10-20), from WIN_20230515_00_46_28.
# Three-wave field (or video) streaked, palette-mapped, red above the lava threshold.
# See magma.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.magma"
program_name = "Magma"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Organic", "Mirror"]
program_type = "processing"
description = "A streaked cyan, magenta and blue field with yellow cores, flat red wherever it saturates, mirrored. Lava level on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Streak"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blobs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Axis"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 25
display_max_value = 225
initial_value = 400
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Cyan", "Green"]
initial_value_label = "Cyan"
[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Red"
value_labels = ["Flats", "Outlines"]
initial_value_label = "Flats"
[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Poster"
value_labels = ["Off", "On"]
initial_value_label = "Off"
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"
[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Lava"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 350
display_float_digits = 0
suffix_label = "%"
[[preset]]
name = "Default"

[[preset]]
name = "Osc Field"
toggle_switch_11 = 1
linear_potentiometer_12 = 400

[[preset]]
name = "Red Sea"
linear_potentiometer_12 = 900
rotary_potentiometer_1 = 800

[[preset]]
name = "Outlined"
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 500

