# Mandala - Heirloom #6, v0.5.0 (2026-10-21): rebuilt from the photo WIN_20230128_01_06_08.
# A mirrored psychedelic mask: one smooth field drives three channels -- fine contour stripes (G),
# a blue glow ramp (B) and a red key (R).  See mandala.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.mandala"
program_name = "Mandala"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Color", "Render"]
program_type = "processing"
description = "Mirrored psychedelic mask: fine contour stripes, blue glow and red lobes from one field; video bends the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 576
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blue"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Red"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Breathe"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Stripes"
value_labels = ["Green", "Blue"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Lobes"
value_labels = ["Red", "Green"]
initial_value_label = "Red"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Edge"
value_labels = ["Soft", "Hard"]
initial_value_label = "Soft"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Faces"
value_labels = ["One", "Two"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Mandala"

[[preset]]
name = "Broad Bands"
linear_potentiometer_12 = 0
rotary_potentiometer_2 = 300

[[preset]]
name = "Moire Climax"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 900

[[preset]]
name = "Gold Mask"
toggle_switch_7 = 1
rotary_potentiometer_6 = 700

[[preset]]
name = "Twin Masks"
toggle_switch_10 = 1
toggle_switch_8 = 1
