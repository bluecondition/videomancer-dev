# Mandala - Heirloom #6 (2026-10-20), from WIN_20230128_01_06_08.
# Nested rainbow lobes from three orbiting centres. See mandala.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.mandala"
program_name = "Mandala"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Render"]
program_type = "processing"
description = "Nested rainbow rings from three orbiting centres meeting in soft lobes, the picture etched into the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Orbit"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Aspect"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Weight"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Centres"
value_labels = ["Three", "Two"]
initial_value_label = "Three"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Rainbow", "Magenta"]
initial_value_label = "Rainbow"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Rings"
value_labels = ["Smooth", "Hard"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Centres"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "One Onion"
linear_potentiometer_12 = 0

[[preset]]
name = "Hard Lobes"
rotary_potentiometer_1 = 500
toggle_switch_10 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Magenta Drift"
rotary_potentiometer_3 = 700
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 650
