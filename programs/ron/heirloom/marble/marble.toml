# Marble - Heirloom (phase 3, from the clip WIN_20230914_01_59_34 at 4.0 s), v0.1.0, 2026-11-09.
# Cream / cyan and orange / red marble arcs: an RGB patch. B = the cream key of a hard-synced, FM'd horizontal
# oscillator (the arcs roll up); G = a wider window of it over a darkening warm floor with blue-lined figures;
# R = a nested-rhombus lattice in a kaleidoscope fold.  See marble.vhd, marble.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.marble"
program_name = "Marble"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Craft", "Color", "Mirror"]
program_type = "processing"
description = "Cream and warm marble arcs: an FM'd band oscillator over a cyan rhombus lattice, blue-lined figures, rolling up."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Arcs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lattice"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 698
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Figures"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Inlay"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lattice"
value_labels = ["Positive", "Negative"]
initial_value_label = "Positive"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Guns"
value_labels = ["RGB", "GBR"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Marble"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 321
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Straight"
linear_potentiometer_12 = 0
rotary_potentiometer_1 = 700

[[preset]]
name = "Deep Swirl"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 760

[[preset]]
name = "Twin Arcs"
toggle_switch_7 = 1
linear_potentiometer_12 = 450

[[preset]]
name = "Negative"
toggle_switch_9 = 1
rotary_potentiometer_5 = 640

[[preset]]
name = "Ultraviolet"
toggle_switch_10 = 1
toggle_switch_8 = 1

[[preset]]
name = "Waves"
rotary_potentiometer_2 = 900
rotary_potentiometer_1 = 400
linear_potentiometer_12 = 420

[[preset]]
name = "Osc Melt"
toggle_switch_11 = 1
rotary_potentiometer_6 = 820
rotary_potentiometer_3 = 380
