# Medallion - Heirloom #12, rebuilt 2026-10-21 (v0.5.0) from WIN_20230305_23_51_38; phase 2 diag v0.6.0 (2026-11-03).
# Two diamonds of stepped fire rings cut by MSB-flipping stripes; an oval medallion keys in a CMY plaid.
# See medallion.vhd, medallion.py (fitted constants) and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.medallion"
program_name = "Medallion"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mask", "Color"]
program_type = "processing"
description = "Two leaning diamonds of stepped fire rings, flipped by horizontal bands; a medallion in the middle shows a CMY plaid."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Lean"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bands"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Steps"
value_labels = ["Posterize", "Smooth"]
initial_value_label = "Posterize"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Swap"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wave"
value_labels = ["Tri", "Saw"]
initial_value_label = "Tri"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Medallion"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 487
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Open Field"
linear_potentiometer_12 = 0

[[preset]]
name = "Test Card"
linear_potentiometer_12 = 1023

[[preset]]
name = "Arrowheads"
rotary_potentiometer_1 = 1023
linear_potentiometer_12 = 300

[[preset]]
name = "Bow Tie"
rotary_potentiometer_1 = 0
linear_potentiometer_12 = 380

[[preset]]
name = "Cascade"
rotary_potentiometer_4 = 120
rotary_potentiometer_2 = 640

[[preset]]
name = "Lens Bands"
rotary_potentiometer_4 = 1023
rotary_potentiometer_1 = 760

[[preset]]
name = "Inside Out"
toggle_switch_9 = 1
rotary_potentiometer_1 = 900
linear_potentiometer_12 = 420
