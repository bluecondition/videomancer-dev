# Medallion - Heirloom #12 (2026-10-20), from WIN_20230305_23_51_38.
# Warm chevron-folded stripes with a central circle showing the video as a hard plaid.
# See medallion.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.medallion"
program_name = "Medallion"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mask", "Color"]
program_type = "processing"
description = "Warm stripes folded into two chevron systems, a round medallion in the middle showing the video as a hard plaid."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Slope"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 480
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Palette"
value_labels = ["Warm", "Cool", "Rainbow"]
initial_value_label = "Warm"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Offset"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Plaid"
value_labels = ["Hard", "Soft"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Bands"
value_labels = ["8", "4"]
initial_value_label = "8"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Point"
value_labels = ["Outward", "Inward"]
initial_value_label = "Outward"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ring"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Medallion"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Cool Coin"
rotary_potentiometer_4 = 512
toggle_switch_10 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Rainbow Hole"
rotary_potentiometer_2 = 800
rotary_potentiometer_4 = 1000
toggle_switch_7 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Plaid Screen"
toggle_switch_11 = 1
linear_potentiometer_12 = 1023
