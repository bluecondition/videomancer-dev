# Monodala - one colour, topographic rings (from Heirloom Mandala), v0.2.0 (2026-11-04).
# Concentric contour rings over the whole screen, bent by the video, drawn in an accent colour over one solid
# ground colour (Mandala with its red key at -100, without the face).  See monodala.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.monodala"
program_name = "Monodala"
program_version = "0.2.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Render"]
program_type = "processing"
description = "Topographic rings in an accent colour over one solid colour; the incoming video bends the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 684
display_float_digits = 0
suffix_label = "°"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Accent"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 686
display_float_digits = 0
suffix_label = "°"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Level"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 329
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Lines"
value_labels = ["One", "Spectrum"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ink"
value_labels = ["Bright", "Dark"]
initial_value_label = "Bright"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ground"
value_labels = ["Solid", "Video"]
initial_value_label = "Solid"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Centres"
value_labels = ["One", "Two"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 494
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Blue Topo"

[[preset]]
name = "Spectrum"
toggle_switch_7 = 1

[[preset]]
name = "Amber Video"
toggle_switch_9 = 1
rotary_potentiometer_1 = 96
rotary_potentiometer_2 = 512

[[preset]]
name = "Dark Ink"
toggle_switch_8 = 1
rotary_potentiometer_1 = 172
rotary_potentiometer_2 = 0
rotary_potentiometer_4 = 1023

[[preset]]
name = "Night Rings"
rotary_potentiometer_4 = 0
toggle_switch_7 = 1

[[preset]]
name = "Moire Climax"
linear_potentiometer_12 = 1023
toggle_switch_7 = 1
rotary_potentiometer_3 = 800

[[preset]]
name = "Twin Centres"
toggle_switch_10 = 1
