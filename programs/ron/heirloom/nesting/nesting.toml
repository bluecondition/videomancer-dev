[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Photo", "Ember"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Forward", "Reverse"]
