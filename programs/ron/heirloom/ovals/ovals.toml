# Ovals - Heirloom #50, rebuilt 2026-10-27 (v0.5.0, v0.5.1 2026-10-28) from WIN_20231003_23_01_50.
# Chains of vesica ovals on a striped hot-pink ground: violet / green rainbow ropes, a double oval in the
# middle, nested diamonds and cyan stars between the columns, a white glow below.  See ovals.vhd, ovals.py.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.ovals"
program_name = "Ovals"
program_version = "0.5.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Grid", "Optics"]
program_type = "processing"
description = "Chains of rainbow-roped ovals on a striped pink ground, a double oval mid-frame, diamonds and cyan stars between."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Columns"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Links"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Split"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Ropes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Stripes"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Glow"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Twist"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Candy", "Ice"]
initial_value_label = "Candy"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Swell"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Knotted Ropes"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 700

[[preset]]
name = "Big Links"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 300

[[preset]]
name = "Chain Mail"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 900
rotary_potentiometer_5 = 300

[[preset]]
name = "Ice Weave"
toggle_switch_9 = 1
toggle_switch_10 = 1
rotary_potentiometer_3 = 900
