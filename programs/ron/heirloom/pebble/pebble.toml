# Pebble - Heirloom phase 3 (video clips), built 2026-11-04 (v0.1.0) from WIN_20230731_01_19_22 at 0.5 s.
# Red ripples (a ramp times DC + a vertical cosine, into a sawtooth colouriser) with a window onto a mirrored
# blue / magenta figure at each crest, dotted by 32-line rows; the figure itself hangs in from the top (P12 Veil).
# See pebble.vhd, pebble.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.pebble"
program_name = "Pebble"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Vision"]
program_type = "processing"
description = "Red ripples dotted by 32-line rows, each crest a window onto a mirrored blue figure that hangs in from the top."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ripples"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bend"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 671
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Origin"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 682
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Inlay"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Fire", "Ice"]
initial_value_label = "Fire"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Weave"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bend"
value_labels = ["Arc", "Zigzag"]
initial_value_label = "Arc"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Veil"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 314
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Full Veil"
linear_potentiometer_12 = 1023

[[preset]]
name = "Splash"
rotary_potentiometer_2 = 760
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 760

[[preset]]
name = "Loops"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 1023
rotary_potentiometer_5 = 640

[[preset]]
name = "Ice Zigzag"
rotary_potentiometer_4 = 800
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Weave"
rotary_potentiometer_1 = 600
rotary_potentiometer_6 = 420
toggle_switch_9 = 1

[[preset]]
name = "Twin Inlay"
rotary_potentiometer_5 = 800
toggle_switch_7 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Fine Rows"
rotary_potentiometer_1 = 700
rotary_potentiometer_4 = 900
rotary_potentiometer_6 = 180
