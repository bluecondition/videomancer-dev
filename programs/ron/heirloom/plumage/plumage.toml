# Plumage - Heirloom (phase 3, video clips), built 2026-11-04 (v0.1.0) from the clip WIN_20230710_00_15_14 at 1.5 s.
# A fan of curved violet/magenta feathers sweeping from a root at the lower left over a warm ground that a cool band
# wipes through; spikes along the bottom; torn streaks at the top left.  See plumage.vhd, plumage.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.plumage"
program_name = "Plumage"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Warp"]
program_type = "processing"
description = "A fan of curved violet and magenta feathers over a warm ground with a cool wipe; spikes below, torn streaks."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Feathers"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sweep"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 772
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Teeth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Colours"
value_labels = ["Plumage", "Rainbow"]
initial_value_label = "Plumage"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["One Fan", "Two Fans"]
initial_value_label = "One Fan"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Sky"
value_labels = ["Day", "Night"]
initial_value_label = "Day"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Root"
value_labels = ["Below", "Above"]
initial_value_label = "Below"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 380
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Rainbow Arcs"
rotary_potentiometer_1 = 860
rotary_potentiometer_3 = 760
toggle_switch_7 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Liquid"
rotary_potentiometer_4 = 950
linear_potentiometer_12 = 1023

[[preset]]
name = "Shark Teeth"
rotary_potentiometer_5 = 900
toggle_switch_9 = 1

[[preset]]
name = "Twin Plumes"
rotary_potentiometer_1 = 380
toggle_switch_8 = 1

[[preset]]
name = "Quills"
rotary_potentiometer_1 = 820
rotary_potentiometer_3 = 80

[[preset]]
name = "Flat Sweep"
rotary_potentiometer_2 = 60
rotary_potentiometer_5 = 700

[[preset]]
name = "Hanging Plumes"
rotary_potentiometer_2 = 960
toggle_switch_10 = 1
