# Plume - Heirloom #19, v0.6.0 diag (2026-11-03, phase 2): rebuilt from the photo WIN_20230315_00_58_54.
# A red plume of hooked chevrons pointing right, cut by chirped vertical seams, over wobbling green
# stripes and a blue gradient, folded top to bottom.  See plume.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.plume"
program_name = "Plume"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Mirror", "Color"]
program_type = "processing"
description = "A red plume of hooked chevrons cuts wavy green stripes, folded top to bottom; video bends seams, stripes, outline."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Seams"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Wobble"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Hooks"
value_labels = ["Plume", "All"]
initial_value_label = "Plume"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ground"
value_labels = ["Stripes", "Camera"]
initial_value_label = "Stripes"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Photo", "Swap"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wake"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Calm Water"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 560

[[preset]]
name = "Split Wake"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 700

[[preset]]
name = "Twin Plumes"
toggle_switch_7 = 1
rotary_potentiometer_2 = 380

[[preset]]
name = "Hook Field"
toggle_switch_8 = 1
rotary_potentiometer_1 = 700
linear_potentiometer_12 = 700

[[preset]]
name = "Blinds"
toggle_switch_9 = 1
rotary_potentiometer_3 = 700
rotary_potentiometer_6 = 500

[[preset]]
name = "Blue Storm"
toggle_switch_10 = 1
rotary_potentiometer_5 = 1000
rotary_potentiometer_4 = 950

[[preset]]
name = "Sliver"
rotary_potentiometer_2 = 0
rotary_potentiometer_1 = 1023
rotary_potentiometer_3 = 300
