# Plume - Heirloom #19, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230315_00_58_54.
# A red plume of hooked chevrons pointing right, cut by chirped vertical seams, over wobbling green
# stripes and a blue gradient, folded top to bottom.  See plume.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.plume"
program_name = "Plume"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Mirror", "Color"]
program_type = "processing"
description = "A red plume of hooked chevrons cuts wavy green stripes, folded top to bottom; video bends the seams and stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Seams"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Reach"
control_mode = "linear"
display_min_value = 40
display_max_value = 160
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Wedge"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ribbons"
value_labels = ["Dark", "Filled"]
initial_value_label = "Dark"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Photo", "Swap"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wake"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Plume"

[[preset]]
name = "Calm Stripes"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 560

[[preset]]
name = "Deep Wake"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 800
rotary_potentiometer_6 = 700

[[preset]]
name = "Twin Plumes"
toggle_switch_7 = 1
rotary_potentiometer_2 = 380

[[preset]]
name = "Blue Plume"
toggle_switch_10 = 1
toggle_switch_9 = 1

[[preset]]
name = "Clean Lines"
rotary_potentiometer_6 = 0
rotary_potentiometer_1 = 700
