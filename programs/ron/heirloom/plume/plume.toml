# Plume - Heirloom #19 (2026-10-20), from WIN_20230315_00_58_54.
# A central plume of chevron ripples flaring red / magenta / yellow out of green and blue flow.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.plume"
program_name = "Plume"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Mirror", "Pattern"]
program_type = "processing"
description = "A plume of chevron ripples flares red, magenta and yellow out of a green and blue flow; the picture masks the ripples."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ripple"
control_mode = "linear"
display_min_value = 1
display_max_value = 64
initial_value = 380
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 1
display_max_value = 64
initial_value = 300
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Edge"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Dark"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Weave"
value_labels = ["Chevron", "Diagonal"]
initial_value_label = "Chevron"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Fire", "Ice"]
initial_value_label = "Fire"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bands"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Flare"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Ice Column"
toggle_switch_9 = 1
linear_potentiometer_12 = 150

[[preset]]
name = "Full Flare"
rotary_potentiometer_1 = 700
rotary_potentiometer_6 = 0
linear_potentiometer_12 = 1023

[[preset]]
name = "Osc Stripes"
toggle_switch_8 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 600
