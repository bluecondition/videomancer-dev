# Pods - Heirloom (video phase), built 2026-11-09 (v0.1.1: Quad origin on the middle line, Osc bends the geometry) from the clip WIN_20230328_00_11_14 at 0.5 s.
# Rows of cyan eyes and maroon cells crossing the rings of a corner zone plate, cut into pods by mint gaps that
# open along arcs round the top corners; the rows scroll up.  See pods.vhd, pods.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.pods"
program_name = "Pods"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Organic", "Optics"]
program_type = "processing"
description = "Cyan eyes and maroon cells on zone-plate rings, cut into pods by mint arcs from the top corners, rows rising."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Arcs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Cells"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Quad"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Pods", "Chevron"]
initial_value_label = "Pods"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mosaic"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Fold"
value_labels = ["Mirror", "Sweep"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Pods"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 487
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Chevron Stack"
toggle_switch_8 = 1
toggle_switch_9 = 1
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 330
rotary_potentiometer_1 = 380

[[preset]]
name = "Kaleidoscope"
toggle_switch_7 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Bare Lattice"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 820

[[preset]]
name = "Thin Pods"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 700

[[preset]]
name = "Sweep"
toggle_switch_10 = 1
rotary_potentiometer_2 = 650

[[preset]]
name = "Ring Stripes"
rotary_potentiometer_5 = 1023
rotary_potentiometer_1 = 300

[[preset]]
name = "Osc Bloom"
toggle_switch_11 = 1
rotary_potentiometer_6 = 820
