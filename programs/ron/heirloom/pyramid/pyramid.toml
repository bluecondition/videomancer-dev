# Pyramid - Heirloom (video phase), built 2026-11-09 (v0.1.0) from the clip WIN_20231124_00_45_44 at 5.0 s.
# A curved-sided pyramid filled with three oscillators patched into R, G and B (wavefolded G stripes, a slow
# B cosine, an egg-crate R through a folder) on a teal ground keyed by the same shape, drifting left.
# See pyramid.vhd, pyramid.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.pyramid"
program_name = "Pyramid"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Color"]
program_type = "processing"
description = "A curved pyramid of rainbow oscillator stripes drifting over a teal ground of nested arches."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Curve"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 324
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Warp"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Ground"
value_labels = ["Teal", "Grey"]
initial_value_label = "Teal"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Colour"
value_labels = ["RGB", "GBR"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Arches"
value_labels = ["Smooth", "Banded"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 538
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Grey Room"
toggle_switch_7 = 1
rotary_potentiometer_1 = 600

[[preset]]
name = "Range"
toggle_switch_8 = 1
rotary_potentiometer_1 = 380
linear_potentiometer_12 = 600

[[preset]]
name = "Spire"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 80
linear_potentiometer_12 = 700

[[preset]]
name = "Dome Rings"
rotary_potentiometer_2 = 950
rotary_potentiometer_5 = 900
toggle_switch_10 = 1

[[preset]]
name = "Fire Wall"
toggle_switch_9 = 1
linear_potentiometer_12 = 1000
rotary_potentiometer_3 = 700

[[preset]]
name = "Osc Zigzag"
toggle_switch_11 = 1
rotary_potentiometer_6 = 800
rotary_potentiometer_4 = 200
