# Quill - Heirloom (phase 3, video clips), built 2026-11-09 (v0.1.0) from the clip WIN_20230910_00_11_50 at 7.0 s.
# Blue feather plumes on black: a VCO hard-synced at hsync, exponentially FM'd by a parabola in the distance from a
# horizontal spine, keyed three ways (blue body, cyan / magenta dotted barbs, green / red far field).  See quill.vhd,
# quill.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.quill"
program_name = "Quill"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Warp"]
program_type = "processing"
description = "Blue feather quills hanging from a sliding spine, dotted cyan barbs, a green far field; three hard keys."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Quills"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Curl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Spine"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Sweep"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Barbs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Warp"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Spines"
value_labels = ["One", "Three"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Ice", "Ember"]
initial_value_label = "Ice"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Plumage"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Held Still"
rotary_potentiometer_4 = 512

[[preset]]
name = "Flood"
linear_potentiometer_12 = 900

[[preset]]
name = "Seam"
toggle_switch_7 = 1
rotary_potentiometer_3 = 700

[[preset]]
name = "Three Rows"
toggle_switch_8 = 1
rotary_potentiometer_4 = 600

[[preset]]
name = "Ember Fan"
toggle_switch_9 = 1
rotary_potentiometer_2 = 820

[[preset]]
name = "Splayed"
rotary_potentiometer_2 = 60
rotary_potentiometer_1 = 380

[[preset]]
name = "Fast Sweep"
rotary_potentiometer_4 = 960
rotary_potentiometer_5 = 760
