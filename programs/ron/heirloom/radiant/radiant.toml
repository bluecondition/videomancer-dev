# Radiant - Heirloom #52, v0.6.0 phase-2 diag (2026-11-03; v0.5.0 2026-10-27): rebuilt from duci.jpg (one of Ron's portrait paper collages).
# Pink and white paper rays burst from a dark halo behind a bust with a flag lens and a cup of coffee on his
# head; a woman in a cream gown, a soldier in camouflage, hands holding coal with a DUCI label, on a maroon
# ground of paint and torn tissue.  The camera is printed through the cut-outs.  See radiant.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.radiant"
program_name = "Radiant"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mask", "Shape", "Craft"]
program_type = "processing"
description = "Collage: pink rays burst from a halo behind a bust with a flag lens; the camera printed through cut-out figures."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Halo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Pulse"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Flank"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
