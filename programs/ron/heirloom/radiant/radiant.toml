# Radiant - Heirloom #52 (2026-10-20), from duci.jpg (paper collage).
# A sunburst of pink/white rays round a dark halo with the video cut in.
# See radiant.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.radiant"
program_name = "Radiant"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mask", "Shape", "Craft"]
program_type = "processing"
description = "A collage sunburst: pink and white rays round a dark halo on a maroon ground, the video cut in at the centre."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rays"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 704
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Halo"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ring"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 250
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Ground"
value_labels = ["Maroon", "Navy", "Forest", "Ochre", "Plum", "Teal", "Rust", "Slate"]
initial_value_label = "Maroon"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spin"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Centre"
control_mode = "linear"
display_min_value = 25
display_max_value = 75
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Rays"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Halo"
value_labels = ["Dark", "Glow"]
initial_value_label = "Dark"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cutout"
value_labels = ["Inside", "Outside"]
initial_value_label = "Inside"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Pink", "Cyan"]
initial_value_label = "Pink"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Rays"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Full Disc"
rotary_potentiometer_1 = 1000
linear_potentiometer_12 = 1023

[[preset]]
name = "Cyan Glow"
rotary_potentiometer_4 = 640
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 450

[[preset]]
name = "Outside In"
rotary_potentiometer_2 = 700
toggle_switch_9 = 1
linear_potentiometer_12 = 200
