# Ribboncandy - Heirloom #39 (rebuilt 2026-10-27), from WIN_20230530_22_27_05.
# Two hsync-reset oscillators, each frequency-modulated per line: the ribbon oscillator draws four
# S-curving twisted ribbons (green / blue faces, magenta / red thin ribbon), the face oscillator
# picks the faces and clocks a sample-and-hold cell mosaic behind them.  See ribboncandy.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.ribboncandy"
program_name = "Ribboncandy"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Pattern", "Pixel"]
program_type = "processing"
description = "Twisted green/blue ribbons S-curving down a sample-and-hold cell mosaic; ribbon widths, weave, mirror. Wave on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ribbons"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Patch"
value_labels = ["RGB", "RBG", "GRB", "GBR", "BRG", "BGR"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Twist"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Cells"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Faces"
value_labels = ["Twist", "Cells"]
initial_value_label = "Twist"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ground"
value_labels = ["Cells", "Black"]
initial_value_label = "Cells"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Kinks"
value_labels = ["Photo", "All"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Wrapper"
toggle_switch_10 = 1
linear_potentiometer_12 = 720

[[preset]]
name = "Weave"
rotary_potentiometer_4 = 960
toggle_switch_11 = 1

[[preset]]
name = "Scatter"
rotary_potentiometer_1 = 900
rotary_potentiometer_5 = 820

[[preset]]
name = "Zigzag"
toggle_switch_9 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Mosaic Faces"
toggle_switch_7 = 1
toggle_switch_8 = 1

[[preset]]
name = "Straight"
linear_potentiometer_12 = 0
rotary_potentiometer_1 = 200

[[preset]]
name = "Whiplash"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 1000
toggle_switch_9 = 1
toggle_switch_10 = 1
