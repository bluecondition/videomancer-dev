# Ricochet - Heirloom #30, rebuilt 2026-10-21 (v0.5.0) from WIN_20230515_23_08_59.
# Nested chevrons pointing right from red cores, orange to cyan bands, seam stripes, flat orange ground.
# See ricochet.vhd, ricochet.py (fitted constants) and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.ricochet"
program_name = "Ricochet"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Shape"]
program_type = "processing"
description = "Chevrons fire from red cores, orange to cyan bands streaming out to a flat orange ground; seams split into stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Chevrons"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 473
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Core"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 353
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 549
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Seams"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Point"
value_labels = ["Right", "Left"]
initial_value_label = "Right"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ground"
value_labels = ["Flat", "Echo"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Photo", "Azure"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 490
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Full Reach"
linear_potentiometer_12 = 1023

[[preset]]
name = "Bowtie"
toggle_switch_8 = 1
linear_potentiometer_12 = 620

[[preset]]
name = "Echoes"
toggle_switch_9 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Azure Twin"
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Six Systems"
rotary_potentiometer_1 = 1023
rotary_potentiometer_3 = 700

[[preset]]
name = "Etched"
rotary_potentiometer_6 = 620
linear_potentiometer_12 = 650

[[preset]]
name = "Osc Weave"
toggle_switch_11 = 1
rotary_potentiometer_6 = 520
linear_potentiometer_12 = 820
