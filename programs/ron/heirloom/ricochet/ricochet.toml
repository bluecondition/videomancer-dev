# Ricochet - Heirloom #30 (2026-10-20), from WIN_20230515_23_08_59.
# Nested cyan / lavender chevrons on orange, mirrored, the picture etched in.
# See ricochet.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.ricochet"
program_name = "Ricochet"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Shape"]
program_type = "processing"
description = "Nested cyan and lavender chevrons point across an orange ground, mirrored top and bottom, the picture pushing the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Centre"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Point"
value_labels = ["Right", "Left"]
initial_value_label = "Right"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Cyan", "Pink"]
initial_value_label = "Cyan"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Rings"
value_labels = ["Hard", "Soft"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Full Field"
linear_potentiometer_12 = 1023

[[preset]]
name = "Pink Bands"
toggle_switch_8 = 0
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Deep Etch"
rotary_potentiometer_6 = 900
linear_potentiometer_12 = 700
