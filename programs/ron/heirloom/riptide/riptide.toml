# Riptide - Heirloom #15 (2026-10-20), from WIN_20230309_00_28_35.
# Saturated smear band between speckle-streak fields.
# See riptide.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.riptide"
program_name = "Riptide"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Noise", "Color", "Signal"]
program_type = "processing"
description = "A band of saturated rainbow flow across the middle, dithered blue and red speckle streaks above and below. Band on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Smear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Saturate"
control_mode = "linear"
display_min_value = 50
display_max_value = 850
initial_value = 400
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Density"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Position"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Crawl"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""
[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Smear"
value_labels = ["Colour", "Luma"]
initial_value_label = "Colour"
[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Speckles"
value_labels = ["Opposite", "Near"]
initial_value_label = "Opposite"
[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Band"
value_labels = ["Single", "Twin"]
initial_value_label = "Single"
[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Poster"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"
[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"
[[preset]]
name = "Default"

[[preset]]
name = "Slit"
linear_potentiometer_12 = 60
rotary_potentiometer_3 = 700

[[preset]]
name = "Twin Rivers"
toggle_switch_9 = 1
linear_potentiometer_12 = 250
rotary_potentiometer_4 = 300

[[preset]]
name = "Full Flood"
linear_potentiometer_12 = 1023
rotary_potentiometer_2 = 700

