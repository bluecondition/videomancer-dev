# Rorschach - Heirloom #4 (2026-10-20), from WIN_20221124_22_54_05.
# Posterized pastel mirror with wavy stripes and row tears.
# See rorschach.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.rorschach"
program_name = "Rorschach"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Color", "Glitch"]
program_type = "processing"
description = "The picture posterized to pastels over wavy stripes, mirrored left and right, torn sideways in bands. Tear on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Key"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 480
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Wave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Axis"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Stripes"
value_labels = ["Off", "On"]
initial_value_label = "On"
[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Pastel", "Bold"]
initial_value_label = "Pastel"
[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Key"
value_labels = ["Bright", "Dark"]
initial_value_label = "Bright"
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"
[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 350
display_float_digits = 0
suffix_label = "%"
[[preset]]
name = "Default"

[[preset]]
name = "Clean Mirror"
linear_potentiometer_12 = 0

[[preset]]
name = "Bold Shreds"
toggle_switch_9 = 1
rotary_potentiometer_5 = 800
linear_potentiometer_12 = 900

[[preset]]
name = "Dark Inkblot"
toggle_switch_10 = 1
rotary_potentiometer_1 = 300
linear_potentiometer_12 = 400

