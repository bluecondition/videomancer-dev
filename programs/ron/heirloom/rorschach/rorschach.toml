# Rorschach Diag - Heirloom #4, v0.6.0 (2026-11-03, phase-2 diag): K2 Ink (dark band width), K4 drift,
# K5 to 8 folds, S8 Stairs Hue / All, S9 Quad mirror, P12 slip. v0.5.0 (2026-10-21): rebuilt from the photo WIN_20221124_22_54_05.
# Camera video folded top to bottom (a frame-store mirror) through an 8-colour cyclic colourizer:
# cream / peach / pink / orchid / lavender / pale cyan bands, and a dark band in blue or red
# sample-and-held in 42-px cells; busy fragments and frame-store tears either side of the fold.
# See rorschach.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.rorschach"
program_name = "Rorschach"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Color", "Glitch"]
program_type = "processing"
description = "Camera folded into a pastel colourizer inkblot: ink width, quad mirror, drift and slip, stair mosaic, frame-store tears."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

# --- Rotary Potentiometers (1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 387
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Palette"
value_labels = ["Rorschach", "Ink", "Swap", "Comp", "Turn", "Twist", "Night", "Vivid"]
initial_value_label = "Rorschach"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Fold"
control_mode = "linear"
display_min_value = 12
display_max_value = 100
initial_value = 423
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Mirror", "Repeat"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Stairs"
value_labels = ["Hue", "All"]
initial_value_label = "Hue"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Quad"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Negative"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

# --- Linear Potentiometer (12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 358
display_float_digits = 0
suffix_label = "%"

