# Seaweed - Heirloom (phase 3, video clips), built 2026-11-09 (v0.1.0) from the still WIN_20230402_23_03_06 at 0.5 s.
# Wavy green / mint / lavender curtain bands swinging harder to the right, brown cores and violet lines between
# them, hard black pebble blobs along the top: one hsync-reset VCO FM'd by a travelling LFO, a sub-octave
# colouriser and a half-rate key oscillator.  See seaweed.vhd, seaweed.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.seaweed"
program_name = "Seaweed"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Warp", "Organic"]
program_type = "processing"
description = "Wavy green curtain bands swaying in a travelling wave, brown cores, violet lines and black pebble blobs."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Wave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 768
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Blobs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Cores"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Pools"
value_labels = ["Ink", "Glow"]
initial_value_label = "Ink"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Kelp", "Coral"]
initial_value_label = "Kelp"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Sway"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 458
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Still Curtain"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 600

[[preset]]
name = "Storm"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 900

[[preset]]
name = "Black Pools"
rotary_potentiometer_4 = 900
rotary_potentiometer_5 = 300

[[preset]]
name = "Kelp Mirror"
toggle_switch_7 = 1
linear_potentiometer_12 = 620

[[preset]]
name = "Coral Glow"
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Hanging"
toggle_switch_9 = 1
rotary_potentiometer_5 = 760

[[preset]]
name = "Fine Ripple"
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 760
linear_potentiometer_12 = 300
