# Seismic - Heirloom #44 (2026-10-20), from WIN_20230610_00_10_54.
# Rainbow smear rows alternating with rows of glowing lenses. See seismic.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.seismic"
program_name = "Seismic"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Signal", "Render"]
program_type = "processing"
description = "Rows of the picture smeared under a rainbow alternate with rows of glowing lenses on black. Lens size on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 340
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Lenses"
control_mode = "linear"
display_min_value = 2
display_max_value = 33
initial_value = 420
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Smear"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 400
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Rows"
value_labels = ["Smear First", "Lenses First"]
initial_value_label = "Smear First"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Lenses"
value_labels = ["Round", "Bars"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Rainbow", "CMY"]
initial_value_label = "Rainbow"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ground"
value_labels = ["Black", "White"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Blobs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Big Smear"
rotary_potentiometer_4 = 900
rotary_potentiometer_1 = 700
linear_potentiometer_12 = 900

[[preset]]
name = "CMY Bars"
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "White Dots"
rotary_potentiometer_2 = 1000
toggle_switch_10 = 1
linear_potentiometer_12 = 300
