# Seismic - Heirloom #44 (2026-10-27 rebuild, v0.5.0), from WIN_20230610_00_10_54.
# An FM chirp against five clipped vertical ribbons, keyed per channel, in 24 staircase strips.
# See seismic.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.seismic"
program_name = "Seismic"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Signal", "Render"]
program_type = "processing"
description = "A chirped oscillator across five ribbons with lobed gaps, torn into 24 staircase strips. Quake on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Rows"
control_mode = "linear"
display_min_value = 50
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sweep"
control_mode = "linear"
display_min_value = 42
display_max_value = 234
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lobes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Width"
control_mode = "linear"
display_min_value = 55
display_max_value = 145
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Blocks"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Sweep Shape"
value_labels = ["Fold", "Ramp"]
initial_value_label = "Fold"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Photo", "Swap"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Steps"
value_labels = ["Staircase", "Shuffle"]
initial_value_label = "Staircase"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Quake"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Calm"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 560

[[preset]]
name = "Aftershock"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 800
rotary_potentiometer_2 = 760

[[preset]]
name = "Blue Ribbons"
toggle_switch_9 = 1
rotary_potentiometer_1 = 700
rotary_potentiometer_3 = 800
