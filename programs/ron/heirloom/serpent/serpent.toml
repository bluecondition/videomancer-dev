# Serpent - Heirloom phase 3 (video clips), built 2026-11-04 (v0.1.0) from WIN_20230529_01_27_21 at 0.5 s.
# A coiled ribbon on black: a sawtooth colour field bent into an S, cut into fins, teeth and lens holes by a
# column oscillator, a red halo glowing through, a fan of tails at the bottom right.  See serpent.vhd,
# serpent.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.serpent"
program_name = "Serpent"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Curve"]
program_type = "processing"
description = "A coiled ribbon of green, yellow and purple bands, cut into fins and lens holes, a red halo glowing through."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Turns"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Columns"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 747
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Holes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Halo"
value_labels = ["Red", "Off"]
initial_value_label = "Red"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Key"
value_labels = ["Fins", "Lattice"]
initial_value_label = "Fins"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Still", "Ice"]
initial_value_label = "Still"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Coil"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 341
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Straight"
linear_potentiometer_12 = 0
rotary_potentiometer_5 = 800

[[preset]]
name = "Wild Coil"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 800

[[preset]]
name = "Double Tail"
toggle_switch_7 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Spring"
rotary_potentiometer_1 = 950
rotary_potentiometer_3 = 700
linear_potentiometer_12 = 450

[[preset]]
name = "Lattice"
toggle_switch_9 = 1
rotary_potentiometer_3 = 300
rotary_potentiometer_5 = 900

[[preset]]
name = "Ice Bands"
toggle_switch_10 = 1
rotary_potentiometer_2 = 800
toggle_switch_8 = 1

[[preset]]
name = "Camera Coil"
rotary_potentiometer_6 = 800
linear_potentiometer_12 = 600
