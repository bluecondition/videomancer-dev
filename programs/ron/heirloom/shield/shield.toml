# Shield - Heirloom #38, rebuilt 2026-10-27 (v0.5.0) from WIN_20230529_22_56_41.
# Two shields of nested U bands cut by orange / red stripes into a plaid, dark-red and blue outline ramps,
# a red M body, blue pillars and seam stripes.  See shield.vhd, shield.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.shield"
program_name = "Shield"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Mirror"]
program_type = "processing"
description = "Twin striped shields in orange-red plaid, ringed by dark red and blue ramps, over a red M and blue pillars."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Shields"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 213
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Pillars"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Line"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Tincture"
value_labels = ["Gules", "Azure"]
initial_value_label = "Gules"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Stripes"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 365
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Banners"
rotary_potentiometer_2 = 300
linear_potentiometer_12 = 0

[[preset]]
name = "Cascade"
rotary_potentiometer_4 = 760
linear_potentiometer_12 = 1023

[[preset]]
name = "Six Shields"
rotary_potentiometer_1 = 1023
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 520

[[preset]]
name = "Azure Crown"
toggle_switch_8 = 1
toggle_switch_9 = 1
rotary_potentiometer_2 = 700
