# Sinew - Heirloom #18 (2026-10-20), from WIN_20230315_00_53_56.
# The picture wrung into S-curves by a vertical sine, with row ripple.
# See sinew.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.sinew"
program_name = "Sinew"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Warp", "Color", "Signal"]
program_type = "processing"
description = "The picture wrung into S-curves by a vertical sine inside a band, row ripple on top, hue-rotated and tinted warm."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Period"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 360
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 620
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ripple"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 240
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 580
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 25
display_max_value = 325
initial_value = 380
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Band"
value_labels = ["Band", "All"]
initial_value_label = "Band"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ripple"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tint"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Fold"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wring"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Warm Bars"
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Whole Wring"
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Still Ripple"
rotary_potentiometer_3 = 700
linear_potentiometer_12 = 0
