# Sinew Diag - Heirloom #18, v0.6.0 phase-2 diag (2026-11-09); v0.5.0 (2026-10-21): rebuilt from the photo WIN_20230315_00_53_56.
# Seven orange ropes S-curving down the frame, crossed by thin sinew lines that bulge and fan into
# green shingles, between a yellow/green and a pink/navy bar band.  See sinew.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.sinew"
program_name = "Sinew"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Color", "Signal"]
program_type = "processing"
description = "Orange ropes crossed by sinew lines that pinch, hook and tear; mirror and storm modes; video melts the sinews and ropes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ropes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sinews"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Twist"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Palette"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tear"
value_labels = ["Photo", "Storm"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Wave"
value_labels = ["Triangle", "Saw"]
initial_value_label = "Triangle"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bands"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Pinch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Combed"
linear_potentiometer_12 = 0
rotary_potentiometer_3 = 384

[[preset]]
name = "Hooked"
linear_potentiometer_12 = 1023
rotary_potentiometer_2 = 600

[[preset]]
name = "Totem"
toggle_switch_8 = 1
rotary_potentiometer_3 = 1023
rotary_potentiometer_1 = 400

[[preset]]
name = "Storm"
toggle_switch_7 = 1
rotary_potentiometer_4 = 900
linear_potentiometer_12 = 700

[[preset]]
name = "Molten"
toggle_switch_11 = 1
rotary_potentiometer_6 = 1023

[[preset]]
name = "Reverse S"
rotary_potentiometer_3 = 0
rotary_potentiometer_2 = 300
toggle_switch_9 = 1

[[preset]]
name = "Fine Weave"
rotary_potentiometer_1 = 1023
rotary_potentiometer_2 = 1023
linear_potentiometer_12 = 300
toggle_switch_10 = 0
