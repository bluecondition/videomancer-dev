# Spearhead - Heirloom #5 rebuild (2026-10-21), from WIN_20230103_01_29_30.
# Two spearheads of XOR-coloured outline bands, re-coloured row by row, a mosaic shadow
# thrown to the right, over pastel rows with V chevrons.  See spearhead.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.spearhead"
program_name = "Spearhead"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pixel", "Pattern"]
program_type = "processing"
description = "Spearheads of XOR-coloured outline bands, re-coloured row by row, a mosaic shadow at their side. Thrust on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Spears"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 456
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Taper"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 520
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 472
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Mosaic"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 488
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 64
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shadow"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Rows"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Photo", "Alt"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Point"
value_labels = ["Down", "Up"]
initial_value_label = "Down"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Thrust"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 424
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Needles"
rotary_potentiometer_1 = 640
linear_potentiometer_12 = 180

[[preset]]
name = "Interlock"
rotary_potentiometer_3 = 600
linear_potentiometer_12 = 1000

[[preset]]
name = "Plain Bands"
toggle_switch_7 = 1
toggle_switch_8 = 1
rotary_potentiometer_4 = 512

[[preset]]
name = "Big Blocks"
rotary_potentiometer_5 = 900
rotary_potentiometer_4 = 760
