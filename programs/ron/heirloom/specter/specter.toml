[[preset]]
name = "Twin Shades"
toggle_switch_7 = 1
toggle_switch_9 = 1

[[preset]]
name = "Ember Drip"
rotary_potentiometer_5 = 980
toggle_switch_10 = 1

[[preset]]
name = "Barcode"
rotary_potentiometer_2 = 1023
