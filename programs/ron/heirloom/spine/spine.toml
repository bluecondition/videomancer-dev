# Spine - Heirloom phase 3 (video clips), built 2026-11-09 (v0.1.0) from WIN_20230906_00_33_30 at 11.0 s.
# A magenta gradient band cut diagonally through a purple / green ring lattice; its edges are staircases of
# hooked teeth with magenta rims and violet shadows (P12 Vertebrae). See spine.vhd, spine.py and SUMMARY.md.

[program]
processing_delay_clks = 48
program_id = "com.czartroniks.spine"
program_name = "Spine"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Mirror", "Vision"]
program_type = "processing"
description = "A magenta band cut diagonally through a purple and green ring lattice, its edges hooked teeth with lit rims."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Teeth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Band"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Slant"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Magenta", "Verdant"]
initial_value_label = "Magenta"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tear"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Vertebrae"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 410
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Shattered"
linear_potentiometer_12 = 1023

[[preset]]
name = "Clean Band"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 760

[[preset]]
name = "Vertebrae"
rotary_potentiometer_2 = 160
linear_potentiometer_12 = 560

[[preset]]
name = "Twin Spines"
toggle_switch_7 = 1
rotary_potentiometer_3 = 700

[[preset]]
name = "Verdant Tear"
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Fine Comb"
rotary_potentiometer_1 = 820
rotary_potentiometer_5 = 760

[[preset]]
name = "Inside Out"
toggle_switch_9 = 1
rotary_potentiometer_2 = 300
