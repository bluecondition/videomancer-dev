# Staircase - Heirloom (video clips), built 2026-11-09 (v0.1.0) from WIN_20230318_14_13_38 at 0.5 s.
# A digital cell pattern: a cyan / grey brick checker crossed by diagonal chains of stair glyphs (black rails,
# magenta / yellow / white treads, yellow / white rungs) that branch for single frames.
# See staircase.vhd, staircase.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.staircase"
program_name = "Staircase"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Pattern", "Glitch"]
program_type = "processing"
description = "Diagonal chains of pixel stair glyphs climbing a cyan and grey brick checker, branching in glitches."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bricks"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 448
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lean"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Climb"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Rise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 448
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 224
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Branch"
value_labels = ["Flicker", "Held"]
initial_value_label = "Flicker"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Bricks"
value_labels = ["Checker", "Mosaic"]
initial_value_label = "Checker"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cross"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Cyan Grey", "Pink Teal"]
initial_value_label = "Cyan Grey"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Stairs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 578
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Branching"
toggle_switch_7 = 1

[[preset]]
name = "Alt Mosaic"
rotary_potentiometer_1 = 700
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Crossing"
toggle_switch_9 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Lone Stair"
rotary_potentiometer_4 = 680
linear_potentiometer_12 = 0

[[preset]]
name = "Escalator"
