# Starburst - Heirloom #3 (2026-10-20), from WIN_20221122_23_37_36.
# Mirror-cell kaleidoscope of saddle contour bands, the video etched into them.
# See starburst.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.starburst"
program_name = "Starburst"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mirror", "Pattern", "Illusion"]
program_type = "processing"
description = "A mirror-cell kaleidoscope of X's and chevron bands in CMYK with serrated edges, the picture etched into the bands."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 448
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Spikes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Tilt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Palette"
value_labels = ["CMYK", "RGB", "Warm", "Cool", "Mono", "Neon", "Pastel", "Ember"]
initial_value_label = "CMYK"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Lattice"
value_labels = ["Mirror", "Tile"]
initial_value_label = "Mirror"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Saddle", "Diamond"]
initial_value_label = "Saddle"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Noise"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Negative"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Chroma"
value_labels = ["Palette", "Video"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 350
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Pure Burst"
rotary_potentiometer_3 = 400
linear_potentiometer_12 = 0

[[preset]]
name = "Carved Face"
rotary_potentiometer_1 = 64
rotary_potentiometer_2 = 500
toggle_switch_11 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Neon Diamonds"
rotary_potentiometer_6 = 704
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 500
