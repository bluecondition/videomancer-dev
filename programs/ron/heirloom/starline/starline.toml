# Starline - Heirloom (video phase), built 2026-11-09 (v0.1.0) from the clip WIN_20231218_21_31_11 at 3.0 s.
# A neon star of nested tubes: two points, bowed arcs, a V and a band of rays, magenta-white to green, with the
# colours sweeping sideways on a slow LFO.  See starline.vhd, starline.py, SUMMARY.md.

[program]
processing_delay_clks = 40
program_id = "com.czartroniks.starline"
program_name = "Starline"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Color"]
program_type = "processing"
description = "A neon star of nested magenta and green tubes, two points, bowed arcs and a band of rays, colours sweeping."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Arcs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Waist"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 449
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Points"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Sweep"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Beads"
value_labels = ["Zone", "All"]
initial_value_label = "Zone"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Wash"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colour"
value_labels = ["Neon", "Ember"]
initial_value_label = "Neon"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Neon"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 187
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Tunnel"
linear_potentiometer_12 = 1023

[[preset]]
name = "Four Arms"
toggle_switch_7 = 1
linear_potentiometer_12 = 400

[[preset]]
name = "Ember Hooks"
toggle_switch_10 = 1
rotary_potentiometer_1 = 900

[[preset]]
name = "Rainbow Bars"
rotary_potentiometer_5 = 900
rotary_potentiometer_4 = 700

[[preset]]
name = "Mosaic"
toggle_switch_8 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Bare Tubes"
toggle_switch_9 = 1
rotary_potentiometer_2 = 250

[[preset]]
name = "Lens"
rotary_potentiometer_2 = 60
rotary_potentiometer_1 = 300
