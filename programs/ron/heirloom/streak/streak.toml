# Streak - Heirloom #7 (2026-10-20), from WIN_20230129_00_40_34.
# Horizontal smear, per-band hue rotation, barcode blocks under a diagonal.
# See streak.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.streak"
program_name = "Streak"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Glitch", "Color", "Signal"]
program_type = "processing"
description = "The picture smeared into rainbow streaks, the hue turning band by band, barcode blocks below a diagonal. Smear on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 240
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Slope"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""
[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Blocks"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 240
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spin"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 560
display_float_digits = 0
suffix_label = "%"
[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Smear"
value_labels = ["Colour", "Luma"]
initial_value_label = "Colour"
[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Barcode"
value_labels = ["Below", "Above"]
initial_value_label = "Below"
[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Luma"
value_labels = ["Keep", "Ramp"]
initial_value_label = "Keep"
[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bands"
value_labels = ["Still", "Scroll"]
initial_value_label = "Still"
[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"
[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Smear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"
[[preset]]
name = "Default"

[[preset]]
name = "Clean Bands"
linear_potentiometer_12 = 0
rotary_potentiometer_2 = 600

[[preset]]
name = "Barcode Ramp"
toggle_switch_9 = 1
rotary_potentiometer_4 = 100
linear_potentiometer_12 = 900

[[preset]]
name = "Scrolling"
toggle_switch_10 = 1
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 500

