# Tangram - Heirloom #9, v0.5.0 (2026-10-21): rebuilt from the photo WIN_20230222_00_06_47.
# An additive RGB patch: hot-pink log-chirped stripe fans (red), a stepped green zig-zag plateau and
# lower sawtooth stripes (green), a bright blue wedge and lower V with dark fringes on navy (blue).
# See tangram.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.tangram"
program_name = "Tangram"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Vision", "Glitch"]
program_type = "processing"
description = "Pink stripe fans, a green zig-zag plateau and a blue ray wedge mixed additively; the camera bends the stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Wedge"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Zigzag"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Ramps"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tear"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Key"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Photo", "Rotate"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 358
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"
toggle_switch_11 = 1

[[preset]]
name = "Broad Bands"
linear_potentiometer_12 = 0
rotary_potentiometer_1 = 600

[[preset]]
name = "Fine Fans"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 330

[[preset]]
name = "Mirror Temple"
toggle_switch_10 = 1
rotary_potentiometer_2 = 760

[[preset]]
name = "Rotated"
toggle_switch_9 = 1
rotary_potentiometer_3 = 900

[[preset]]
name = "Clean Field"
toggle_switch_7 = 0
toggle_switch_8 = 0
