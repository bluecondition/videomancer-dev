# Tapers - Heirloom (video phase), built 2026-11-04 (v0.1.0) from the clip WIN_20230203_00_19_56 at 6.0 s.
# A row of candle-flame columns filled with pink / lavender / sky / green mosaic rows, rising through a dark
# field of blue and maroon dashes shaped by the camera.  See tapers.vhd, tapers.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.tapers"
program_name = "Tapers"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Colorizer"]
program_type = "processing"
description = "Candle-flame columns of pink and green mosaic rows rising through blue and maroon dashes cut by the camera."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tapers"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bowl"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 341
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Steps"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 358
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rise"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 776
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Hue Cycle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Mosaic"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Flip"
value_labels = ["Rise", "Hang"]
initial_value_label = "Rise"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Neon", "Amber"]
initial_value_label = "Neon"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Rows"
value_labels = ["Mosaic", "Smooth"]
initial_value_label = "Mosaic"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Height"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Forest"
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 120
rotary_potentiometer_3 = 700
linear_potentiometer_12 = 420

[[preset]]
name = "Stalactites"
rotary_potentiometer_4 = 300
toggle_switch_7 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Neon Wall"
rotary_potentiometer_5 = 700
toggle_switch_10 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Amber Ghosts"
rotary_potentiometer_6 = 760
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Candles"
rotary_potentiometer_1 = 330
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 100
rotary_potentiometer_4 = 650
linear_potentiometer_12 = 300
