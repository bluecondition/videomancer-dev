# Tartan - Heirloom #25, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230410_01_13_24.
# A big A-frame of nested cyan / green / orange / magenta diagonal stripes, cut by FM-squeezed
# horizontal bands of a dark colourizer (black, cyan and green with yellow fringes).
# See tartan.vhd and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.tartan"
program_name = "Tartan"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Glitch", "Color"]
program_type = "processing"
description = "Neon A-frame of nested diagonal stripes cut by squeezed dark bands with yellow-fringed black stripes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 507
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Slope"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 564
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 513
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Squeeze"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 498
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 341
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fringe"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tear"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Photo", "Night"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shade"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Bright Tartan"
linear_potentiometer_12 = 0

[[preset]]
name = "Dark Tartan"
linear_potentiometer_12 = 1023

[[preset]]
name = "Even Bands"
rotary_potentiometer_4 = 0
toggle_switch_8 = 1

[[preset]]
name = "Folded Night"
rotary_potentiometer_4 = 1023
rotary_potentiometer_1 = 760
toggle_switch_10 = 1

[[preset]]
name = "Camera Weave"
rotary_potentiometer_6 = 700
