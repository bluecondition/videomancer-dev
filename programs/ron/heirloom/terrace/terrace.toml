# Terrace - Heirloom #11, v0.5.0 (2026-10-21): rebuilt from the photo WIN_20230305_23_38_39.
# A strict grid of flat blocks, 2.72 tiles of 6 columns x 25 rows: yellow, magenta, cyan, white and
# three greys and black, each column dropped one row, so the colours stair-step down to the right,
# with flyback fringes at the tile seams.  See terrace.vhd and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.terrace"
program_name = "Terrace"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Grid", "Pattern", "Color"]
program_type = "processing"
description = "Colour-bar staircase: CMY, white and greys stepping down 6-column tiles, flyback seam fringes, rows rolling."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 251
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 4
display_max_value = 64
initial_value = 360
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 458
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 710
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Seam"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 386
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Palette"
value_labels = ["Photo", "Primary", "Ember", "Ocean", "Neon", "Pastel", "Inverse", "Mono"]
initial_value_label = "Photo"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Climb"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ramp"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lean"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Fill"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Steps"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Colour Bars"
linear_potentiometer_12 = 0

[[preset]]
name = "Chevrons"
rotary_potentiometer_5 = 1023
rotary_potentiometer_6 = 576

[[preset]]
name = "Cascade"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 700
toggle_switch_9 = 1

[[preset]]
name = "Camera Steps"
toggle_switch_10 = 1
rotary_potentiometer_3 = 700
