# Terrace - Heirloom #11 (2026-10-20), from WIN_20230305_23_38_39.
# Diagonal staircases of coloured cells, the picture mixed into the cells.
# See terrace.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.terrace"
program_name = "Terrace"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Grid", "Pattern", "Pixel"]
program_type = "processing"
description = "A cell grid whose colour sequence drops one cell per column: diagonal staircases in CMYK and grays, the picture mixed in."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Width"
control_mode = "linear"
display_min_value = 16
display_max_value = 271
initial_value = 260
display_float_digits = 0
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Height"
control_mode = "linear"
display_min_value = 8
display_max_value = 263
initial_value = 160
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Palette"
value_labels = ["CMYK", "Warm", "Cool", "Neon"]
initial_value_label = "CMYK"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Scroll"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Panels"
value_labels = ["1", "2", "4"]
initial_value_label = "2"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Swap"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Grid"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Direction"
value_labels = ["Right", "Left"]
initial_value_label = "Right"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tint"
value_labels = ["Colour", "Luma"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Slope"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Flat Bands"
rotary_potentiometer_6 = 600
linear_potentiometer_12 = 0

[[preset]]
name = "Neon Steps"
rotary_potentiometer_3 = 768
rotary_potentiometer_1 = 100
rotary_potentiometer_2 = 100
toggle_switch_8 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Warm Mosaic"
rotary_potentiometer_3 = 256
rotary_potentiometer_6 = 1000
toggle_switch_10 = 1
linear_potentiometer_12 = 300
