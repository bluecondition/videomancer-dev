# Ticker - Heirloom #20 (rebuilt 2026-10-21), from WIN_20230319_01_27_56.
# Camera video through a sample-and-hold mosaic: H-locked half cells, a line hold on two
# free-running clocks with tall held bands, a cyan/white luma window key, soft edges.
# See ticker.vhd and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.ticker"
program_name = "Ticker"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Glitch", "Signal"]
program_type = "processing"
description = "Sample-and-hold mosaic: half cells, rows on two drifting clocks, tall held bars, a cyan key, soft analog edges."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cells"
control_mode = "linear"
display_min_value = 12
display_max_value = 100
initial_value = 346
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 437
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Cyan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Gaps"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Shadow"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Picks"
value_labels = ["Cyan", "Magenta"]
initial_value_label = "Cyan"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Rows"
value_labels = ["Roll", "Lock"]
initial_value_label = "Roll"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Edges"
value_labels = ["Soft", "Hard"]
initial_value_label = "Soft"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Clocks"
value_labels = ["Two", "One"]
initial_value_label = "Two"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Hold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Readout"
toggle_switch_11 = 1

[[preset]]
name = "Meltdown"
toggle_switch_11 = 1
linear_potentiometer_12 = 1000
rotary_potentiometer_4 = 820

[[preset]]
name = "Fine Grain"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 760
linear_potentiometer_12 = 200

[[preset]]
name = "Magenta Hard"
toggle_switch_7 = 1
toggle_switch_9 = 1
rotary_potentiometer_3 = 300
