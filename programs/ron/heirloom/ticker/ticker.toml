# Ticker - Heirloom #20 (2026-10-20), from WIN_20230319_01_27_56.
# Monochrome bars scrambled per row band with cyan dashes: a readout gone wrong.
# See ticker.vhd and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.ticker"
program_name = "Ticker"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Glitch", "Text", "Signal"]
program_type = "processing"
description = "Gray and white bars scrambled sideways per row band with cyan dashes, the picture in quantized grays beneath."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bars"
value_labels = ["16 px", "32 px", "64 px", "128 px"]
initial_value_label = "32 px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 16
display_max_value = 271
initial_value = 200
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Dashes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Levels"
control_mode = "linear"
display_min_value = 2
display_max_value = 64
initial_value = 400
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Reshuffle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Bars"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Dashes"
value_labels = ["Cyan", "White"]
initial_value_label = "Cyan"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Bands"
value_labels = ["Slide", "Static"]
initial_value_label = "Slide"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bars"
value_labels = ["Blocks", "Columns"]
initial_value_label = "Blocks"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Scramble"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Readout"
rotary_potentiometer_6 = 1023
rotary_potentiometer_4 = 300
toggle_switch_10 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Gray Picture"
rotary_potentiometer_6 = 100
rotary_potentiometer_3 = 100
linear_potentiometer_12 = 250

[[preset]]
name = "Negative"
toggle_switch_7 = 1
toggle_switch_9 = 1
rotary_potentiometer_1 = 800
linear_potentiometer_12 = 900
