# Tiger - Heirloom (video phase), built 2026-11-10 (v0.1.0) from the clip WIN_20231208_23_03_08 at 0.5 s.
# Orange / blue / pink tiger bands from a fanned H triangle oscillator, split into a red and a blue wrapping
# colouriser by a slow V sine, folding into pink saddles along a fold row that rolls up the screen.
# v0.1.1 (2026-11-10): smooth camera bend (16 px box + vertical IIR on the luma, Etch default a quarter), Osc 24x.
# See tiger.vhd, tiger.py and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.tiger"
program_name = "Tiger"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Warp", "Color"]
program_type = "processing"
description = "Orange and blue tiger bands fanning across the screen, folding into pink saddles on a fold row that rolls upward."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Folds"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Roll"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 690
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Lean"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 128
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Wave"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Cross"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Tiger", "Jungle"]
initial_value_label = "Tiger"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Split"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 467
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Pink Fan"
linear_potentiometer_12 = 0

[[preset]]
name = "Shattered"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 800

[[preset]]
name = "Chevrons"
toggle_switch_7 = 1
rotary_potentiometer_2 = 700

[[preset]]
name = "Wriggle"
toggle_switch_8 = 1
rotary_potentiometer_3 = 700

[[preset]]
name = "Lattice"
toggle_switch_9 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Jungle"
toggle_switch_10 = 1
rotary_potentiometer_3 = 800

[[preset]]
name = "Steep Lean"
rotary_potentiometer_5 = 1000
rotary_potentiometer_2 = 900
