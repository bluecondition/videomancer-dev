# Tongues - Heirloom (video phase), rebuilt 2026-11-04 (v0.1.0) from the clip WIN_20230127_01_48_55 at 25.5 s.
# Eight columns, a vertical cosine, a window key that opens from left to right: thin green lines, red and yellow
# flame tongues meeting at a bright apex, broad green bands on black.  See tongues.vhd, tongues.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.tongues"
program_name = "Tongues"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Illusion"]
program_type = "processing"
description = "Twin red and yellow flame tongues between green bands: a window key on a vertical cosine, opening across eight columns."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Cycles"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Stairs"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Saw"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 410
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Open"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Columns"
value_labels = ["8", "16"]
initial_value_label = "8"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Key"
value_labels = ["Window", "Fill"]
initial_value_label = "Window"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Fire", "Ice"]
initial_value_label = "Fire"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Blaze"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Night Lines"
rotary_potentiometer_5 = 200
linear_potentiometer_12 = 0

[[preset]]
name = "Ablaze"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 1023

[[preset]]
name = "Filled Ice"
toggle_switch_8 = 1
toggle_switch_10 = 1
rotary_potentiometer_1 = 420

[[preset]]
name = "Sixteen"
toggle_switch_7 = 1
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 820

[[preset]]
name = "Slow Stairs"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 820
rotary_potentiometer_4 = 600
toggle_switch_9 = 1
