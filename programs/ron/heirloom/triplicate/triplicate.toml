# Triplicate - Heirloom #53 (2026-10-21), rebuilt from selfie.jpg (a paper collage).
# The picture cut out as a bear, photocopied in red, green and blue and cascaded over a wall of prints.
# See triplicate.vhd and SUMMARY.md.

[program]
processing_delay_clks = 21
program_id = "com.czartroniks.triplicate"
program_name = "Triplicate"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mask", "Color", "Craft"]
program_type = "processing"
description = "Collage: the picture cut out as a bear, photocopied in red, green and blue, cascading over a wall of prints."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Recede"
control_mode = "linear"
display_min_value = 0
display_max_value = 150
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Size"
control_mode = "linear"
display_min_value = 60
display_max_value = 130
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Ink"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 467
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Wall"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Order"
value_labels = ["RGB", "BGR"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Inks"
value_labels = ["RGB", "CMY"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Front"
value_labels = ["Colour", "Ink"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Cascade"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Selfie"

[[preset]]
name = "Nested Dolls"
linear_potentiometer_12 = 0
rotary_potentiometer_1 = 700

[[preset]]
name = "Fanned"
linear_potentiometer_12 = 1023
rotary_potentiometer_2 = 400

[[preset]]
name = "CMYK Plates"
toggle_switch_8 = 1
toggle_switch_9 = 1
rotary_potentiometer_3 = 640

[[preset]]
name = "Silhouettes"
rotary_potentiometer_3 = 1023
rotary_potentiometer_5 = 300
toggle_switch_10 = 1
