# Triplicate - Heirloom #53 (2026-10-20), from selfie.jpg (paper collage).
# Three tinted copies of the keyed picture cascade over a gray tiled wall.
# See triplicate.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.triplicate"
program_name = "Triplicate"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Mask", "Color", "Craft"]
program_type = "processing"
description = "A collage cascade: the keyed picture in front of three red, green and blue copies over a gray tiled wall of itself."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Key"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Tiles"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 576
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Tint"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1000
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Wall"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Detail"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Wobble"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Order"
value_labels = ["RGB", "BGR"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Backdrop"
value_labels = ["Tiled", "Plain"]
initial_value_label = "Tiled"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tints"
value_labels = ["RGB", "CMY"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Key"
value_labels = ["Bright", "Dark"]
initial_value_label = "Bright"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spread"
control_mode = "linear"
display_min_value = 1
display_max_value = 32
initial_value = 500
display_float_digits = 0
suffix_label = "px"

[[preset]]
name = "Default"

[[preset]]
name = "Wide Cascade"
rotary_potentiometer_5 = 1000
linear_potentiometer_12 = 1023

[[preset]]
name = "CMY Ghosts"
rotary_potentiometer_3 = 700
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Plain Wall"
rotary_potentiometer_4 = 900
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 300
