# Tunnel - Heirloom (video phase) v0.1.0, from the clip WIN_20230723_00_52_24 at 0.5 s.
# Black and white diamond glow rings streaming out of an eye, over a weave of stripes and chevron bars, with fans of
# rays at the eye corners.  See tunnel.vhd, tunnel.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.tunnel"
program_name = "Tunnel"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Illusion"]
program_type = "processing"
description = "Black and white diamond glow rings streaming out of an eye over a weave of stripes and chevron bars."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Slope"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Skew"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Weave"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Eye"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Rings"
value_labels = ["Glow", "Line"]
initial_value_label = "Glow"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Weave"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ink"
value_labels = ["Light", "Dark"]
initial_value_label = "Light"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Still"

[[preset]]
name = "Deep Tunnel"
rotary_potentiometer_4 = 820
linear_potentiometer_12 = 900

[[preset]]
name = "Twin Eyes"
toggle_switch_7 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Line Work"
toggle_switch_8 = 1
linear_potentiometer_12 = 640

[[preset]]
name = "Negative"
toggle_switch_10 = 1
rotary_potentiometer_2 = 300

[[preset]]
name = "Bare Rings"
toggle_switch_9 = 1
rotary_potentiometer_4 = 760

[[preset]]
name = "Wide Eye"
rotary_potentiometer_1 = 330
rotary_potentiometer_5 = 1000

[[preset]]
name = "Osc Melt"
toggle_switch_11 = 1
rotary_potentiometer_6 = 420
