# Undulate - Heirloom (video phase), from the clip WIN_20230301_23_17_23 at 0.5 s: a rainbow sine ripple field.
# Green sine ripples bent into S-curves and saddles over a blue diagonal fold, red flecks crawling up the ripple
# flanks.  See undulate.vhd, undulate.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.undulate"
program_name = "Undulate"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Illusion"]
program_type = "processing"
description = "Green sine ripples bent into S-curves over a blue diagonal fold, red flecks crawling up their flanks."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Ripples"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blue"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Flecks"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 320
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Flip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Neon", "Ember"]
initial_value_label = "Neon"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Wobble"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wave"
value_labels = ["Sine", "Square"]
initial_value_label = "Sine"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Undulate"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 465
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Flat Stripes"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 700

[[preset]]
name = "Overdrive"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 600

[[preset]]
name = "Ember"
toggle_switch_8 = 1
rotary_potentiometer_5 = 300

[[preset]]
name = "Deep Bands"
rotary_potentiometer_2 = 900
toggle_switch_9 = 1

[[preset]]
name = "Red Flood"
rotary_potentiometer_5 = 1023
rotary_potentiometer_3 = 300

[[preset]]
name = "Square Flip"
toggle_switch_10 = 1
toggle_switch_7 = 1
rotary_potentiometer_4 = 320

[[preset]]
name = "Hairlines"
rotary_potentiometer_1 = 1023
rotary_potentiometer_3 = 800
linear_potentiometer_12 = 600
