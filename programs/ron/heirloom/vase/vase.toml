# Vase - Heirloom #27 (2026-10-20), from WIN_20230424_23_59_47.
# A tall silhouette on black filled with shaded rainbow stripes or the squeezed picture.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.vase"
program_name = "Vase"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Mask", "Render"]
program_type = "processing"
description = "A tall vase silhouette on black, filled with glossy rainbow stripes or the picture squeezed into it. Waist on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 1
display_max_value = 64
initial_value = 300
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shading"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Period"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 160
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 540
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fill"
value_labels = ["Stripes", "Picture"]
initial_value_label = "Stripes"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Shading"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Vases"
value_labels = ["One", "Two"]
initial_value_label = "One"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Rainbow", "Warm"]
initial_value_label = "Rainbow"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Waist"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Two Figures"
toggle_switch_9 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Squeezed Face"
toggle_switch_7 = 1
rotary_potentiometer_2 = 400
linear_potentiometer_12 = 500

[[preset]]
name = "Warm Column"
toggle_switch_10 = 1
rotary_potentiometer_1 = 800
linear_potentiometer_12 = 80
