# Vesica - Heirloom #13 (2026-10-20), from WIN_20230307_01_04_17.
# Pastel diamond lattice on pale green, an orange ringed vesica eye with crescents.
# See vesica.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.vesica"
program_name = "Vesica"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Mask"]
program_type = "processing"
description = "An orange vesica eye of nested rings with crescents above and below, on a pastel diamond lattice; the video etches the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Aspect"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Lattice"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Eye"
value_labels = ["Rings", "Solid"]
initial_value_label = "Rings"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Crescents"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tint"
value_labels = ["Pastel", "Video"]
initial_value_label = "Pastel"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Eye"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Wide Open"
rotary_potentiometer_4 = 200
linear_potentiometer_12 = 1023

[[preset]]
name = "Slit"
rotary_potentiometer_4 = 1000
rotary_potentiometer_3 = 900
linear_potentiometer_12 = 100

[[preset]]
name = "Osc Lattice"
toggle_switch_10 = 1
toggle_switch_11 = 1
rotary_potentiometer_6 = 700
