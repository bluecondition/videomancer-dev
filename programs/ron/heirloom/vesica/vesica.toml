# Vesica - Heirloom #13, v0.6.0 (2026-11-09, phase-2 diag): rebuilt from the photo WIN_20230307_01_04_17.
# An orange vesica eye, flame-torn on its right edge, with crescents above and below, a brown plate
# joining its side copies, on a pastel X lattice.  Phase 2: wider element ranges (lattice axes,
# bands, stripes, crescent width + distance), copies crowding at a low Eye, the camera pushing the
# eye above the default Etch.  See vesica.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.vesica"
program_name = "Vesica"
program_version = "0.6.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Glitch"]
program_type = "processing"
description = "Orange vesica eye, flame-torn, with crescents on a pastel X lattice; knobs reshape each element, the camera bends it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Lattice"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Crescents"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tear"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Twins"
value_labels = ["Clear", "Filled"]
initial_value_label = "Clear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Texture"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Pastel", "Azure"]
initial_value_label = "Pastel"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Eye"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Row of Slits"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 700

[[preset]]
name = "Wide Eye"
linear_potentiometer_12 = 1023
rotary_potentiometer_5 = 720

[[preset]]
name = "Hairlines"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 150

[[preset]]
name = "Fat Bands"
rotary_potentiometer_1 = 120
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 900

[[preset]]
name = "Embrace"
rotary_potentiometer_4 = 1023
linear_potentiometer_12 = 620

[[preset]]
name = "Camera Eye"
rotary_potentiometer_6 = 1023
rotary_potentiometer_5 = 600

[[preset]]
name = "Azure Storm"
toggle_switch_10 = 1
rotary_potentiometer_5 = 1000
rotary_potentiometer_6 = 800
