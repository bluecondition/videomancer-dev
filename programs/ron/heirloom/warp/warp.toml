# Warp - Heirloom #48 (2026-10-20), from WIN_20230909_23_29_18.
# A stripe field bent into arcs by an r^2 term and sheared in blocks.
# See warp.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.warp"
program_name = "Warp"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Warp", "Pattern", "Glitch"]
program_type = "processing"
description = "Orange, green and violet stripes bent into arcs about the centre and sheared sideways in blocks, the picture rippling them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Block"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Shear"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shear"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Palette"
value_labels = ["Trio", "Rainbow"]
initial_value_label = "Trio"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Arcs"
value_labels = ["Convex", "Concave"]
initial_value_label = "Convex"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Curve"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Straight"
toggle_switch_7 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Tight Rings"
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Concave Fan"
toggle_switch_9 = 1
rotary_potentiometer_4 = 700
linear_potentiometer_12 = 600
