# Warp - Heirloom #48, v0.5.0 (2026-10-27): rebuilt from the photo WIN_20230909_23_29_18.
# Orange / lavender / green stripes on a plane receding to a horizon seam, warped by a fitted phase map
# (top-left checker, moire lenses, a band of hooks and loops), a green haze and a black/green margin.
# See warp.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.warp"
program_name = "Warp"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Warp", "Pattern", "Glitch"]
program_type = "processing"
description = "Orange, lavender and green perspective stripes warped into checkers, moire and loops about a horizon seam."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Stripes"
control_mode = "linear"
display_min_value = 50
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Horizon"
control_mode = "linear"
display_min_value = -256
display_max_value = 256
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Flow"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Haze"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Palette"
value_labels = ["Warp", "Ember", "Ice", "Toxic", "Candy", "Mono", "Neon", "Rust"]
initial_value_label = "Warp"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Seam"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Margin"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Zigzag"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Warp"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Clean Plane"
linear_potentiometer_12 = 0

[[preset]]
name = "Deep Warp"
linear_potentiometer_12 = 1023
rotary_potentiometer_3 = 760

[[preset]]
name = "Mirror Ice"
toggle_switch_9 = 1
rotary_potentiometer_6 = 2
rotary_potentiometer_1 = 700
