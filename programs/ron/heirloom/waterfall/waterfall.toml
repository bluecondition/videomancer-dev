# Waterfall - Heirloom #45 (2026-10-20), from WIN_20230610_00_51.
# A curtain of thin lines bending into an orange stripe fan over pastel blocks.
# See waterfall.vhd and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.waterfall"
program_name = "Waterfall"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Grid", "Pattern"]
program_type = "processing"
description = "A curtain of thin green lines bending below a fold into an orange stripe fan, over pastel blocks. Bend on the slider."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Lines"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 150
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Blocks"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 0
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Curtain"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ground"
value_labels = ["Blocks", "Source"]
initial_value_label = "Blocks"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Fan"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Palette"
value_labels = ["Pastel", "Vivid"]
initial_value_label = "Pastel"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fall"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Picture Blocks"
toggle_switch_8 = 1
rotary_potentiometer_3 = 200

[[preset]]
name = "Vivid Sweep"
toggle_switch_10 = 1
linear_potentiometer_12 = 1000

[[preset]]
name = "Straight Rain"
linear_potentiometer_12 = 0
toggle_switch_9 = 0
rotary_potentiometer_1 = 800
