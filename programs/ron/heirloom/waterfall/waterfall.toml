# Waterfall - Heirloom #45 (rebuilt 2026-10-27), from WIN_20230610_00_51_13.
# One line-locked chirped oscillator into a banded colourizer: a curtain of fine lines that fans
# out and sweeps hard left at the bottom, over rainbow / cyan / lavender / orange bands.
# See waterfall.vhd and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.waterfall"
program_name = "Waterfall"
program_version = "0.5.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Pattern", "Organic"]
program_type = "processing"
description = "A curtain of fine chirped lines through rainbow, cyan, lavender and orange bands, sweeping left at the foot. Fall on P12."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Strings"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Fade"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Seam"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Melt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Beads"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Wind"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Dusk"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Lines"
value_labels = ["Sharp", "Soft"]
initial_value_label = "Sharp"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fall"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Default"

[[preset]]
name = "Hanging"
linear_potentiometer_12 = 0

[[preset]]
name = "Whipped"
rotary_potentiometer_4 = 820
linear_potentiometer_12 = 1023

[[preset]]
name = "Dusk"
toggle_switch_9 = 1
rotary_potentiometer_3 = 800

[[preset]]
name = "Dense Rain"
rotary_potentiometer_1 = 900
rotary_potentiometer_5 = 900
