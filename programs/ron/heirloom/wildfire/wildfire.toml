# Wildfire - Heirloom (phase 3, video clips), built 2026-11-04 (v0.1.0) from clip WIN_20230509_23_58_21 at 0.5 s.
# v0.1.1 (2026-11-09): big top-left black blob, hot-pink / red lower third with navy patches, bolder S8 Deep.
# Black flame pits on gold: an egg column with olive eyes, a fan of fins with a zig-zag edge, green and orange
# fringes, a fine lace and a blue key in the lower third, flowing down.  See wildfire.vhd, wildfire.py, SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.wildfire"
program_name = "Wildfire"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Organic"]
program_type = "processing"
description = "Black flame pits on gold: an egg column, a fan of fins, green and orange fringes, a blue lace below, flowing down."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Eggs"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Fringe"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 341
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lace"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Black"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Etch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 160
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fold"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Zigzag"
value_labels = ["Fine", "Deep"]
initial_value_label = "Fine"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Palette"
value_labels = ["Wildfire", "Ember"]
initial_value_label = "Wildfire"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Flames"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Photo"

[[preset]]
name = "Bonfire"
linear_potentiometer_12 = 120
rotary_potentiometer_2 = 600

[[preset]]
name = "Inferno"
linear_potentiometer_12 = 900
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 820

[[preset]]
name = "Ember Fan"
toggle_switch_9 = 1
rotary_potentiometer_1 = 300

[[preset]]
name = "Ringed Eggs"
toggle_switch_7 = 1
rotary_potentiometer_1 = 760

[[preset]]
name = "Sawtooth"
toggle_switch_8 = 1
rotary_potentiometer_5 = 640

[[preset]]
name = "Gold Pits"
toggle_switch_10 = 1
rotary_potentiometer_2 = 700

[[preset]]
name = "Blue Lake"
