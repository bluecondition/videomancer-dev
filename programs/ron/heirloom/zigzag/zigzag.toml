# Zigzag - Heirloom (phase 3, from the clip WIN_20230205_00_16_05 at 0.5 s), v0.1.0, 2026-11-04.
# Green ground, red rounded-top zigzag bands and pale blue ribbons with a texture keyed into them: one horizontal
# oscillator plus a vertical ramp into three colour shapers (R bumps, G wave, B window delayed 36 px).
# See zigzag.vhd, zigzag.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.zigzag"
program_name = "Zigzag"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Color", "Shape"]
program_type = "processing"
description = "Rainbow zigzag ribbons on green: a folded oscillator and a ramp into three colour shapers, the camera smoked into the ribbons."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Zigzags"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 520
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Ribbon"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lines"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 612
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Smoke"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 285
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Palette"
value_labels = ["Still", "GBR", "BRG", "RBG", "GRB", "BGR", "Negative", "Neg GBR"]
initial_value_label = "Still"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fold"
value_labels = ["Zigzag", "Slant"]
initial_value_label = "Zigzag"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ground"
value_labels = ["Green", "Black"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tone"
value_labels = ["Neon", "Pastel"]
initial_value_label = "Neon"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 424
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Clip"

[[preset]]
name = "Diamonds"
toggle_switch_8 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Pastel Slant"
toggle_switch_7 = 1
toggle_switch_10 = 1
rotary_potentiometer_1 = 420
linear_potentiometer_12 = 300

[[preset]]
name = "Neon Night"
toggle_switch_9 = 1
rotary_potentiometer_3 = 700
rotary_potentiometer_6 = 192

[[preset]]
name = "Blue Flood"
rotary_potentiometer_2 = 150
rotary_potentiometer_5 = 500
linear_potentiometer_12 = 480

[[preset]]
name = "Nested"
linear_potentiometer_12 = 1023
rotary_potentiometer_4 = 760

[[preset]]
name = "Shredded"
rotary_potentiometer_5 = 900
rotary_potentiometer_1 = 700
toggle_switch_11 = 1
