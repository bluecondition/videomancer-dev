[program]
processing_delay_clks = 8
program_id = "com.czartroniks.helios"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Helios"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Shape", "Mask"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "The Sun as a turning, boiling globe: sunspots, a heat-ramp surface and a corona. Activity makes it flare."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 277
display_min_value = 0
display_max_value = 100
name_label = "Size"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "X Position"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Y Position"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Boil"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 360
name_label = "Turn"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 570
display_min_value = -100
display_max_value = 100
name_label = "Spin"
suffix_label = ""

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Sky"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Look"
value_labels = ["White Light", "Fire"]
initial_value_label = "Fire"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Surface"
value_labels = ["Sun", "Video"]
initial_value_label = "Sun"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Limb"
value_labels = ["Dark", "Flat"]
initial_value_label = "Dark"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Corona"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Activity"
suffix_label = "%"

# --- Presets ---
# (Activity is the performance gesture: calm and dim at the bottom, flaring
#  white-hot with a wide corona at the top.  Spin is bipolar with a still
#  centre.  Hand-typed placeholders until captured from the hardware with
#  capture_preset.sh.)

[[preset]]
name = "Boiling Sun"
rotary_potentiometer_1 = 277
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 570
toggle_switch_7 = 0
toggle_switch_8 = 1
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 400

