[program]
program_id = "com.ron.inferno"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Inferno"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Screen"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Semi-realistic procedural flame effect with noise-based fire, overlay mode, and multiple flame styles."

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fuel"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Heat"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Turblnce"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tint"
control_mode = "linear"
display_min_value = -50
display_max_value = 50
initial_value = 512
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Rise"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Ember"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Inferno"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Blue Flame"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Overlay"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Intensity"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 900
suffix_label = "%"
