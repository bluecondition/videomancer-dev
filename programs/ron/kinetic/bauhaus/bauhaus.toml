# Bauhaus - Kinetic, 2026-11-14.
# A grid of shape tiles that re-roll in travelling waves: shrink, swap, grow.
# See bauhaus.vhd, bauhaus.py and SUMMARY.md.

[program]
processing_delay_clks = 42
program_id = "com.czartroniks.bauhaus"
program_name = "Bauhaus"
program_version = "0.1.3"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Grid"]
program_type = "processing"
description = "Bauhaus shape tiles: discs, arcs, bars and triangles in a grid, re-rolled by travelling waves."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 598
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 360
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 160
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Gutters"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Layout"
value_labels = ["Random", "Mirrored"]
initial_value_label = "Random"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shuffle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 323
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Poster"

[[preset]]
name = "Mirror Quilt"
rotary_potentiometer_1 = 520
rotary_potentiometer_3 = 200
rotary_potentiometer_5 = 224
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Flip Board"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 720
rotary_potentiometer_5 = 32
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Slot Machine"
rotary_potentiometer_1 = 700
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 288
linear_potentiometer_12 = 1023

[[preset]]
name = "Shape Halftone"
rotary_potentiometer_1 = 250
rotary_potentiometer_3 = 0
rotary_potentiometer_5 = 32
linear_potentiometer_12 = 120

[[preset]]
name = "Diamond Drift"
rotary_potentiometer_1 = 380
rotary_potentiometer_2 = 200
