# Braid - Kinetic (v0.1.0, 2026-11-22).  Vertical three-strand plaits of round, lit cord with true over-and-under;
# a travelling wave slides the plaits against each other (or swells them), the picture's luma swells each plait.
# See braid.vhd, braid.py and SUMMARY.md.

[program]
processing_delay_clks = 40
program_id = "com.czartroniks.braid"
program_name = "Braid"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Material", "Pattern", "Render"]
program_type = "processing"
description = "Three-strand plaits of lit cord, over and under; a travelling wave slides them; video swells the rope."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 665
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 563
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 740
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
value_labels = ["Ink", "Paper", "Bauhaus", "Vega", "Outrun", "Ultra", "Ocean", "Ice", "Moss", "Citrus", "Terra", "Ember", "Gold", "Candy", "Mint", "Plum"]
initial_value_label = "Terra"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Slip", "Swell"]
initial_value_label = "Slip"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Strands"
value_labels = ["Three", "Two"]
initial_value_label = "Three"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Lay"
value_labels = ["Parallel", "Mirrored"]
initial_value_label = "Parallel"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Plait"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Rope Walk"

[[preset]]
name = "Cable Knit"
rotary_potentiometer_1 = 380
rotary_potentiometer_2 = 820
rotary_potentiometer_5 = 160
toggle_switch_10 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Hawser"
rotary_potentiometer_1 = 1023
rotary_potentiometer_2 = 900
rotary_potentiometer_4 = 660
rotary_potentiometer_5 = 736
toggle_switch_9 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Lanyards"
rotary_potentiometer_1 = 120
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 750
rotary_potentiometer_4 = 820
rotary_potentiometer_5 = 224
toggle_switch_8 = 1
linear_potentiometer_12 = 420

[[preset]]
name = "Breathing"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 288
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Woven"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 600
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 608
linear_potentiometer_12 = 1023
