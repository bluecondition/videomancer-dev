# Cogwork - Kinetic, 2026-11-14.
# A wall of meshed cogs turning as one train; a travelling wave swings their spoked wheels and swells their hubs.
# See cogwork.vhd, cogwork.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.cogwork"
program_name = "Cogwork"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Shape"]
program_type = "processing"
description = "A wall of meshed cogs turning as one train; a wave swings the spokes and swells the hubs."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 598
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Teeth"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 448
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 160
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Body"
value_labels = ["Spoked", "Disc"]
initial_value_label = "Spoked"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ink"
value_labels = ["Fill", "Line"]
initial_value_label = "Fill"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Drive"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Gear Wall"

[[preset]]
name = "Blueprint"
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 704
rotary_potentiometer_5 = 96
toggle_switch_10 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Sprockets"
rotary_potentiometer_1 = 680
rotary_potentiometer_2 = 64
rotary_potentiometer_3 = 760
rotary_potentiometer_5 = 608
toggle_switch_9 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Watch Movement"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 960
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 800
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Strobe"
rotary_potentiometer_1 = 820
rotary_potentiometer_2 = 576
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 288
linear_potentiometer_12 = 1010

[[preset]]
name = "Halftone Hubs"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 448
rotary_potentiometer_3 = 200
rotary_potentiometer_5 = 32
toggle_switch_9 = 1
linear_potentiometer_12 = 250
