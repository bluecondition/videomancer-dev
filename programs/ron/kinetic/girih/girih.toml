# Girih - Kinetic, 2026-11-14.
# Islamic star patterns by Hankin's polygons-in-contact method; each tile's contact angle rides a travelling wave.
# See girih.vhd, girih.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.girih"
program_name = "Girih"
program_version = "0.1.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Shape"]
program_type = "processing"
description = "Islamic star patterns: each tile's contact angle rides a wave, opening thin stars into fat rosettes."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 480
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 160
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lattice"
value_labels = ["Square", "Octagon"]
initial_value_label = "Octagon"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Look"
value_labels = ["Lines", "Filled"]
initial_value_label = "Filled"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 256
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Eight Stars"

[[preset]]
name = "Lattice Lines"
rotary_potentiometer_1 = 700
rotary_potentiometer_2 = 140
rotary_potentiometer_3 = 420
rotary_potentiometer_5 = 32
toggle_switch_9 = 0
toggle_switch_10 = 0
linear_potentiometer_12 = 300

[[preset]]
name = "Ripple Rosette"
rotary_potentiometer_1 = 620
rotary_potentiometer_3 = 600
rotary_potentiometer_5 = 288
toggle_switch_8 = 1
linear_potentiometer_12 = 420

[[preset]]
name = "Snap Tiles"
rotary_potentiometer_1 = 820
rotary_potentiometer_2 = 520
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 720
