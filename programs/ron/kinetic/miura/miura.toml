# Miura - Kinetic wave 2, 2026-11-22.
# A Miura-ori sheet folding in a travelling wave: rows close and open, their zigzag creases lean harder as they shut.
# See miura.vhd, miura.py and SUMMARY.md.

[program]
processing_delay_clks = 25
program_id = "com.czartroniks.miura"
program_name = "Miura"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Render", "Illusion"]
program_type = "processing"
description = "A Miura-ori paper sheet folding in a travelling wave: rows close and open, the zigzag creases lean as they shut."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 470
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 820
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 672
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Creases"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Light"
value_labels = ["Side", "Top"]
initial_value_label = "Side"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 460
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Folding Sheet"

[[preset]]
name = "Accordion"
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 32
toggle_switch_10 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Herringbone"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 1023
rotary_potentiometer_5 = 800
linear_potentiometer_12 = 900

[[preset]]
name = "Ripple Map"
rotary_potentiometer_3 = 1023
rotary_potentiometer_4 = 740
rotary_potentiometer_5 = 928
toggle_switch_8 = 1
linear_potentiometer_12 = 150

[[preset]]
name = "Snap Fold"
rotary_potentiometer_4 = 820
rotary_potentiometer_5 = 480
toggle_switch_7 = 1
toggle_switch_9 = 0

[[preset]]
name = "Paper Portrait"
rotary_potentiometer_1 = 280
rotary_potentiometer_3 = 500
rotary_potentiometer_5 = 32
toggle_switch_9 = 0
linear_potentiometer_12 = 560
