# Outrun - Kinetic (v0.1.0, 2026-11-14).  The neon perspective grid: a glowing grid floor running to a horizon,
# a banded sun, optionally a mirrored ceiling; a travelling wave rolls hills through the grid.
# See outrun.vhd, outrun.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.outrun"
program_name = "Outrun"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Grid", "Demo", "Render"]
program_type = "processing"
description = "Neon perspective grid, horizon glow and banded sun; a travelling wave rolls hills through the floor."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 341
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Horizon"
control_mode = "linear"
display_min_value = 25
display_max_value = 75
initial_value = 626
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 740
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 591
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Colour"
value_labels = ["Ink", "Paper", "Bauhaus", "Vega", "Outrun", "Ultra", "Ocean", "Ice", "Moss", "Citrus", "Terra", "Ember", "Gold", "Candy", "Mint", "Plum"]
initial_value_label = "Outrun"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Step"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Space"
value_labels = ["Sky", "Tunnel"]
initial_value_label = "Sky"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Sun"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Terrain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 590
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Sunset Drive"

[[preset]]
name = "Flatland"
rotary_potentiometer_1 = 400
rotary_potentiometer_2 = 341
rotary_potentiometer_4 = 820
rotary_potentiometer_6 = 288
linear_potentiometer_12 = 0

[[preset]]
name = "Tunnel"
rotary_potentiometer_1 = 600
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 450
rotary_potentiometer_6 = 352
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Ripple Pool"
rotary_potentiometer_1 = 450
rotary_potentiometer_2 = 341
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 640
rotary_potentiometer_6 = 416
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Terraces"
rotary_potentiometer_1 = 620
rotary_potentiometer_2 = 600
rotary_potentiometer_5 = 420
rotary_potentiometer_6 = 736
toggle_switch_7 = 1
linear_potentiometer_12 = 760

[[preset]]
name = "Ranges"
rotary_potentiometer_1 = 560
rotary_potentiometer_2 = 500
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 660
rotary_potentiometer_5 = 520
rotary_potentiometer_6 = 224
linear_potentiometer_12 = 1023
