# Pendula - Kinetic, 2026-11-14.
# A lattice of dots, each riding its own small orbit, phased by a travelling wave (pendulum-wave machines,
# the Tusi couple, water-wave particle orbits).  See pendula.vhd, pendula.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.pendula"
program_name = "Pendula"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Shape"]
program_type = "processing"
description = "A lattice of dots, each on its own small orbit; Phase sweeps unison into travelling waves and rolling rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 128
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 730
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Size"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 160
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lattice"
value_labels = ["Square", "Hex"]
initial_value_label = "Square"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Axis"
value_labels = ["Same", "Fan"]
initial_value_label = "Same"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Phase"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 458
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Compression"

[[preset]]
name = "Pendulum Wave"
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 850
rotary_potentiometer_5 = 420
rotary_potentiometer_6 = 32
linear_potentiometer_12 = 300

[[preset]]
name = "Tusi Rings"
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 800
rotary_potentiometer_6 = 224
toggle_switch_10 = 1
linear_potentiometer_12 = 512

[[preset]]
name = "Water Orbits"
rotary_potentiometer_1 = 520
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 760
rotary_potentiometer_6 = 416
toggle_switch_9 = 1
linear_potentiometer_12 = 380

[[preset]]
name = "Ripple Tank"
rotary_potentiometer_1 = 480
rotary_potentiometer_2 = 512
rotary_potentiometer_4 = 720
rotary_potentiometer_6 = 480
toggle_switch_8 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Flip Dots"
rotary_potentiometer_1 = 560
rotary_potentiometer_3 = 900
rotary_potentiometer_6 = 800
toggle_switch_7 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Halftone"
rotary_potentiometer_1 = 300
rotary_potentiometer_3 = 500
rotary_potentiometer_5 = 100
rotary_potentiometer_6 = 96
toggle_switch_9 = 1
linear_potentiometer_12 = 250
