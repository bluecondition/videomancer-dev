# Pinwheel - Kinetic, 2026-11-14.
# A field of rotors, one per cell: alternately coloured blades turning in a travelling wave; Twist winds the
# straight fans into spirals.  See pinwheel.vhd, pinwheel.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.pinwheel"
program_name = "Pinwheel"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Shape"]
program_type = "processing"
description = "A field of pinwheels turning in a travelling wave; Twist winds the straight fans into spirals."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 618
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 320
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 457
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 409
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 608
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Hand"
value_labels = ["Alternate", "Same"]
initial_value_label = "Alternate"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Tile"
value_labels = ["Disc", "Square"]
initial_value_label = "Disc"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Twist"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 380
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Pinwheels"

[[preset]]
name = "Quilt"
rotary_potentiometer_1 = 560
rotary_potentiometer_3 = 300
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 672
toggle_switch_10 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Op Fans"
rotary_potentiometer_1 = 800
rotary_potentiometer_2 = 1000
rotary_potentiometer_3 = 450
rotary_potentiometer_6 = 32
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Whirlpools"
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 200
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 720
rotary_potentiometer_6 = 416
linear_potentiometer_12 = 1023

[[preset]]
name = "Flip Dots"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 64
rotary_potentiometer_3 = 520
rotary_potentiometer_5 = 600
rotary_potentiometer_6 = 224
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Spiral Field"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 800
rotary_potentiometer_5 = 250
rotary_potentiometer_6 = 288
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 720
