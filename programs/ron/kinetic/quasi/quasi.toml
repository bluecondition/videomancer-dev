# Quasi - Kinetic (v0.1.0, 2026-11-14).  Quasicrystal interference: the contour bands of a sum of up to eight
# plane waves at the angles j * pi / N; the waves' phase offsets breathe (phason motion), so the tiles flip and
# rearrange in place.  See quasi.vhd, quasi.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.quasi"
program_name = "Quasi"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Grid"]
program_type = "processing"
description = "Quasicrystal interference: 3 to 8 plane waves as contour bands. Tiles flip in place; video bends them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 220
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 740
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
value_labels = ["Ink", "Paper", "Bauhaus", "Vega", "Outrun", "Ultra", "Ocean", "Ice", "Moss", "Citrus", "Terra", "Ember", "Gold", "Candy", "Mint", "Plum"]
initial_value_label = "Ink"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Angular"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Phason", "Drift"]
initial_value_label = "Phason"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Look"
value_labels = ["Fill", "Lines"]
initial_value_label = "Fill"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Spin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Symmetry"
control_mode = "linear"
display_min_value = 3
display_max_value = 8
initial_value = 410
display_float_digits = 1
suffix_label = ""

