# Riley - Kinetic pilot (v0.1.0, 2026-11-14).  After Bridget Riley's wave paintings: parallel bands of even
# weight displaced by a shared, chirped wave; the picture's luma sets the band weight (an engraving).
# See riley.vhd, riley.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.riley"
program_name = "Riley"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Pattern", "Print"]
program_type = "processing"
description = "Op-art bands riding a chirped travelling wave; video sets the line weight. Fold them over into moire."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 415
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Colour"
value_labels = ["Ink", "Paper", "Bauhaus", "Vega", "Outrun", "Ultra", "Ocean", "Ice", "Moss", "Citrus", "Terra", "Ember", "Gold", "Candy", "Mint", "Plum"]
initial_value_label = "Ink"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Weight"
control_mode = "linear"
display_min_value = 10
display_max_value = 90
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 740
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 330
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Zigzag"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bands"
value_labels = ["Duo", "Quad"]
initial_value_label = "Duo"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Axis"
value_labels = ["Across", "Down"]
initial_value_label = "Across"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Current"

[[preset]]
name = "Fall"
rotary_potentiometer_1 = 330
rotary_potentiometer_3 = 512
rotary_potentiometer_5 = 0
rotary_potentiometer_2 = 96
toggle_switch_10 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Cataract"
rotary_potentiometer_1 = 520
rotary_potentiometer_3 = 620
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 420
rotary_potentiometer_2 = 160
toggle_switch_9 = 1
linear_potentiometer_12 = 430

[[preset]]
name = "Chevrons"
rotary_potentiometer_1 = 600
rotary_potentiometer_3 = 512
rotary_potentiometer_5 = 250
rotary_potentiometer_2 = 224
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 500

[[preset]]
name = "Pond"
rotary_potentiometer_1 = 450
rotary_potentiometer_4 = 300
rotary_potentiometer_5 = 200
rotary_potentiometer_2 = 416
toggle_switch_8 = 1
linear_potentiometer_12 = 420

[[preset]]
name = "Moire"
rotary_potentiometer_1 = 500
rotary_potentiometer_4 = 620
rotary_potentiometer_5 = 400
rotary_potentiometer_2 = 800
linear_potentiometer_12 = 1023
