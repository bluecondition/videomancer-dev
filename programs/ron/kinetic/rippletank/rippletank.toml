# Rippletank - Kinetic (v0.1.0, 2026-11-14).  A ripple tank of two to four wave sources (quadratic ponds):
# ring systems that interfere, steered like a phased array.  See rippletank.vhd, rippletank.py and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.rippletank"
program_name = "Rippletank"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Pattern", "Optics"]
program_type = "processing"
description = "Ripple tank: 2-4 wave sources whose rings interfere, steered like a phased array. Slider sets the wavelength."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Spacing"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sources"
value_labels = ["2", "3", "4"]
initial_value_label = "2"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Colour"
value_labels = ["Ink", "Paper", "Bauhaus", "Vega", "Outrun", "Ultra", "Ocean", "Ice", "Moss", "Citrus", "Terra", "Ember", "Gold", "Candy", "Mint", "Plum"]
initial_value_label = "Ink"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 740
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 720
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Hard"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Line", "Ring"]
initial_value_label = "Line"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Mode"
value_labels = ["Sum", "Max"]
initial_value_label = "Sum"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Look"
value_labels = ["Fill", "Lines"]
initial_value_label = "Fill"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wavelength"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Two Slits"

[[preset]]
name = "Rain"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 1023
rotary_potentiometer_4 = 800
rotary_potentiometer_3 = 416
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 330

[[preset]]
name = "Array"
rotary_potentiometer_1 = 700
rotary_potentiometer_2 = 1023
rotary_potentiometer_5 = 600
rotary_potentiometer_3 = 224
toggle_switch_7 = 1
linear_potentiometer_12 = 520

[[preset]]
name = "Lattice"
rotary_potentiometer_1 = 950
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 288
toggle_switch_8 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Contours"
rotary_potentiometer_1 = 800
rotary_potentiometer_2 = 512
rotary_potentiometer_3 = 800
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 450

[[preset]]
name = "Moire"
rotary_potentiometer_1 = 1023
rotary_potentiometer_2 = 1023
rotary_potentiometer_4 = 620
rotary_potentiometer_3 = 64
toggle_switch_8 = 1
linear_potentiometer_12 = 1023
