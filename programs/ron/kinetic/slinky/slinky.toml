# Slinky - Kinetic, 2026-11-14.
# One outline shape followed by a train of graded copies along a swinging path: an extruded, coiling tube.
# See slinky.vhd, slinky.py and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.slinky"
program_name = "Slinky"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Shape"]
program_type = "processing"
description = "A shape trailed by graded copies along a swinging path: an echo tube that coils like a Slinky."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 620
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 288
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Swing", "Orbit"]
initial_value_label = "Swing"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Form"
value_labels = ["Ring", "Square"]
initial_value_label = "Ring"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Body"
value_labels = ["Solid", "Wire"]
initial_value_label = "Solid"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Extrude"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 870
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Slinky"

[[preset]]
name = "Coil"
rotary_potentiometer_1 = 500
rotary_potentiometer_5 = 800
rotary_potentiometer_2 = 224
toggle_switch_8 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Wire Tunnel"
rotary_potentiometer_1 = 700
rotary_potentiometer_3 = 420
rotary_potentiometer_5 = 250
rotary_potentiometer_2 = 352
toggle_switch_10 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Hop Squares"
rotary_potentiometer_1 = 520
rotary_potentiometer_4 = 720
rotary_potentiometer_5 = 520
rotary_potentiometer_2 = 160
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 800

[[preset]]
name = "Echo Windows"
rotary_potentiometer_1 = 760
rotary_potentiometer_3 = 800
rotary_potentiometer_5 = 640
rotary_potentiometer_2 = 32
toggle_switch_8 = 1
linear_potentiometer_12 = 420

[[preset]]
name = "Horn"
rotary_potentiometer_1 = 300
rotary_potentiometer_3 = 560
rotary_potentiometer_5 = 300
rotary_potentiometer_2 = 544
toggle_switch_10 = 1
linear_potentiometer_12 = 900
