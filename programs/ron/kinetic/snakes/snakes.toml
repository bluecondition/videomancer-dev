# Snakes - Kinetic, 2026-11-14.
# After Kitaoka's "Rotating Snakes": discs of rings stepping black / dark / white / light that seem to turn, and do.
# See snakes.vhd, snakes.py and SUMMARY.md.

[program]
processing_delay_clks = 46
program_id = "com.czartroniks.snakes"
program_name = "Snakes"
program_version = "0.1.2"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Pattern", "Shape"]
program_type = "processing"
description = "Rotating-snakes illusion discs: rings of black/dark/white/light steps that seem to turn, then really crawl."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 409
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Segments"
control_mode = "linear"
display_min_value = 12
display_max_value = 64
initial_value = 402
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 224
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Lattice"
value_labels = ["Staggered", "Square"]
initial_value_label = "Staggered"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Order"
value_labels = ["Alternate", "Same"]
initial_value_label = "Alternate"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Drive"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Snakes"

[[preset]]
name = "Pure Illusion"
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 160
linear_potentiometer_12 = 0

[[preset]]
name = "Counter Crawl"
rotary_potentiometer_1 = 700
rotary_potentiometer_2 = 620
rotary_potentiometer_3 = 200
rotary_potentiometer_5 = 608
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Iris Ripple"
rotary_potentiometer_1 = 300
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 720
rotary_potentiometer_5 = 288
toggle_switch_8 = 1
linear_potentiometer_12 = 150

[[preset]]
name = "Clockwork"
rotary_potentiometer_1 = 520
rotary_potentiometer_2 = 250
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 800
toggle_switch_7 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Big Wheel"
rotary_potentiometer_1 = 1023
rotary_potentiometer_2 = 900
rotary_potentiometer_3 = 600
rotary_potentiometer_5 = 32
linear_potentiometer_12 = 600
