# Tufted - Kinetic wave 2, 2026-11-22.
# A diamond-tufted (Chesterfield) surface: soft lit pillows meeting at buttons, inflated and deflated by a travelling wave.
# See tufted.vhd, tufted.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.tufted"
program_name = "Tufted"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Material", "Render"]
program_type = "processing"
description = "Diamond-tufted upholstery: lit pillows between buttons that a travelling wave inflates and dimples."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 500
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 614
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Rate"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 672
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Wave"
value_labels = ["Smooth", "Snap"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Linear", "Radial"]
initial_value_label = "Linear"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Buttons"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Finish"
value_labels = ["Matte", "Gloss"]
initial_value_label = "Matte"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Puff"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Chesterfield"

[[preset]]
name = "Patent Gloss"
rotary_potentiometer_5 = 32
toggle_switch_10 = 1
linear_potentiometer_12 = 620

[[preset]]
name = "Quilted Ripple"
rotary_potentiometer_1 = 380
rotary_potentiometer_3 = 900
rotary_potentiometer_5 = 864
toggle_switch_9 = 0
linear_potentiometer_12 = 120

[[preset]]
name = "Studded Radial"
rotary_potentiometer_2 = 1023
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 224
toggle_switch_8 = 1

[[preset]]
name = "Overstuffed"
rotary_potentiometer_1 = 700
rotary_potentiometer_5 = 800
toggle_switch_10 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Snap Cushions"
rotary_potentiometer_1 = 300
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 608
toggle_switch_7 = 1
