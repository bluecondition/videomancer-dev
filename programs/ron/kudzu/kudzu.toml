[program]
program_id = "com.ron.kudzu"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Kudzu"
author = "ron"
license = "GPL-3.0"
categories = ["Organic", "Material", "Warp"]
core = "yuv444_30b"
program_type = "processing"
hardware_compatibility = ["rev_b"]
description = "Luma as life: creeping growth colonizes the bright, climbs, sways, blooms, dies back. Season sweeps winter to autumn."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 384
display_min_value = 0
display_max_value = 100
name_label = "Vigor"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = -100
display_max_value = 100
name_label = "Wind"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Foliage"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Species"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Spores"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Fertility"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Polarity"
value_labels = ["Bright Soil", "Dark Soil"]
initial_value_label = "Bright Soil"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blooms"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Spores"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Evergreen"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Timelapse"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Season"
suffix_label = "%"

