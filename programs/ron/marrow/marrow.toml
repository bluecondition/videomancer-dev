[program]
program_id = "com.ron.marrow"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Marrow"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Organic", "Color", "Mirror", "Signal"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "A spine of contoured blobs in signal yellow: folded oscillator lattice, flooded outside a centred column, smeared and torn"
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 533
display_min_value = 0
display_max_value = 100
name_label = "Cells"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 420
display_min_value = 0
display_max_value = 100
name_label = "Warp"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 560
display_min_value = 0
display_max_value = 100
name_label = "Smear"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = -100
display_max_value = 100
name_label = "Speed"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 430
display_min_value = 0
display_max_value = 100
name_label = "Spread"
suffix_label = "%"

# Enum knob: the config binary stores the LABEL INDEX and the firmware loads
# it raw at program load, so the RTL reads 0..7 as an index.  Knob turns and
# presets give 0..1023 (eighths: Marrow 0, Abyss 128, Thermal 256, Acid 384,
# Lagoon 512, Ink 640, Candy 768, Venom 896).
[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Palette"
value_labels = ["Marrow", "Abyss", "Thermal", "Acid", "Lagoon", "Ink", "Candy", "Venom"]
initial_value_label = "Marrow"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Tear"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Drip"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Shape"
value_labels = ["Round", "Diamond"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Breathe"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 420
display_min_value = 0
display_max_value = 100
name_label = "Depth"
suffix_label = "%"

# --- Presets ---
# Placeholders until captured from the hardware with capture_preset.sh.
# Depth (P12) is the performance gesture: soft contours at 0, dense op-art
# rings at 100%.

[[preset]]
name = "Marrow"
rotary_potentiometer_1 = 533
rotary_potentiometer_2 = 420
rotary_potentiometer_3 = 560
rotary_potentiometer_4 = 640
rotary_potentiometer_5 = 430
rotary_potentiometer_6 = 0
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 420

[[preset]]
name = "Abyss Rings"
rotary_potentiometer_1 = 420
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 380
rotary_potentiometer_4 = 420
rotary_potentiometer_5 = 640
rotary_potentiometer_6 = 128
toggle_switch_7 = 1
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 860

[[preset]]
name = "Thermal Drip"
rotary_potentiometer_1 = 600
rotary_potentiometer_2 = 500
rotary_potentiometer_3 = 480
rotary_potentiometer_4 = 700
rotary_potentiometer_5 = 520
rotary_potentiometer_6 = 256
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_9 = 1
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 560

[[preset]]
