# Matrix Rain — classic "digital rain" generator.
#
# A black field of square glyph cells (size set by P12); each column has an independently-seeded
# falling head (advancing once per frame at a randomized speed), a fading green
# tail, and glyphs that mutate at random.  Half-width katakana + digits + a few
# Latin/symbols, rasterized from GNU Unifont at build time (matrix_rain.py).
# Pure synthesis: ignores the incoming video (genlocks to its sync only).

[program]
program_id = "com.bluecondition.matrix_rain"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Matrix Rain"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Pattern", "Generator", "Color"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Classic green Matrix digital rain: falling katakana/digit glyphs with fading tails and random mutation."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 360          # ~35%
display_min_value = 0
display_max_value = 100
name_label = "Fall Speed"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 720          # ~70% of columns active
display_min_value = 0
display_max_value = 100
name_label = "Density"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 480          # ~14 rows of tail
display_min_value = 0
display_max_value = 100
name_label = "Tail Length"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300          # moderate mutation
display_min_value = 0
display_max_value = 100
name_label = "Mutation"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512          # centred = pure phosphor green
display_min_value = 0
display_max_value = 100
name_label = "Hue Tint"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023         # full brightness
display_min_value = 0
display_max_value = 100
name_label = "Brightness"
suffix_label = "%"

# --- Toggle Switches (7-8, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Head Glow"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 450          # zoom 1 -> 32px cells (readable default)
display_min_value = 16
display_max_value = 128
name_label = "Glyph Size"
suffix_label = "px"

# --- Presets ---

[[preset]]
name = "Classic Green"
rotary_potentiometer_1 = 360
rotary_potentiometer_2 = 720
rotary_potentiometer_3 = 480
rotary_potentiometer_4 = 300
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 450

[[preset]]
name = "Heavy Downpour"
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 1000
rotary_potentiometer_3 = 820
rotary_potentiometer_4 = 540
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 200

[[preset]]
name = "Sparse Drift"
