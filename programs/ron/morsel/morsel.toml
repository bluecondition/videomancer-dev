rotary_potentiometer_3 = 430
rotary_potentiometer_4 = 620
rotary_potentiometer_5 = 560
rotary_potentiometer_6 = 780
toggle_switch_7 = 1
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 1
toggle_switch_11 = 0
linear_potentiometer_12 = 620

