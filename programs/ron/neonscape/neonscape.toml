# NEONSCAPE (v0.3.1, 2026-11-17).  Wireframe neon landscapes: grid floor, sun / moon, mesh mountains, city, palms,
# car, clouds, birds, rain, stars, lake mirror, tunnel.  See neonscape.vhd, neonscape.py and SUMMARY.md.

[program]
processing_delay_clks = 33
program_id = "com.czartroniks.neonscape"
program_name = "Neonscape"
program_version = "0.3.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Grid", "Demo", "Render"]
program_type = "processing"
description = "Wireframe neon landscapes: grid, sun, mesh mountains, city, palms, car; gradients roll in per object."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Land"
value_labels = ["Open", "Hills", "Ranges", "Metro", "Valley", "Palms", "Strip", "Tunnel"]
initial_value_label = "Palms"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sky"
value_labels = ["Sun", "Sun Clouds", "Sun Birds", "Dusk", "Moon", "Moon Clouds", "Storm", "Stars"]
initial_value_label = "Dusk"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Fill"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
value_labels = ["Sunset", "Miami", "Laser", "Arcade", "Chrome", "Toxic", "Ice", "Ember"]
initial_value_label = "Sunset"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Sheen"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Shade"
value_labels = ["Smooth", "Sharp"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "View"
value_labels = ["Drive", "Pan"]
initial_value_label = "Drive"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ground"
value_labels = ["Grid", "Lake"]
initial_value_label = "Grid"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Horizon"
control_mode = "linear"
display_min_value = 25
display_max_value = 75
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Sunset Drive"

[[preset]]
name = "Wire City"
linear_potentiometer_12 = 740
rotary_potentiometer_1 = 448
rotary_potentiometer_2 = 576
rotary_potentiometer_5 = 320
rotary_potentiometer_3 = 0

[[preset]]
name = "Storm Ranges"
rotary_potentiometer_1 = 320
rotary_potentiometer_2 = 832
rotary_potentiometer_5 = 832
rotary_potentiometer_4 = 620
rotary_potentiometer_3 = 760

[[preset]]
name = "Mirror Lake"
linear_potentiometer_12 = 480
rotary_potentiometer_1 = 320
rotary_potentiometer_2 = 192
rotary_potentiometer_5 = 192
toggle_switch_10 = 1
rotary_potentiometer_3 = 1023

[[preset]]
name = "Tunnel Run"
linear_potentiometer_12 = 512
rotary_potentiometer_1 = 960
rotary_potentiometer_2 = 64
rotary_potentiometer_4 = 860
rotary_potentiometer_5 = 448
rotary_potentiometer_3 = 300

[[preset]]
name = "Beach Cruise"
rotary_potentiometer_1 = 832
rotary_potentiometer_2 = 320
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 192
toggle_switch_9 = 1
rotary_potentiometer_3 = 1023

[[preset]]
name = "Chrome Poster"
rotary_potentiometer_1 = 576
rotary_potentiometer_2 = 448
rotary_potentiometer_5 = 576
toggle_switch_8 = 1
rotary_potentiometer_3 = 1023
