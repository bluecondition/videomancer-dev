# SPDX-License-Identifier: GPL-3.0-only
#
# Nimbus Program Configuration
# Flowfazer-inspired generative plasma with palette cycling.

[program]
program_id = "com.ron.nimbus"
program_name = "Nimbus"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Render"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Flowfazer-inspired generative plasma. Four pattern modes, 256-entry programmable palette, palette cycling drives all motion."

# --- Rotary Potentiometers ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Freq A"
control_mode = "steps_8"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 1
display_max_value = 8

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Freq B"
control_mode = "steps_8"
min_value = 0
max_value = 1023
initial_value = 384
display_min_value = 1
display_max_value = 8

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Warp"
control_mode = "steps_8"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 1
display_max_value = 8

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Drift"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 600
display_min_value = -100
display_max_value = 100
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Palette"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Scale"
control_mode = "steps_4"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 1
display_max_value = 4

# --- Toggle Switches ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mode Lo"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mode Hi"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Source"
value_labels = ["Synth", "Video"]
initial_value_label = "Synth"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Modulate"
value_labels = ["Phase", "Palette"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Speed"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
display_float_digits = 1
suffix_label = "%"

# --- Presets ---

