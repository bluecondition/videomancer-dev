# Flyback - Onevolt 4, 2026-11-25 (v0.1.0).  LZX Expedition rack: a ramp / shape gradient (+ camera, + LFO) summed
# in Passage, folded by Staircase and patched into Prismatic Ray's Sync / Reset input; the oscillator restarts on
# every contour, so bar trains set off to the right from each one.  Color Chords (or a second Staircase) colours them.
# See flyback.vhd, flyback.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.flyback"
program_name = "Flyback"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Illusion", "Shape"]
program_type = "processing"
description = "Prismatic Ray hard-synced by a folded shape: bar trains launch from every contour of a diamond or ellipse."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Frequency"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Contours"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 620
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 120
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Pedestal"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Diamond", "Ellipse"]
initial_value_label = "Diamond"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Sync"
value_labels = ["Trigger", "Gate"]
initial_value_label = "Gate"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Freq CV"
value_labels = ["Out", "In"]
initial_value_label = "Out"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colouriser"
value_labels = ["Chords", "Staircase"]
initial_value_label = "Chords"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shape"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 780
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Tiers"

[[preset]]
name = "Shingles"
rotary_potentiometer_1 = 330
rotary_potentiometer_2 = 720
toggle_switch_8 = 0
linear_potentiometer_12 = 900

[[preset]]
name = "Chirp"
rotary_potentiometer_2 = 520
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Ice Rings"
rotary_potentiometer_5 = 300
toggle_switch_7 = 1
toggle_switch_8 = 0
linear_potentiometer_12 = 950

[[preset]]
name = "Seams"
rotary_potentiometer_1 = 820
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 330
toggle_switch_8 = 0
linear_potentiometer_12 = 0

[[preset]]
name = "Binary"
rotary_potentiometer_2 = 540
rotary_potentiometer_5 = 512
toggle_switch_8 = 0
toggle_switch_10 = 1

[[preset]]
name = "Pulse"
rotary_potentiometer_3 = 1023
