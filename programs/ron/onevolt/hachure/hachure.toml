# Hachure - Onevolt 9, 2026-11-25 (v0.1.0).  A figure drawn in four hatchings: a BSO Scanner (or Visible Signals
# Quarterizer) choosing among four Angles + Stairs textures by the level of a DSG3 gradient plus the camera, each
# zone in its own Matte colour.  See hachure.vhd, hachure.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.hachure"
program_name = "Hachure"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Print", "Pattern", "Illusion"]
program_type = "processing"
description = "A scanner picks one of four hatchings by a diamond gradient plus the camera; Span nests the rings."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Blend"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Pitch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 180
initial_value = 0
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 0
display_max_value = 8
initial_value = 512
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Gradient"
value_labels = ["Average", "Absolute"]
initial_value_label = "Average"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Textures"
value_labels = ["Angles", "Pitches"]
initial_value_label = "Angles"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shaper"
value_labels = ["Stairs", "Keychain"]
initial_value_label = "Stairs"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colour Mode"
value_labels = ["Zones", "Tint"]
initial_value_label = "Zones"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Span"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Hachure"

[[preset]]
name = "Saltire"
rotary_potentiometer_2 = 680
rotary_potentiometer_5 = 128
toggle_switch_7 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Engraving"
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 640
rotary_potentiometer_5 = 0
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Halftone"
rotary_potentiometer_2 = 420
rotary_potentiometer_4 = 200
rotary_potentiometer_5 = 896
toggle_switch_8 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Woven"
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 600
rotary_potentiometer_5 = 256

[[preset]]
name = "Quarterizer"
rotary_potentiometer_2 = 0
rotary_potentiometer_5 = 640
toggle_switch_9 = 1
linear_potentiometer_12 = 860

[[preset]]
name = "Ring Nest"
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 760
rotary_potentiometer_5 = 384
linear_potentiometer_12 = 1023

[[preset]]
name = "Osc Lattice"
rotary_potentiometer_2 = 680
rotary_potentiometer_5 = 384
toggle_switch_7 = 1
toggle_switch_11 = 1
