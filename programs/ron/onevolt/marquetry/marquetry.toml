# Marquetry - Onevolt, 2026-11-25 (v0.1.0).  The Syntonie shape rack: Rampes' diamond, rectangle and cross, curved by
# Courbes, shifted with wrap and cut into each other by Seuils' logic, posterised with swapped bits by Isohelie and
# coloured by Matrice.  See marquetry.vhd, marquetry.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.marquetry"
program_name = "Marquetry"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Color"]
program_type = "processing"
description = "Syntonie rack: diamond, rectangle and cross gradients shifted with wrap, cut by logic, posterised with swapped bits."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Shift A"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Shift B"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 620
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Shift C"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 860
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bitswap"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 0
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Seuils A"
value_labels = ["Comp A", "A&B"]
initial_value_label = "Comp A"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Seuils B"
value_labels = ["Comp B", "A|B"]
initial_value_label = "Comp B"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Seuils C"
value_labels = ["Comp C", "A^B"]
initial_value_label = "Comp C"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Isohelie"
value_labels = ["In", "Out"]
initial_value_label = "In"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Curve"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[preset]]
name = "Inlay"

[[preset]]
name = "Star Woods"
rotary_potentiometer_1 = 300
rotary_potentiometer_5 = 878
linear_potentiometer_12 = 0

[[preset]]
name = "Red Frame"
toggle_switch_7 = 1
linear_potentiometer_12 = 760

[[preset]]
name = "Neon Cross"
rotary_potentiometer_5 = 439
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 640

[[preset]]
name = "Soft Figures"
rotary_potentiometer_5 = 293
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Ice Ellipse"
rotary_potentiometer_4 = 620
rotary_potentiometer_5 = 586
linear_potentiometer_12 = 1023

[[preset]]
name = "Mono Relief"
rotary_potentiometer_2 = 380
rotary_potentiometer_5 = 732
linear_potentiometer_12 = 300

[[preset]]
name = "Fire Logic"
rotary_potentiometer_5 = 1023
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_10 = 1
