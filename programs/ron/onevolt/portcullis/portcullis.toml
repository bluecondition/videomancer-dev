# Portcullis - Onevolt, 2026-11-25 (v0.1.0).  An LZX Castle rack: a folded diamond (DSG3 -> Stairs) digitised to
# three bits (Castle ADC), held column by column by D flip-flops on a Clock VCO, two bit planes delayed through shift
# registers, a Multi Gate, a Counter in place of the ADC, bits to RGB or through a DAC and SMX3.
# See portcullis.vhd, portcullis.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.portcullis"
program_name = "Portcullis"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pixel", "Color", "Pattern"]
program_type = "processing"
description = "Castle rack: a folded diamond digitised to 3 bits, held in clocked columns, bit planes echoed late."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Clock FM"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 760
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 390
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Bias"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Echo"
control_mode = "linear"
display_min_value = 0
display_max_value = 3
initial_value = 300
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 0
display_max_value = 8
initial_value = 512
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Gate"
value_labels = ["Thru", "XOR"]
initial_value_label = "Thru"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Shape"
value_labels = ["Diamond", "Windows"]
initial_value_label = "Diamond"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bits"
value_labels = ["ADC", "Counter"]
initial_value_label = "ADC"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Output"
value_labels = ["RGB", "DAC"]
initial_value_label = "RGB"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Clock"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Portcullis"

[[preset]]
name = "Windows"
rotary_potentiometer_4 = 480
toggle_switch_8 = 1

[[preset]]
name = "Outlines"
rotary_potentiometer_2 = 600
toggle_switch_7 = 1

[[preset]]
name = "Staircase"
rotary_potentiometer_5 = 60
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Slabs"
rotary_potentiometer_4 = 420
linear_potentiometer_12 = 1000

[[preset]]
name = "Silk"
rotary_potentiometer_2 = 820
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 0

[[preset]]
name = "Ember Fan"
rotary_potentiometer_1 = 1010
rotary_potentiometer_5 = 140
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Lattice"
rotary_potentiometer_2 = 250
toggle_switch_9 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 640
