# Subcarrier - Onevolt, 2026-11-25 (v0.1.0).  The screen as the colour plane: a Swatch loop where hue is a voltage
# (an Angles / DSG3 ramp plus the DSG3 figure gradient, through a quadrature shaper into I and Q) and the camera is
# the luma; a Keychain figure inverts the chroma.  See subcarrier.vhd, subcarrier.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.subcarrier"
program_name = "Subcarrier"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Pattern", "Mask"]
program_type = "processing"
description = "Swatch loop: hue is a voltage, a constant-luma rainbow of ramps and rings, a complementary keyed figure, camera = luma."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Saturation"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Rings"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Luma"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Size"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 360
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Q Cable"
value_labels = ["In", "Out"]
initial_value_label = "In"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Y Path"
value_labels = ["Proc", "Ribbons"]
initial_value_label = "Proc"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Figure"
value_labels = ["Inverted", "Luma>Chroma"]
initial_value_label = "Inverted"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ramp"
value_labels = ["Angles", "DSG3 Abs"]
initial_value_label = "DSG3 Abs"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spectrum"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Swatch"

[[preset]]
name = "Duotone"
rotary_potentiometer_3 = 780
toggle_switch_7 = 1
linear_potentiometer_12 = 660

[[preset]]
name = "Terraces"
rotary_potentiometer_4 = 470
rotary_potentiometer_5 = 560
toggle_switch_8 = 1

[[preset]]
name = "Luma Push"
rotary_potentiometer_4 = 460
toggle_switch_9 = 1
linear_potentiometer_12 = 720

[[preset]]
name = "Rainbow Disc"
rotary_potentiometer_3 = 840
rotary_potentiometer_5 = 300
toggle_switch_10 = 0
linear_potentiometer_12 = 760

[[preset]]
name = "Poster"
rotary_potentiometer_2 = 720
rotary_potentiometer_3 = 860
linear_potentiometer_12 = 0

[[preset]]
name = "Deep Rings"
rotary_potentiometer_2 = 1000
rotary_potentiometer_3 = 120
rotary_potentiometer_4 = 150
rotary_potentiometer_5 = 640

[[preset]]
name = "Climax"
rotary_potentiometer_2 = 820
rotary_potentiometer_3 = 340
linear_potentiometer_12 = 1023
