[program]
processing_delay_clks = 8
program_id = "com.czartroniks.orrery"
program_version = "0.2.1"
abi_version = ">=1.0,<2.0"
program_name = "Orrery"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Render", "Shape", "Curve"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "The solar system: sun-lit planets with surfaces, on their orbits. Tilt the view; Focus centres it on any body."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Zoom"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 760
display_min_value = -100
display_max_value = 100
name_label = "Speed"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Stars"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 500
display_min_value = 0
display_max_value = 100
name_label = "Orbits"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 600
display_min_value = -100
display_max_value = 100
name_label = "Spin"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 8
name_label = "Focus"
suffix_label = ""

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Sky"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Belt"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Rings"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Shading"
value_labels = ["Sunlit", "Flat"]
initial_value_label = "Sunlit"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Planets"
value_labels = ["Small", "Large"]
initial_value_label = "Small"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 620
display_min_value = 0
display_max_value = 100
name_label = "Tilt"
suffix_label = "%"

# --- Presets ---
# (Tilt is the performance gesture: straight down at the bottom, nearly
#  edge-on at the top.  Speed and Spin are bipolar with a still centre.
#  Focus: 0 = Sun, 1 = Mercury ... 8 = Neptune.  Hand-typed placeholders
#  until captured from the hardware with capture_preset.sh.)

[[preset]]
name = "Orrery"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 760
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 500
rotary_potentiometer_5 = 600
rotary_potentiometer_6 = 0
toggle_switch_7 = 0
toggle_switch_8 = 1
toggle_switch_9 = 1
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 620

[[preset]]
