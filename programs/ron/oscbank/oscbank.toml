# SPDX-License-Identifier: GPL-3.0-only
#
# Oscbank: 8-oscillator auto-spread sine bank with shared LFO and hue LUTs.

[program]
program_id = "com.ron.oscbank"
program_name = "Oscbank"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Synthesis", "Pattern"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "8 sine oscillators auto-spread across frequency, LFO rate, and hue. PM + scroll + shape morph + blend modes."

# --- Rotary Potentiometers ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Base Freq"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Freq Spread"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "LFO Rate"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "LFO Spread"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 128
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Base Hue"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 360
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Rainbow"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Toggle Switches ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Tie Break"
value_labels = ["Low", "High"]
initial_value_label = "Low"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blend 1"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Blend 2"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Invert"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Scroll"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shape"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Rainbow Bank"
rotary_potentiometer_1 = 256
rotary_potentiometer_2 = 256
rotary_potentiometer_3 = 256
rotary_potentiometer_4 = 128
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 700
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Unison Drift"
rotary_potentiometer_1 = 128
rotary_potentiometer_2 = 0
rotary_potentiometer_3 = 64
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 300
rotary_potentiometer_6 = 0
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Chaotic Stack"
rotary_potentiometer_1 = 400
rotary_potentiometer_2 = 800
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 200
rotary_potentiometer_6 = 1023
toggle_switch_7 = 0
toggle_switch_8 = 1
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 0
