#
# Oscbank Test: resource scaling test — N parallel sine oscillators.
# Change C_N_OSCS in the vhd, rebuild, check timing + resources.

[program]
program_id = "com.ron.oscbank_test"
program_name = "Oscbank Test"
program_version = "0.0.1"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Synthesis"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Resource scaling test. N parallel sine carriers, summed/maxed. For experiments only."

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Base"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256

