<text x="540" y="150" font-family="sans-serif" font-size="20" fill="#222">Pointy-top cell, numbered clockwise from the top point.</text>
<text x="540" y="184" font-family="sans-serif" font-size="20" fill="#222">V1..V6 = vertices (blue), S1..S6 = sides (green).</text>
<text x="540" y="218" font-family="sans-serif" font-size="20" fill="#222">S2 / S5 are the vertical sides; S1,S3,S4,S6 are the caps.</text>
<text x="540" y="252" font-family="sans-serif" font-size="20" fill="#222"></text>
<text x="540" y="286" font-family="sans-serif" font-size="20" fill="#222">Current v9 connection (right panel):</text>
<text x="540" y="320" font-family="sans-serif" font-size="20" fill="#222">the tips V1 and V4 open into short vertical</text>
<text x="540" y="354" font-family="sans-serif" font-size="20" fill="#222">stems joining the cell directly above / below</text>
<text x="540" y="388" font-family="sans-serif" font-size="20" fill="#222">in the same column.</text>
