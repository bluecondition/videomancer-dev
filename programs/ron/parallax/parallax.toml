[program]
program_id = "com.ron.parallaxslab"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Parallax"
author = "ron"
license = "GPL-3.0"
categories = ["Edges", "Color"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Anaglyph edge slabs on sharp mono. P12 width, K1 edge, K2 clean, K3 range, K4 bal, K5 base, K6 pair."

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Width"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Edge"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 620
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Clean"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Range"
control_mode = "linear"
display_min_value = 8
display_max_value = 38
initial_value = 512
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Balance"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Base"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Pair"
value_labels = ["Blue/Red", "Cyan/Orange", "Green/Magenta", "Yellow/Violet", "Teal/Amber", "Azure/Rose", "Lime/Purple", "White/Black"]
initial_value_label = "Blue/Red"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Settle"
value_labels = ["Lively", "Calm"]
initial_value_label = "Lively"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Density"
value_labels = ["Wash", "Solid"]
initial_value_label = "Solid"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Fill"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Swap"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Layer"
value_labels = ["Over", "Behind"]
initial_value_label = "Over"

[[preset]]
name = "Anaglyph"
rotary_potentiometer_1 = 620
rotary_potentiometer_2 = 384
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 512
toggle_switch_8 = 1
linear_potentiometer_12 = 380

[[preset]]
name = "Big Slabs"
rotary_potentiometer_1 = 180
rotary_potentiometer_2 = 860
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 700
toggle_switch_7 = 1
toggle_switch_8 = 1
linear_potentiometer_12 = 780

[[preset]]
name = "Shimmer"
rotary_potentiometer_1 = 990
rotary_potentiometer_2 = 40
rotary_potentiometer_3 = 220
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 560
toggle_switch_8 = 1
linear_potentiometer_12 = 620

[[preset]]
name = "Flood"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 700
rotary_potentiometer_3 = 1023
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 512
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 1023
