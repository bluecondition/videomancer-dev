# Argon - Patchbay (v0.1.0, 2026-11-22): shape generators into glow, a neon sign of pure geometry.
# A ring, a turning triangle and a counter-turning hexagon as glass tubes lit from inside: white-hot cores,
# gas-coloured bodies, exponential halos, light adding where tubes cross.  See argon.vhd, argon.py, SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.argon"
program_name = "Argon"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Render", "Warp"]
program_type = "processing"
description = "Neon sign of pure geometry: ring, triangle and hexagon tubes with white cores and coloured glow; Voltage drives it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Size"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Motor"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 480
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Gas"
control_mode = "linear"
display_min_value = 1
display_max_value = 6
initial_value = 0
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Tube"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 440
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Figure"
value_labels = ["Round", "Square"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Tubing"
value_labels = ["Single", "Double"]
initial_value_label = "Single"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ballast"
value_labels = ["Steady", "Flicker"]
initial_value_label = "Steady"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Wall"
value_labels = ["Dark", "Wash"]
initial_value_label = "Wash"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Voltage"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Argon"

[[preset]]
name = "Barely Struck"
linear_potentiometer_12 = 60
toggle_switch_9 = 1
toggle_switch_10 = 0

[[preset]]
name = "Over Voltage"
linear_potentiometer_12 = 1023
rotary_potentiometer_2 = 760

[[preset]]
name = "Square Pink"
toggle_switch_7 = 1
rotary_potentiometer_4 = 205
rotary_potentiometer_1 = 700

[[preset]]
name = "Double Bloom"
toggle_switch_8 = 1
rotary_potentiometer_3 = 820
rotary_potentiometer_4 = 614
rotary_potentiometer_2 = 380

[[preset]]
name = "Pinpoint"
rotary_potentiometer_1 = 120
rotary_potentiometer_5 = 900
rotary_potentiometer_3 = 300
rotary_potentiometer_4 = 818
