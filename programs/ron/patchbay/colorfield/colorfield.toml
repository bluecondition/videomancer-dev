# Colorfield - Patchbay #10 (2026-11-14, v0.1.0): soft window keys as paint.
# Stacked soft rectangles of colour breathing on a coloured ground (Rothko); the slider runs from crisp
# hard-edged bars (Kelly) to one glowing fog.  See colorfield.vhd, colorfield.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.colorfield"
program_name = "Colorfield"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Material", "Mask"]
program_type = "processing"
description = "Soft window keys as paint: breathing fields of colour on a coloured ground, from hard bars to a glowing fog."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fields"
control_mode = "linear"
display_min_value = 1
display_max_value = 16
initial_value = 560
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Feather"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Breath"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Colour"
value_labels = ["Maroon", "Ember", "Saffron", "Rust Blue", "Blue Green", "Hot Pink", "Seagram", "Ochre", "Sunset", "Violet", "Ashes", "Coral", "Acid", "Chapel", "Meadow", "Spectrum"]
initial_value_label = "Sunset"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Layout"
value_labels = ["Stacked", "Columns"]
initial_value_label = "Stacked"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Grain"
value_labels = ["On", "Off"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ground"
value_labels = ["Dark", "Light"]
initial_value_label = "Dark"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Glow"
value_labels = ["Glow", "Matte"]
initial_value_label = "Glow"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Dissolve"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 430
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Sunset Stack"

[[preset]]
name = "Kelly Bars"
rotary_potentiometer_1 = 1000
rotary_potentiometer_2 = 200
rotary_potentiometer_3 = 300
rotary_potentiometer_5 = 700
rotary_potentiometer_6 = 1023
toggle_switch_7 = 1
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Fog"
rotary_potentiometer_1 = 800
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 800
rotary_potentiometer_6 = 205
linear_potentiometer_12 = 1023

[[preset]]
name = "Maroon Black"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 850
rotary_potentiometer_5 = 250
rotary_potentiometer_6 = 0
linear_potentiometer_12 = 520

[[preset]]
name = "Blue on Green"
rotary_potentiometer_1 = 420
rotary_potentiometer_3 = 800
rotary_potentiometer_6 = 273
toggle_switch_9 = 1
linear_potentiometer_12 = 380

[[preset]]
name = "Pink Columns"
rotary_potentiometer_1 = 900
rotary_potentiometer_2 = 500
rotary_potentiometer_4 = 820
rotary_potentiometer_6 = 341
toggle_switch_7 = 1
linear_potentiometer_12 = 600
