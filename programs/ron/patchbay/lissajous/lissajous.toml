name = "Wire Solid"
rotary_potentiometer_1 = 438
rotary_potentiometer_2 = 292
rotary_potentiometer_3 = 250
rotary_potentiometer_4 = 760
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 0

[[preset]]
