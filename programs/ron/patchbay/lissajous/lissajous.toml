# Lissajous - Patchbay, 2026-11-14 (v0.1.0): an X-Y scope figure rescanned as a raster.
# H and V ramps -> arcsine shapers -> two function generators (ratio a : b) -> difference amplifiers ->
# window comparators (the figure) and a multiplier -> colouriser (the glow bands).
# See lissajous.vhd, lissajous.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.lissajous"
program_name = "Lissajous"
program_version = "0.1.3"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Pattern", "Signal"]
program_type = "processing"
description = "A Lissajous scope figure rescanned as a raster: it turns, detunes and glows in colouriser bands."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "A"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 292
display_float_digits = 2
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "B"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 146
display_float_digits = 2
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Glow"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shaper"
value_labels = ["Arcsine", "Linear"]
initial_value_label = "Arcsine"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Twin"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Frame"
value_labels = ["Square", "Wide"]
initial_value_label = "Square"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Look"
value_labels = ["Bands", "Line"]
initial_value_label = "Bands"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Detune"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 260
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Three Two"

[[preset]]
name = "Scope"
rotary_potentiometer_1 = 146
rotary_potentiometer_2 = 292
rotary_potentiometer_4 = 720
rotary_potentiometer_5 = 700
toggle_switch_10 = 1
linear_potentiometer_12 = 0

