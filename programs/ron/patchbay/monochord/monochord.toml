# Monochord - Patchbay wave 2, 2026-11-22 (v0.1.0).  The harmonics of a vibrating string: a V staircase picks a
# harmonic per row, an H-locked sine VCO through a full-wave rectifier gives each string's standing-wave envelope,
# a window comparator keys the lens chain, a per-row LFO swings the white-hot string inside it.
# See monochord.vhd, monochord.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.monochord"
program_name = "Monochord"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Pattern", "Optics"]
program_type = "processing"
description = "Vibrating strings: a harmonic series of glowing lens chains, a white-hot string swinging inside each."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Fundamental"
control_mode = "linear"
display_min_value = 1
display_max_value = 4
initial_value = 0
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Rows"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 658
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Partials"
control_mode = "linear"
display_min_value = 0
display_max_value = 2
initial_value = 512
display_float_digits = 2
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "String"
value_labels = ["Blur", "Strobe"]
initial_value_label = "Blur"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Stack"
value_labels = ["Ladder", "Fan"]
initial_value_label = "Ladder"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Nodes"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Spectrum", "Amber"]
initial_value_label = "Spectrum"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Pluck"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Series"

[[preset]]
name = "Odd Partials"
rotary_potentiometer_2 = 1023
rotary_potentiometer_3 = 1023
linear_potentiometer_12 = 480

[[preset]]
name = "Fan Pluck"
rotary_potentiometer_4 = 720
toggle_switch_8 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Strobe Scope"
rotary_potentiometer_4 = 760
toggle_switch_7 = 1
toggle_switch_9 = 0
toggle_switch_10 = 1

[[preset]]
name = "Unison"
rotary_potentiometer_1 = 341
rotary_potentiometer_3 = 0
rotary_potentiometer_5 = 180
linear_potentiometer_12 = 820

[[preset]]
name = "Lattice Osc"
rotary_potentiometer_2 = 420
rotary_potentiometer_4 = 820
toggle_switch_11 = 1
linear_potentiometer_12 = 380
