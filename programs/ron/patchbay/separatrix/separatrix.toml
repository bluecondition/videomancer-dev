# Separatrix - Patchbay, 2026-11-22 (v0.1.0).  The phase portrait of a pendulum: a squared V ramp plus an H-locked
# cosine VCO (and one at twice the rate) mixed into the energy H, banded by a staircase colouriser, with a window
# comparator at the saddle energy drawing the separatrix.  See separatrix.vhd, separatrix.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.separatrix"
program_name = "Separatrix"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Curve", "Pattern", "Color"]
program_type = "processing"
description = "Pendulum phase portrait: eyes of closed orbits, a white separatrix lens line, open bands streaming past."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Period"
control_mode = "linear"
display_min_value = 1
display_max_value = 6
initial_value = 410
display_float_digits = 1
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Detent"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Colour"
control_mode = "linear"
display_min_value = 0
display_max_value = 7
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Look"
value_labels = ["Bands", "Orbits"]
initial_value_label = "Bands"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Separatrix"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Drive"
value_labels = ["Level", "Tilted"]
initial_value_label = "Level"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Colours"
value_labels = ["Ember", "Moss"]
initial_value_label = "Ember"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Gravity"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Portrait"

[[preset]]
name = "Double Well"
rotary_potentiometer_2 = 60
rotary_potentiometer_4 = 440
linear_potentiometer_12 = 600

[[preset]]
name = "Washboard"
rotary_potentiometer_3 = 760
toggle_switch_9 = 1
linear_potentiometer_12 = 640

[[preset]]
name = "Scope Plot"
rotary_potentiometer_4 = 380
toggle_switch_7 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Lens Chain"
rotary_potentiometer_1 = 820
rotary_potentiometer_2 = 1023
rotary_potentiometer_5 = 300
toggle_switch_10 = 1
linear_potentiometer_12 = 380

[[preset]]
name = "Climax"
rotary_potentiometer_3 = 760
rotary_potentiometer_4 = 640
linear_potentiometer_12 = 1023
