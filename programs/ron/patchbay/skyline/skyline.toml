# Skyline - Patchbay, built 2026-11-14 (v0.1.0).
# A sample-and-hold bar graph: slow noise -> H-rate S&H -> comparator against the V ramp -> VU-ladder
# colouriser, peak-hold caps, a dim reflection below the horizon.  See skyline.vhd, skyline.py, SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.skyline"
program_name = "Skyline"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Analysis", "Grid", "Pattern"]
program_type = "processing"
description = "Sample-and-hold bar graph: dancing VU ladder columns with peak caps and a reflection, from noise or the picture."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Columns"
control_mode = "linear"
display_min_value = 8
display_max_value = 96
initial_value = 300
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Segments"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 100
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Level"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Speed"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Decay"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Colour"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Shape"
value_labels = ["Spectrum", "Wave"]
initial_value_label = "Spectrum"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Mirror"
value_labels = ["Reflection", "Centre"]
initial_value_label = "Reflection"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Peaks"
value_labels = ["Caps", "Trails"]
initial_value_label = "Caps"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Gap"
value_labels = ["LEDs", "Solid"]
initial_value_label = "LEDs"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Drive"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Analyser"

[[preset]]
name = "Pinned"
rotary_potentiometer_4 = 820
rotary_potentiometer_5 = 420
linear_potentiometer_12 = 1023

[[preset]]
name = "Night City"
rotary_potentiometer_1 = 620
rotary_potentiometer_2 = 1023
rotary_potentiometer_5 = 860
rotary_potentiometer_6 = 180
toggle_switch_10 = 1
toggle_switch_11 = 1
linear_potentiometer_12 = 430

[[preset]]
name = "Wave Trails"
rotary_potentiometer_1 = 760
rotary_potentiometer_2 = 40
rotary_potentiometer_4 = 760
toggle_switch_7 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Centre Hot"
rotary_potentiometer_1 = 440
rotary_potentiometer_6 = 860
toggle_switch_8 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Big Blocks"
rotary_potentiometer_1 = 60
rotary_potentiometer_2 = 520
rotary_potentiometer_3 = 620
rotary_potentiometer_4 = 320
toggle_switch_9 = 1
