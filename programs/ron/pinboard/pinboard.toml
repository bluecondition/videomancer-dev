# Pinboard — an isometric board of square pins agitated by a hovering ball.
#
# Port of https://www.shadertoy.com/view/tssSDN : a grid of boxes whose heights
# are sin(hash + t) attenuated by the distance to a moving sphere.  Here the
# raymarch is an orthographic isometric heightfield march so it runs at pixel
# rate on the HX4K.

[program]
program_id = "com.bluecondition.pinboard"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Pinboard"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Shape", "Render", "Grid", "Demo"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Isometric board of square pins that pop up and sink as a hovering ball skates over them."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Pin Size"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Rate"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 620
display_min_value = 0
display_max_value = 100
name_label = "Pop"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 420
display_min_value = 0
display_max_value = 100
name_label = "Reach"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 700
display_min_value = 0
display_max_value = 100
name_label = "Roam"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "polar_degs_360"
name_label = "Hue"
suffix_label = "°"
initial_value = 352

# --- Toggle Switches (7-11, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edges"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Field"
value_labels = ["Near", "Far"]
initial_value_label = "Near"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "View"
value_labels = ["Standard", "Shallow"]
initial_value_label = "Standard"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Video"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bulge"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Ball Size"
suffix_label = "%"

