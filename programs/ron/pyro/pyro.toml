[program]
program_id = "com.ron.pyro"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Pyro"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Demo"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Performable fireworks show: hand-fired shells, water reflection, night sky, freeze + time scrub."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = 0
display_max_value = 100
name_label = "Launch"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Size"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Gravity"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Hue"
value_labels = ["Warm", "Primaries", "Pastel", "Red-Wht-Blue", "Rainbow"]
initial_value_label = "Rainbow"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Tail"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 380
display_min_value = 0
display_max_value = 100
name_label = "Spark"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Type"
value_labels = ["Peony/Chrys", "Willow/Palm"]
initial_value_label = "Peony/Chrys"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Ring"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Water"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Finale"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Freeze"
value_labels = ["Run", "Freeze"]
initial_value_label = "Run"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Fire"
suffix_label = "%"

# --- Presets ---
# P12 rests at the bottom (hand-fire armed). FREEZE presets are not
# saved -- freeze/scrub is a live-performance move.

