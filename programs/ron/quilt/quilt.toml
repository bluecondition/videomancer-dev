# Quilt — recursive-subdivision improv quilt.
#
# A loosely grid-based field of randomly coloured and textured rectangular
# patches.  Each coarse grid cell recursively splits into nested sub-rectangles
# (log-cabin / crazy-quilt), each leaf getting a fabric colour and a procedural
# texture.  Static image; re-randomise the layout and the internal pieces with
# two independent seed knobs.  P12 (Density) is the master recursion control.
# K2 re-randomises the whole layout (composition and sub-piecing together).
# K4 is the whole Luma Mod control: at 0 it is off, above that incoming video
# luma drives per-cell piecing density and cells below the threshold are hidden
# (black).  S8 Evolve makes one random piece at a time change its colour OR its
# texture (never both) at the K3 rate; S10 flips the piecing style.  Textures are
# always on and the split jitter is fixed.

[program]
program_id = "com.bluecondition.quilt"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Quilt"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Pattern", "Generative", "Demo"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Recursive-subdivision patchwork quilt of coloured, textured rectangles."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Grid Scale"
value_labels = ["Large", "Big", "Medium", "Small"]
initial_value_label = "Medium"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
name_label = "Seed"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = -100
display_max_value = 100
name_label = "Evolve"
suffix_label = "%"
# BIPOLAR.  Centre = frozen.  Turn RIGHT and pieces change one at a time in
# scattered order; turn LEFT and the change snakes instead, stepping from each
# piece to one it touches.  Either way the far end laps the whole quilt in well
# under a second.

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Threshold"
suffix_label = "%"
# 0 = Luma Mod off entirely.  Above the deadband, incoming luma drives per-cell
# piecing density and cells below the threshold are hidden (black).

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 15
name_label = "Palette Tint"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Texture Scale"
value_labels = ["Fine", "Small", "Medium", "Coarse"]
initial_value_label = "Medium"

# --- Toggle Switches (7-11, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Seams"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Relief"
value_labels = ["Soft", "Deep"]
initial_value_label = "Deep"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Grid"
value_labels = ["Square", "Not Square"]
initial_value_label = "Square"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Piecing"
value_labels = ["Crazy", "Log Cabin"]
initial_value_label = "Crazy"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Palette"
value_labels = ["Fabric", "Rainbow"]
initial_value_label = "Fabric"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 700
display_min_value = 0
display_max_value = 100
name_label = "Density"
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Crazy Quilt"
rotary_potentiometer_1 = 600       # medium grid
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 512       # evolve: centre = frozen
rotary_potentiometer_4 = 0         # luma mod off
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 350       # small texture
toggle_switch_7 = 1                # seams on
toggle_switch_8 = 1                # deep relief
toggle_switch_9 = 0                # square grid
toggle_switch_10 = 0               # crazy piecing
toggle_switch_11 = 0               # fabric
linear_potentiometer_12 = 820      # high density

