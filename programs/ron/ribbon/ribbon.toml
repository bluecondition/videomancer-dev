# Ribbon — full-screen candy-ribbon stripes.
#
# A standalone fork of SUGARCOAT's "rainbow taffy" texture, blown up to fill
# the frame and grown into a full instrument.  Diagonal palette-ramp stripes
# are bent by a cross-axis triangle warp into waving ribbons, rounded and lit
# by a specular gloss, and can be mirrored into arrowheads, cross-woven into
# tartan, folded into ropes or wrapped in dark outlines.
#
# No video in — a pure generator.  WARP lives on the slider, and Warp, Angle,
# Scale, Palette and Ripple are all CONTINUOUS: no stepping anywhere.
#
# Author: bluecondition

[program]
program_id = "com.bluecondition.ribbon"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
program_name = "Ribbon"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Pattern", "Color", "Render"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Full-screen glossy candy ribbons: warping palette stripes, chevrons, tartan and ropes. Rainbow or bakery brown."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 180
name_label = "Angle"
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 1
display_max_value = 4
name_label = "Density"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Scale"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Palette"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 250
display_min_value = 0
display_max_value = 100
name_label = "Ripple"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 640
display_min_value = 0
display_max_value = 100
name_label = "Gloss"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Chevron"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Plaid"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bakery"
value_labels = ["Candy", "Bakery"]
initial_value_label = "Candy"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Rope"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Outline"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 320
display_min_value = 0
display_max_value = 100
name_label = "Warp"
suffix_label = "%"

