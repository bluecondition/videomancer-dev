# Rutt Etra — classic scan-processor Z-displacement.
#
# Incoming video is redrawn as horizontal scanlines vertically displaced by
# luma: bright material rises out of a sagging dark floor, drawn as glowing
# lines on black, with hidden-line terrain occlusion.  P12 RELIEF is the
# performance control (displacement depth); knobs set line density,
# thickness, color, input contrast, a dim source-ghost backdrop, and
# horizontal smoothing of the displaced profile.

[program]
program_id = "com.bluecondition.ruttetra"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
program_name = "Rutt Etra"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Pixel", "Edges", "Tube"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Classic Rutt-Etra scan processor: video redrawn as luma-displaced scanlines with hidden-line terrain occlusion."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Scan Lines"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Thickness"
control_mode = "linear"
display_min_value = 1
display_max_value = 8
initial_value = 128
display_float_digits = 0

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Line Color"
value_labels = ["White", "Green", "Amber", "Cyan", "Magenta", "Ice", "Fire", "Terrain"]
initial_value_label = "White"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Contrast"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Backdrop"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Smoothing"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Peaks"
value_labels = ["Bright", "Dark"]
initial_value_label = "Bright"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Hidden Line"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Shading"
value_labels = ["Banded", "Luma"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Line Style"
value_labels = ["Hard", "Glow"]
initial_value_label = "Hard"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Input"
value_labels = ["Positive", "Negative"]
initial_value_label = "Positive"

# --- Performance Slider ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Relief"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Green Phosphor"
rotary_potentiometer_3 = 192
toggle_switch_10 = 1
linear_potentiometer_12 = 650

[[preset]]
name = "Topographic"
rotary_potentiometer_1 = 700
rotary_potentiometer_3 = 960
rotary_potentiometer_6 = 450
linear_potentiometer_12 = 820

[[preset]]
name = "Ghost Ride"
rotary_potentiometer_3 = 448
rotary_potentiometer_5 = 600
toggle_switch_8 = 0
linear_potentiometer_12 = 550

[[preset]]
name = "Deep Cut"
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 832
toggle_switch_7 = 1
linear_potentiometer_12 = 900
