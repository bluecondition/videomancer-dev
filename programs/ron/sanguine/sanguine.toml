# SANGUINE — realistic blood dripping down from the top of the frame.
#
# Per-lane rivulet engine: randomly-sized beads swell at the top edge, break,
# and fall at individual speeds with stuttering gravity and occasional
# diagonal jogs, shrinking as they deposit tapering wet trails that fade
# top-down.  Composited (opaque) over black or over the incoming video.
# Colour path is parametric (hue/depth knobs) so other liquids are an easy
# later fork.
#
# Panel note: the brief's 8 knobs are folded onto the 6 hardware knobs —
# WANDER rides VISCOSITY (thick syrupy blood meanders and pauses; thin runs
# straight and fast), and GLINT lives on switch S11 (Matte/Gloss).

[program]
program_id = "com.bluecondition.sanguine"
program_version = "0.4.0"
abi_version = ">=1.0,<2.0"
program_name = "Sanguine"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Organic", "Film"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Horror-film blood: beads swell, break, and drip in stuttering rivulets that dry into stains. Over black or video."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Flow"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 480
display_min_value = 0
display_max_value = 100
name_label = "Viscosity"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Hue"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
