# Satsculpt Program Configuration

[program]
program_id = "com.ron.satsculpt"
program_name = "Satsculpt"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Color"]
program_type = "processing"
description = "Saturation sculptor with three-anchor non-linear chroma gain curve. Boost mids and crush extremes, or vice versa."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Low Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Mid Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "High Gain"
control_mode = "linear"
display_min_value = 0
display_max_value = 200
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Pivot Bias"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Tint"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Sat Metric"
value_labels = ["Max", "Sum"]
initial_value_label = "Max"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Polarity"
value_labels = ["Normal", "Inverted"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tint Axis"
value_labels = ["V", "U"]
initial_value_label = "V"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Channel Lock"
value_labels = ["Linked", "U Only"]
initial_value_label = "Linked"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Mid Punch"
rotary_potentiometer_1 = 256
rotary_potentiometer_2 = 870
rotary_potentiometer_3 = 256
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 0
rotary_potentiometer_6 = 512

[[preset]]
name = "Edge Bloom"
rotary_potentiometer_1 = 870
rotary_potentiometer_2 = 256
rotary_potentiometer_3 = 870
