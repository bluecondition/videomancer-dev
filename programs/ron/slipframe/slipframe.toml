# Slipframe - Program Configuration
#
# Codec meltdown: the picture redrawn as a broken compressed stream. Damage
# follows a macroblock grid and grows across a GOP until a keyframe snaps it
# clean: slice slips, dripping stuck blocks, Walsh "DCT" garble, smeared and
# melted blocks, magenta/green chroma errors.

[program]
program_id = "com.ron.slipframe"
program_version = "2.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Slipframe"
author = "ron"
license = "GPL-3.0"
categories = ["Glitch", "Pixel", "Warp"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Codec meltdown: macroblock slips, dripping stuck blocks, DCT garble and chroma errors that grow until a keyframe."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Block"
value_labels = ["8 px", "16 px", "32 px", "64 px"]
initial_value_label = "16 px"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Slip"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 450
display_min_value = 0
display_max_value = 100
name_label = "Drip"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Garble"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Chroma"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "GOP"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Drip"
value_labels = ["Freeze", "Flow"]
initial_value_label = "Flow"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Keyframe"
value_labels = ["Snap", "Breathe"]
initial_value_label = "Snap"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Quant"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bleed"
value_labels = ["Full", "Color"]
initial_value_label = "Full"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Comb"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Mosh"
suffix_label = "%"

