[program]
program_id = "com.ron.solitude"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
program_name = "Solitude"
author = "ron"
license = "GPL-3.0"
categories = ["Render", "Pattern", "Screen"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Ragged central mass of vertical pixel-sort stripes in jewel tones on flat teal, with hot spots and lightning veins."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Edge"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 900
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Drip"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 500
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Lit Dns"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 500
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Cascade"
control_mode = "linear"
