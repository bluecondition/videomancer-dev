[program]
program_id = "com.ron.spiroscope"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Spiroscope"
author = "ron"
license = "GPL-3.0"
categories = ["Curve", "Tube", "Render"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Knob-driven phosphor drawing: etch-a-sketch crossed with a spirograph."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Freq A / X-Vel"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 500
display_min_value = 0
display_max_value = 100
name_label = "Freq B / Y-Vel"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Arm / Step"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 360
name_label = "Phase / Rotate"
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Color"
value_labels = ["Red", "Orange", "Yellow", "Green", "Blue", "Indigo", "Violet", "White"]
initial_value_label = "Green"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 500
display_min_value = 0
display_max_value = 100
name_label = "Draw Speed"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Mode"
value_labels = ["Spiro", "Etch"]
initial_value_label = "Spiro"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Harmonic"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Kaleidoscope"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Rainbow"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Background"
value_labels = ["Black", "Video"]
initial_value_label = "Black"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 0
display_max_value = 100
name_label = "Persistence"
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Rosette"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 500
rotary_potentiometer_3 = 512
rotary_potentiometer_4 = 0
