# STARWIPE -- the wipe / pattern section of a production switcher.
#
# The input video (A) wipes to a generated B source; the P12 slider is the
# T-bar.  Every pattern is an analytic distance field (no bitmaps), anti-
# aliased to at least one pixel in every mode, with clean A at the bottom 2 %
# of travel and clean B at the top 2 % under any setting.
#
# v0.2.0 = the SCANLINE engine: every pattern is a per-field table of rays
# stepped by a line builder; the pixel path is two accumulators.  CLASSIC:
# MIX, BAR >, BAR v, DIAGONAL, BARN DOOR x3, BOX, DIAMOND, CIRCLE, POLYGON,
# CLOCK, PINWHEEL, DOUBLE FAN, DOUBLE SWEEP.  CHEESE: STAR WIPE, SUNBURST,
# SPOTLIGHT.  EDGE soft / hard / border; B = black, matte, white.  The
# pattern knob carries only the patterns built so far.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.starwipe"
program_version = "0.2.3"
abi_version = ">=1.0,<2.0"
program_name = "Starwipe"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Transition", "Vision", "Shape"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Switcher wipes: A wipes to a generated B on the T-bar slider; anti-aliased star, iris, box and bar wipes with borders"
url = "https://github.com/lzxindustries/videomancer-community-programs"

