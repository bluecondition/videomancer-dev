# Brilliant - Straightedge (v0.1.0, 2026-11-22).  The round brilliant cut seen from above: table, star facets,
# kites and girdle facets, every facet one flat tone from a light that circles the stone.  Pave: a wall of stones.
# See brilliant.vhd, brilliant.py and SUMMARY.md.

[program]
processing_delay_clks = 36
program_id = "com.czartroniks.brilliant"
program_name = "Brilliant"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "A brilliant-cut gem from above: flat facets flash as a light circles the stone. Pave: a wall of glittering stones."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Fire"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 450
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Stone", "Pave"]
initial_value_label = "Stone"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Cut"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Brilliant"

[[preset]]
name = "Rose Cut"
rotary_potentiometer_4 = 250
linear_potentiometer_12 = 0

[[preset]]
name = "Starburst"
rotary_potentiometer_4 = 800
rotary_potentiometer_5 = 720
linear_potentiometer_12 = 1023

[[preset]]
name = "Diagram"
rotary_potentiometer_4 = 900
toggle_switch_10 = 1

[[preset]]
name = "Pave"
rotary_potentiometer_3 = 380
toggle_switch_8 = 1

[[preset]]
name = "Black Ice"
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 640
toggle_switch_9 = 1
toggle_switch_10 = 1
