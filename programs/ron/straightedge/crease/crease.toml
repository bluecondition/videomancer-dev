# Crease - Straightedge (v0.1.1, 2026-11-17).  A striped sheet folded flat along straight creases: the stripes
# kink into sharp chevrons at every crease and stay continuous across it.  Black, white and greys.
# See crease.vhd, crease.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.crease"
program_name = "Crease"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "A striped sheet folded along straight creases: chevrons that stream round every bend. Angle works the folds like a jaw."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Folds"
value_labels = ["1", "2", "3"]
initial_value_label = "3"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fold"
value_labels = ["Creases", "Pleat"]
initial_value_label = "Creases"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Folded Sheet"

[[preset]]
name = "Star"
rotary_potentiometer_3 = 560
linear_potentiometer_12 = 0

[[preset]]
name = "Arrowhead"
rotary_potentiometer_3 = 600
rotary_potentiometer_5 = 380
linear_potentiometer_12 = 256

[[preset]]
name = "Herringbone"
rotary_potentiometer_3 = 440
rotary_potentiometer_4 = 1023
toggle_switch_8 = 1
linear_potentiometer_12 = 512

[[preset]]
name = "Descending"
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 720
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 890

[[preset]]
name = "Pinstripe"
rotary_potentiometer_3 = 380
rotary_potentiometer_5 = 350
toggle_switch_10 = 1
linear_potentiometer_12 = 800
