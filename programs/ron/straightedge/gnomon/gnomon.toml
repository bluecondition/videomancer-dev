# Gnomon - Straightedge (v0.1.0, 2026-11-22).  A plain of square posts seen from above at low sun: every post
# casts a long flat parallelogram shadow; the sun circles and the shadows swing round together.
# See gnomon.vhd, gnomon.py and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.gnomon"
program_name = "Gnomon"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Square posts at low sun cast long parallel shadows that swing round like clock hands. The slider lengthens them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Post"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Grid", "Stagger"]
initial_value_label = "Grid"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Sun"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Gnomon"

[[preset]]
name = "Noon"
rotary_potentiometer_4 = 380
rotary_potentiometer_5 = 600
linear_potentiometer_12 = 90

[[preset]]
name = "Long Shadows"
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 160
rotary_potentiometer_5 = 680
linear_potentiometer_12 = 1023

[[preset]]
name = "Brickwork"
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 420
rotary_potentiometer_5 = 360
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Plan"
rotary_potentiometer_3 = 620
rotary_potentiometer_4 = 330
rotary_potentiometer_5 = 640
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 760

[[preset]]
name = "Relief"
rotary_potentiometer_3 = 260
rotary_potentiometer_4 = 260
rotary_potentiometer_5 = 620
linear_potentiometer_12 = 820
