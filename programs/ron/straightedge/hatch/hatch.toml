# Hatch - Straightedge (v0.1.0, 2026-11-22).  Sol LeWitt's lines in four directions: square panels, each a window
# on four continuous families of parallel lines (vertical, horizontal, both diagonals) showing one of the 15
# combinations; the tone is how many families are on.  Black and white.  See hatch.vhd, hatch.py, SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.hatch"
program_name = "Hatch"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Print", "Grid"]
program_type = "processing"
description = "LeWitt's lines in four directions: square panels, each one combination of vertical, horizontal and diagonal hatching."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Panel"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 211
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Grid", "Frames"]
initial_value_label = "Grid"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Layers"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Catalogue"

[[preset]]
name = "Quilt"
rotary_potentiometer_3 = 330
rotary_potentiometer_4 = 300
linear_potentiometer_12 = 0

[[preset]]
name = "Frames"
rotary_potentiometer_4 = 260
toggle_switch_8 = 1

[[preset]]
name = "Wall Drawing"
rotary_potentiometer_3 = 120
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Lattice"
rotary_potentiometer_3 = 560
rotary_potentiometer_5 = 620
linear_potentiometer_12 = 1023

[[preset]]
name = "Portrait"
rotary_potentiometer_3 = 60
rotary_potentiometer_4 = 0
