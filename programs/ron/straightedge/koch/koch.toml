# Koch - Straightedge (v0.1.0, 2026-11-17).  Helge von Koch's snowflake as nested polygonal bands, or an endless
# zoom into its point.  Luma only; every edge is a straight line.  See koch.vhd, koch.py and SUMMARY.md.

[program]
processing_delay_clks = 48
program_id = "com.czartroniks.koch"
program_name = "Koch"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Koch snowflake in nested pointed bands, or an endless dive into its tip. Depth grows the spikes; camera = a flake screen."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 409
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Bands"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 731
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "View"
value_labels = ["Flake", "Dive"]
initial_value_label = "Flake"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Snowflake"

[[preset]]
name = "Dive"
toggle_switch_8 = 1

[[preset]]
name = "Plate"
rotary_potentiometer_4 = 480
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Ink Star"
rotary_potentiometer_4 = 600
toggle_switch_9 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Coastline"
rotary_potentiometer_3 = 900
rotary_potentiometer_4 = 870

[[preset]]
name = "Ink Dive"
rotary_potentiometer_4 = 570
rotary_potentiometer_5 = 380
toggle_switch_8 = 1
toggle_switch_9 = 1
