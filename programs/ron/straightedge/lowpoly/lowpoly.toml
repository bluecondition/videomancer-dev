# Lowpoly - Straightedge (v0.1.0, 2026-11-17).  A faceted sheet: an irregular mesh of triangles, every facet one
# flat grey from its slope toward a light; the vertices bob in a travelling ripple; the camera adds a flat step
# to every facet (a low-poly portrait).  See lowpoly.vhd, lowpoly.py and SUMMARY.md.

[program]
processing_delay_clks = 40
program_id = "com.czartroniks.lowpoly"
program_name = "Lowpoly"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Render", "Grid"]
program_type = "processing"
description = "A crumpled sheet of flat grey triangles lit from the side; vertices ripple; video shades it facet by facet."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 560
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Lean"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Facet"
value_labels = ["Triangles", "Quads"]
initial_value_label = "Triangles"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Relief"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Crumple"

[[preset]]
name = "Studs"
rotary_potentiometer_3 = 620
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 600
linear_potentiometer_12 = 0

[[preset]]
name = "Harlequin"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 720
toggle_switch_9 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Wireframe"
rotary_potentiometer_3 = 640
rotary_potentiometer_5 = 720
toggle_switch_10 = 1

[[preset]]
name = "Portrait"
rotary_potentiometer_3 = 330
rotary_potentiometer_4 = 560
linear_potentiometer_12 = 300

[[preset]]
name = "Shards"
rotary_potentiometer_1 = 760
rotary_potentiometer_3 = 820
rotary_potentiometer_4 = 200
rotary_potentiometer_5 = 760
linear_potentiometer_12 = 1023
