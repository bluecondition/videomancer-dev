# Meander - Straightedge (v0.1.0, 2026-11-17).  Greek-key friezes stacked up the screen: one continuous line, a
# square wave whose boxes wind into square spirals; alternate rows mirrored and running the opposite way; the
# camera sets the line's weight node by node.  See meander.vhd, meander.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.meander"
program_name = "Meander"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Greek-key friezes that wind from a square wave into the full key, slide and slant; video sets the line weight."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 407
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Slant"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Frieze", "Carpet"]
initial_value_label = "Frieze"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Wind"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Greek Key"

[[preset]]
name = "Battlement"
rotary_potentiometer_3 = 560
rotary_potentiometer_5 = 620
linear_potentiometer_12 = 0

[[preset]]
name = "Single Hook"
rotary_potentiometer_5 = 400
linear_potentiometer_12 = 440

[[preset]]
name = "Chevron Carpet"
rotary_potentiometer_3 = 300
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 680
toggle_switch_8 = 1

[[preset]]
name = "Pinstripe"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 300
toggle_switch_9 = 1
toggle_switch_10 = 1

[[preset]]
name = "Labyrinth"
rotary_potentiometer_3 = 150
rotary_potentiometer_5 = 560
toggle_switch_8 = 1
toggle_switch_9 = 1
