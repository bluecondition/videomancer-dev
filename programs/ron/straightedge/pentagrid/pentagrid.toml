# Pentagrid - Straightedge (v0.1.0, 2026-11-17).  De Bruijn's pentagrid: three to eight families of crisp parallel
# bands fanned through a half turn; the tone is the number of bands over the pixel, so five-fold stars, decagons
# and pointed rhombi appear and never repeat.  Black, white and greys.  See pentagrid.vhd, pentagrid.py, SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.pentagrid"
program_name = "Pentagrid"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Quasi-crystal stars from 3 to 8 fans of straight bands, each drifting its own way. Fan opens a barcode into the lattice."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Order"
value_labels = ["3", "4", "5", "6", "7", "8"]
initial_value_label = "5"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Step"
value_labels = ["Flat", "Stairs"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Fan"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Penrose"

[[preset]]
name = "Barcode"
rotary_potentiometer_3 = 560
rotary_potentiometer_5 = 720
linear_potentiometer_12 = 0

[[preset]]
name = "Harlequin"
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 427
rotary_potentiometer_5 = 380
linear_potentiometer_12 = 256

[[preset]]
name = "Kagome Ink"
rotary_potentiometer_3 = 560
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 620
toggle_switch_9 = 1

[[preset]]
name = "Girih Lines"
rotary_potentiometer_3 = 470
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 400
toggle_switch_10 = 1

[[preset]]
name = "Terraces"
rotary_potentiometer_3 = 640
rotary_potentiometer_4 = 256
rotary_potentiometer_5 = 650
toggle_switch_8 = 1
