# Sliver - Straightedge (v0.1.0, 2026-11-17).  Long pointed triangles of light crossing the whole frame, each
# wheeling about the gathering point at its own rate.  Black, white and greys; the camera lays a triangle
# mosaic of flat films under them.  See sliver.vhd, sliver.py and SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.sliver"
program_name = "Sliver"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Long pointed wedges of light crossing the frame, each turning at its own rate. Spread the points; video lays a mosaic."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Count"
value_labels = ["2", "3", "4", "5", "6"]
initial_value_label = "4"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Wedge", "Bowtie"]
initial_value_label = "Wedge"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Searchlights"

[[preset]]
name = "Pinwheel"
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 600
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Herrera"
rotary_potentiometer_3 = 800
rotary_potentiometer_4 = 300
rotary_potentiometer_5 = 560
toggle_switch_9 = 1
linear_potentiometer_12 = 760

[[preset]]
name = "Needles"
rotary_potentiometer_3 = 60
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 640

[[preset]]
name = "Proun"
rotary_potentiometer_3 = 420
rotary_potentiometer_4 = 760
rotary_potentiometer_5 = 420
toggle_switch_10 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Hourglass"
rotary_potentiometer_3 = 560
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 380
toggle_switch_8 = 1
linear_potentiometer_12 = 400
