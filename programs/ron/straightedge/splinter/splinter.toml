# Splinter - Straightedge (v0.1.0, 2026-11-17).  The Conway-Radin pinwheel tiling: a 1:2 right triangle splits
# into five copies of itself, each turned by atan(1/2); an endless spiral zoom.  Luma only.
# See splinter.vhd, splinter.py and SUMMARY.md.

[program]
processing_delay_clks = 40
program_id = "com.czartroniks.splinter"
program_name = "Splinter"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Pinwheel tiling: right triangles split into five turned copies, shattering on an endless spiral zoom."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Gap"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Lines"
value_labels = ["Finest", "All"]
initial_value_label = "Finest"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Shatter"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 300
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Federation Sq"

[[preset]]
name = "Great Triangles"
rotary_potentiometer_3 = 820
rotary_potentiometer_4 = 120
linear_potentiometer_12 = 0

[[preset]]
name = "Splinters"
rotary_potentiometer_4 = 90
linear_potentiometer_12 = 1023

[[preset]]
name = "Shards"
rotary_potentiometer_4 = 880
linear_potentiometer_12 = 470

[[preset]]
name = "Ink Pinwheel"
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 540

[[preset]]
name = "Wireframe"
rotary_potentiometer_4 = 330
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 620
