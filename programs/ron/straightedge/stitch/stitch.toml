# Stitch - Straightedge (v0.1.0, 2026-11-22).  Curve stitching: straight lines whose crowding draws curves.
# Corners: four parabolas around a clear centre; Cross: hyperbolic fans.  See stitch.vhd, stitch.py, SUMMARY.md.

[program]
processing_delay_clks = 20
program_id = "com.czartroniks.stitch"
program_name = "Stitch"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Curve stitching: straight lines whose crowding draws four parabolas round a clear centre. Every edge is straight."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Pins"
value_labels = ["8", "12", "16", "24"]
initial_value_label = "24"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Corners", "Cross"]
initial_value_label = "Corners"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Span"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Sewing Card"

[[preset]]
name = "Thread"
toggle_switch_10 = 1

[[preset]]
name = "Checkerboard"
toggle_switch_9 = 1

[[preset]]
name = "Void"
rotary_potentiometer_5 = 700
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Hyperboloid"
toggle_switch_8 = 1
toggle_switch_10 = 1

[[preset]]
name = "Star Field"
rotary_potentiometer_3 = 300
rotary_potentiometer_4 = 600
linear_potentiometer_12 = 0
