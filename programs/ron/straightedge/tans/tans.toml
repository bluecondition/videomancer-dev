# Tans - Straightedge (v0.1.0, 2026-11-22).  The seven tans of the tangram, each its own flat grey, assembled
# into a square or a silhouette with hairline seams; every few seconds they glide and turn into the next figure.
# Black, white and greys; the camera posterises the subject inside the pieces.  See tans.vhd, tans.py, SUMMARY.md.

[program]
processing_delay_clks = 26
program_id = "com.czartroniks.tans"
program_name = "Tans"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Shape", "Pattern", "Mirror"]
program_type = "processing"
description = "The seven tangram pieces in flat greys, gliding and turning from figure to figure. Scatter them; video tints them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Figure"
value_labels = ["Square", "Cat", "House", "Boat", "Swan", "Fish", "Arrow", "Pyramid"]
initial_value_label = "Square"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Single", "Mirror"]
initial_value_label = "Single"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Scatter"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Tangram"

[[preset]]
name = "Totem"
rotary_potentiometer_4 = 192
rotary_potentiometer_5 = 600
toggle_switch_8 = 1

[[preset]]
name = "Lissitzky"
rotary_potentiometer_5 = 580
linear_potentiometer_12 = 1023

[[preset]]
name = "Blueprint"
rotary_potentiometer_4 = 320
rotary_potentiometer_5 = 690
toggle_switch_10 = 1

[[preset]]
name = "Cut Paper"
rotary_potentiometer_4 = 576
rotary_potentiometer_5 = 640
toggle_switch_9 = 1
linear_potentiometer_12 = 380

[[preset]]
name = "Still Life"
rotary_potentiometer_4 = 704
rotary_potentiometer_5 = 512
rotary_potentiometer_3 = 420
linear_potentiometer_12 = 140
