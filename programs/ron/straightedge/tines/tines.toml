# Tines - Straightedge (v0.1.1, 2026-11-17).  Rows of long needle triangles from the top and the bottom edge,
# interleaving like backgammon points; Cross adds rows from the left and right.  Grey films or black and white;
# the slider is the reach, Drift slides the rows against each other, the camera fattens the teeth block by block.
# See tines.vhd, tines.py and SUMMARY.md.

[program]
processing_delay_clks = 16
program_id = "com.czartroniks.tines"
program_name = "Tines"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Rows of needle triangles from the edges, interleaving and sliding. The slider is their reach; video fattens them."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Skew"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 700
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Rows"
value_labels = ["Jaws", "Cross"]
initial_value_label = "Jaws"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Reach"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 800
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Tines"

[[preset]]
name = "Backgammon"
rotary_potentiometer_3 = 760
rotary_potentiometer_5 = 512
toggle_switch_9 = 1
linear_potentiometer_12 = 512

[[preset]]
name = "Saw Blades"
rotary_potentiometer_3 = 520
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 760
linear_potentiometer_12 = 330

[[preset]]
name = "Zip"
rotary_potentiometer_3 = 300
rotary_potentiometer_5 = 620
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Lattice"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 660
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 900

[[preset]]
name = "Wireframe"
rotary_potentiometer_3 = 560
rotary_potentiometer_4 = 700
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 700
