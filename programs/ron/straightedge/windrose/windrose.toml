# Windrose - Straightedge (v0.1.0, 2026-11-17).  The compass rose of engraved charts: tiers of pointed stars,
# every point split light and dark, the tiers turning against each other.  Field: a mirrored wall of roses.
# See windrose.vhd, windrose.py and SUMMARY.md.

[program]
processing_delay_clks = 32
program_id = "com.czartroniks.windrose"
program_name = "Windrose"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "A compass rose: tiers of faceted stars turning against each other. The camera rules echo lines around it."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Points"
value_labels = ["4", "8", "16", "24"]
initial_value_label = "16"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Rose", "Field"]
initial_value_label = "Rose"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Point"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Compass"

[[preset]]
name = "Sea Chart"
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 620
toggle_switch_10 = 1

[[preset]]
name = "Facets"
rotary_potentiometer_4 = 1023
toggle_switch_9 = 1
linear_potentiometer_12 = 300

[[preset]]
name = "Needles"
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 1023

[[preset]]
name = "Star Wall"
toggle_switch_8 = 1

[[preset]]
name = "Kaleidoscope"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 600
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 200
