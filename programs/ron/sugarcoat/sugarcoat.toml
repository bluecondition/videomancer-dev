# SUGARCOAT v2 -- video re-rendered as candy: clean matte regions filled from a bank of drawn
# confections.  See sugarcoat.vhd, DESIGN.md.  (v1.2.2, the per-pixel 16-texture map, is in git
# at 1fc2fc5; its vmprog is kept as out/rev_b/ron/sugarcoat_v1.2.2.vmprog.)

[program]
processing_delay_clks = 84
program_id = "com.czartroniks.sugarcoat"
program_version = "2.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Sugarcoat"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Color", "Material", "Render", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Video re-rendered as candy: flat regions filled with drawn chocolate, cookies, frosting, jellies and sweets."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Theme"
value_labels = ["Candy Shop", "Bakery", "Chocolate", "Frosting", "Liquorice", "Pastel", "Gummy", "Peppermint"]
initial_value_label = "Candy Shop"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Sprinkles"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 384
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Shade"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 448
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Level"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Gloss"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 600
display_float_digits = 0
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Lines"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Split"
value_labels = ["Fixed", "Adaptive"]
initial_value_label = "Adaptive"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Bank"
value_labels = ["A", "B"]
initial_value_label = "A"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Angle"
value_labels = ["Straight", "Bias"]
initial_value_label = "Straight"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Map"
value_labels = ["Chroma", "Luma"]
initial_value_label = "Chroma"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Variety"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 512
display_float_digits = 0
suffix_label = ""

