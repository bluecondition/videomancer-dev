[program]
program_id = "com.ron.taffy"
program_version = "0.3.0"
abi_version = ">=1.0,<2.0"
program_name = "Taffy"
author = "ron"
license = "GPL-3.0"
categories = ["Warp", "Optics"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Scan the slider down the picture and the lines it touches stretch outward from the centre, snapping back behind it."
url = "https://github.com/lzxindustries/videomancer-sdk"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 700
display_min_value = 0
display_max_value = 100
name_label = "Pull"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Relax"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 1
display_max_value = 255
name_label = "Height"
suffix_label = "ln"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 0
display_max_value = 511
name_label = "Centre"
suffix_label = "px"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 700
display_min_value = 0
display_max_value = 100
name_label = "Depth"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Soft"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Polarity"
value_labels = ["Stretch", "Squeeze"]
initial_value_label = "Stretch"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Hold"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Steps"
value_labels = ["Smooth", "Stepped"]
initial_value_label = "Smooth"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Bypass"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Mode"
value_labels = ["Sustain", "One Shot"]
initial_value_label = "Sustain"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
name_label = "Position"
suffix_label = "%"

