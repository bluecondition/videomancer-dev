# SPDX-License-Identifier: GPL-3.0-only
#
# Trioweave: 3 sine VCOs layered, 2 knobs each (Freq + Hue).

[program]
program_id = "com.ron.trioweave"
program_name = "Trioweave"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "ron"
license = "GPL-3.0"
categories = ["Synthesis", "Pattern"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Three layered sine VCOs with own Freq + LFO each. Slider FM-modulates the LFOs. Fixed RGB-like triad."

# --- Rotary Potentiometers ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Osc1 Freq"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 256
display_min_value = 0
display_max_value = 90
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Osc1 LFO"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Osc2 Freq"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 384
display_min_value = 0
display_max_value = 90
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Osc2 LFO"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 320
display_min_value = 0
display_max_value = 100
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Osc3 Freq"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 90
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Osc3 LFO"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 240
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Toggle Switches ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Key Polarity"
value_labels = ["Low", "High"]
initial_value_label = "Low"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Blend 1"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Blend 2"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Blend 4"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Scroll"
value_labels = ["Off", "On"]
initial_value_label = "On"

# --- Linear Potentiometer ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "FM Depth"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Default Trio"
rotary_potentiometer_1 = 256
rotary_potentiometer_2 = 200
rotary_potentiometer_3 = 384
rotary_potentiometer_4 = 320
rotary_potentiometer_5 = 512
rotary_potentiometer_6 = 240
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Slow Weave"
rotary_potentiometer_1 = 96
rotary_potentiometer_2 = 100
rotary_potentiometer_3 = 128
rotary_potentiometer_4 = 200
rotary_potentiometer_5 = 160
rotary_potentiometer_6 = 300
toggle_switch_7 = 0
toggle_switch_8 = 0
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 1
