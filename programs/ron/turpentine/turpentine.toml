[program]
program_id = "com.ron.turpentine"
program_version = "0.2.0"
abi_version = ">=1.0,<2.0"
program_name = "Turpentine"
author = "ron"
license = "GPL-3.0"
categories = ["Color", "Render", "Pattern"]
program_type = "processing"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Chroma as pigment: the picture repainted in oils. Quantized hues, brush relief, outlines; Solvent sets how much survives."

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 128
display_min_value = 32
display_max_value = 2
name_label = "Pigments"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Relief"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 128
display_min_value = -180
display_max_value = 180
name_label = "Light"
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 448
display_min_value = 0
display_max_value = 100
name_label = "Stroke"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Wash"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Outline"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Palette"
value_labels = ["Free", "Vivid"]
initial_value_label = "Free"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Canvas"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Photo", "Bands"]
initial_value_label = "Bands"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Ink"
value_labels = ["Black", "Chalk"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Orbit"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 768
display_min_value = 0
display_max_value = 100
name_label = "Solvent"
suffix_label = "%"

# --- Presets ---

