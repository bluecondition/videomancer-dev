# Aqueduct - Vellum (v0.1.0, 2026-11-16).  Two arcades at two depths, flat greys sliding past each other with
# parallax (de Chirico's arcades, the Pont du Gard, painted stage flats).  The camera opens the arches.
# See aqueduct.vhd, aqueduct.py and SUMMARY.md.

[program]
processing_delay_clks = 48
program_id = "com.czartroniks.aqueduct"
program_name = "Aqueduct"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Print"]
program_type = "processing"
description = "Two arcades in flat greys slide past each other with parallax; the slider deepens them, video opens the arches."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Arch"
value_labels = ["Round", "Pointed", "Horseshoe", "Stadium", "Porthole", "Gable"]
initial_value_label = "Round"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Build"
value_labels = ["Solid", "Lattice"]
initial_value_label = "Solid"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Pont du Gard"
linear_potentiometer_12 = 860

[[preset]]
name = "Arcade"
rotary_potentiometer_3 = 600
linear_potentiometer_12 = 0

[[preset]]
name = "Cathedral"
rotary_potentiometer_3 = 620
rotary_potentiometer_4 = 256
toggle_switch_10 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Alhambra"
rotary_potentiometer_4 = 427
toggle_switch_9 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Portholes"
rotary_potentiometer_3 = 420
rotary_potentiometer_4 = 768
toggle_switch_8 = 1
linear_potentiometer_12 = 760

[[preset]]
name = "Blueprint"
rotary_potentiometer_4 = 939
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 900
