# Cartouche - Vellum (v0.1.0, 2026-11-16).  Bands of constant distance from a core rectangle: sharp nested
# rectangles inside, rounded rectangles outward, near circles far out.  Grey steps or black and white; the
# slider rounds the corners, Drift streams the bands, the camera bends them.
# See cartouche.vhd, cartouche.py and SUMMARY.md.

[program]
processing_delay_clks = 40
program_id = "com.czartroniks.cartouche"
program_name = "Cartouche"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Nested rounded rectangles in grey steps, streaming outward. The slider rounds the corners; video bends the bands."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Core"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 266
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Pair"
value_labels = ["Single", "Pair"]
initial_value_label = "Single"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Round"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Cartouche"

[[preset]]
name = "Albers"
rotary_potentiometer_3 = 600
rotary_potentiometer_4 = 512
rotary_potentiometer_5 = 600
linear_potentiometer_12 = 0

[[preset]]
name = "Ripple"
rotary_potentiometer_3 = 420
rotary_potentiometer_4 = 140
rotary_potentiometer_5 = 720
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Engraving"
rotary_potentiometer_3 = 380
toggle_switch_10 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Lattice"
rotary_potentiometer_3 = 640
toggle_switch_8 = 1
toggle_switch_9 = 1

[[preset]]
name = "Pill"
rotary_potentiometer_1 = 300
rotary_potentiometer_2 = 640
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 0
linear_potentiometer_12 = 760
