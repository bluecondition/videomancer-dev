# Cassini - Vellum (v0.1.0, 2026-11-16).  Cassini ovals about two foci: rings round each focus, the
# lemniscate, peanuts, ovals, near-circles far out; or two translucent log-spaced ring targets (their XOR is
# the bipolar checkerboard).  Black, white and greys.  See cassini.vhd, cassini.py and SUMMARY.md.

[program]
processing_delay_clks = 28
program_id = "com.czartroniks.cassini"
program_name = "Cassini"
program_version = "0.1.1"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Optics", "Illusion"]
program_type = "processing"
description = "Cassini ovals about two foci: rings, the lemniscate, ovals streaming outward; or two drifting ring targets."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Angle"
control_mode = "linear"
display_min_value = -90
display_max_value = 90
initial_value = 512
display_float_digits = 0
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Family"
value_labels = ["Cassini", "Targets"]
initial_value_label = "Cassini"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Lemniscate"

[[preset]]
name = "Field Plate"
rotary_potentiometer_3 = 600
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 640

[[preset]]
name = "Checkerboard"
toggle_switch_8 = 1
toggle_switch_9 = 1

[[preset]]
name = "Wide Foci"
rotary_potentiometer_3 = 700
rotary_potentiometer_5 = 700
linear_potentiometer_12 = 1023

[[preset]]
name = "Graph Paper"
rotary_potentiometer_3 = 420
rotary_potentiometer_4 = 640
toggle_switch_8 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 700

[[preset]]
name = "Zoom Rings"
rotary_potentiometer_3 = 760
rotary_potentiometer_5 = 860
linear_potentiometer_12 = 0
