# Eclipse - Vellum (v0.1.0, 2026-11-16).  A few large translucent discs of light orbiting a formation point:
# films add where they overlap (Grey) or XOR (Ink); Rings fills them with concentric rings that moire.
# See eclipse.vhd, eclipse.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.eclipse"
program_name = "Eclipse"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Optics", "Pattern"]
program_type = "processing"
description = "Large translucent discs orbit and overlap like films of light; rings make moire. The camera swells their edges."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Discs"
value_labels = ["2", "3", "4"]
initial_value_label = "3"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Fill"
value_labels = ["Flat", "Rings"]
initial_value_label = "Flat"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Spread"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Venn"

[[preset]]
name = "Several Circles"
rotary_potentiometer_3 = 380
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 600
linear_potentiometer_12 = 700

[[preset]]
name = "Eclipse"
rotary_potentiometer_3 = 600
rotary_potentiometer_5 = 580
toggle_switch_9 = 1
linear_potentiometer_12 = 60

[[preset]]
name = "Target"
rotary_potentiometer_3 = 640
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 0

[[preset]]
name = "Interference"
rotary_potentiometer_4 = 512
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 560

[[preset]]
name = "Orrery"
rotary_potentiometer_3 = 300
rotary_potentiometer_4 = 682
rotary_potentiometer_5 = 720
toggle_switch_10 = 1
linear_potentiometer_12 = 900
