# Limacon - Vellum (v0.1.0, 2026-11-22).  The cardioid as an envelope of circles: 24 translucent discs centred on a
# base circle, all through one pole; their edges crowd into a cardioid, a limacon of Pascal or (Nephroid form, every
# disc tangent to a diameter) a nephroid.  Grey counts the discs in stepped greys, Ink takes their parity.
# See limacon.vhd, limacon.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.limacon"
program_name = "Limacon"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Optics", "Illusion"]
program_type = "processing"
description = "The cardioid as an envelope of circles: discs through one pole roll round a base circle in stepped greys or a lace."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Count"
value_labels = ["8", "12", "16", "24"]
initial_value_label = "24"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 650
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Cardioid", "Nephroid"]
initial_value_label = "Cardioid"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Pole"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 614
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Cardioid"

[[preset]]
name = "Rosette"
linear_potentiometer_12 = 0

[[preset]]
name = "Inner Loop"
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Nephroid"
toggle_switch_8 = 1

[[preset]]
name = "Textbook"
toggle_switch_10 = 1
rotary_potentiometer_5 = 600

[[preset]]
name = "Lens"
rotary_potentiometer_4 = 600
toggle_switch_8 = 1
toggle_switch_9 = 1
linear_potentiometer_12 = 1023
