# Lunation - Vellum (v0.1.0, 2026-11-22).  The lunar-phase calendar: a wall chart of moons in rows, each a day
# older than the last, every moon waxing and waning; video sets how full the moons stand.  See lunation.vhd,
# lunation.py and SUMMARY.md.

[program]
processing_delay_clks = 24
program_id = "com.czartroniks.lunation"
program_name = "Lunation"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Shape", "Print"]
program_type = "processing"
description = "A lunar-phase wall chart: rows of moons a day apart, waxing and waning; video sets how full each moon stands."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 573
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Disc"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 870
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Calendar", "Brick"]
initial_value_label = "Calendar"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Span"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 352
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Calendar"

[[preset]]
name = "Astronomer"
toggle_switch_10 = 1
rotary_potentiometer_5 = 640

[[preset]]
name = "Full and New"
linear_potentiometer_12 = 1023
rotary_potentiometer_5 = 600

[[preset]]
name = "Brick Waves"
toggle_switch_8 = 1
linear_potentiometer_12 = 520
rotary_potentiometer_3 = 700

[[preset]]
name = "Pearls"
rotary_potentiometer_3 = 820
rotary_potentiometer_4 = 250
toggle_switch_9 = 1
linear_potentiometer_12 = 600

[[preset]]
name = "Three Moons"
rotary_potentiometer_3 = 0
rotary_potentiometer_4 = 1000
linear_potentiometer_12 = 1023
