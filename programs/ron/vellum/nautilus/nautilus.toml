# Nautilus - Vellum (v0.1.0, 2026-11-16).  The golden rectangle's whirling squares with their quarter
# arcs (the Fibonacci spiral), zooming forever into the eye; luma engraves the arcs' echoes.
# See nautilus.vhd, nautilus.py and SUMMARY.md.

[program]
processing_delay_clks = 48
program_id = "com.czartroniks.nautilus"
program_name = "Nautilus"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Curve", "Shape"]
program_type = "processing"
description = "Whirling golden rectangles and their quarter-arc spiral, zooming forever into the eye; video engraves the arcs."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Detail"
value_labels = ["Arc", "Squares", "Chords", "Diagonals"]
initial_value_label = "Squares"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 680
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Hand"
value_labels = ["Clockwise", "Counter"]
initial_value_label = "Clockwise"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Ratio"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Golden"

[[preset]]
name = "Drafting"
rotary_potentiometer_4 = 1023
toggle_switch_9 = 1
toggle_switch_10 = 1
rotary_potentiometer_5 = 600

[[preset]]
name = "A Paper"
linear_potentiometer_12 = 0
rotary_potentiometer_4 = 640
rotary_potentiometer_5 = 360

[[preset]]
name = "Engraving"
toggle_switch_9 = 1
rotary_potentiometer_4 = 0
rotary_potentiometer_5 = 640

[[preset]]
name = "Double"
linear_potentiometer_12 = 1023
rotary_potentiometer_1 = 300
toggle_switch_8 = 1
rotary_potentiometer_5 = 740

[[preset]]
name = "Still Shell"
rotary_potentiometer_5 = 512
toggle_switch_10 = 1
rotary_potentiometer_4 = 640
