# Phyllo - Vellum set (v0.1.0, 2026-11-16).  Phyllotaxis: a sunflower head, a pine cone, Vogel's model.
# Dots on a log-polar lattice (golden angle at the default), each a circle whose size grows with its
# distance from the centre, arranged along two families of exponential spirals (13 and 21); the tiny dots
# at the centre dissolve into flat grey.  P12 is the divergence angle: 4/11 .. golden .. 2/5, the spirals
# straighten into 11, 8, 13 and 5 spokes on the way.  K5 Drift streams the dots out of the centre.
# The camera never shows: its luma swells the dots (and widens the lines).  See phyllo.vhd.

[program]
processing_delay_clks = 52
program_id = "com.czartroniks.phyllo"
program_name = "Phyllo"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Pattern", "Optics", "Illusion"]
program_type = "processing"
description = "Phyllotaxis: dots on golden-angle log spirals, a sunflower head. Angle turns spirals to spokes; video swells the dots."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 532
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Dot"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 640
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 660
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Form"
value_labels = ["Dots", "Lines"]
initial_value_label = "Dots"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Angle"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Sunflower"

[[preset]]
name = "Eight Spokes"
toggle_switch_9 = 1
linear_potentiometer_12 = 317

[[preset]]
name = "Pinwheel"
rotary_potentiometer_4 = 860
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Spiral Net"
rotary_potentiometer_3 = 330
toggle_switch_8 = 1
toggle_switch_9 = 1

[[preset]]
name = "Seed Head"
rotary_potentiometer_3 = 700
rotary_potentiometer_4 = 1023
toggle_switch_9 = 1

[[preset]]
name = "Pearl Rings"
rotary_potentiometer_3 = 420
toggle_switch_10 = 1
linear_potentiometer_12 = 560
