# Whorl - Vellum set (v0.1.0, 2026-11-16).  Nested polygons whose shape evolves as they go out: a sharp,
# slightly pinched N-gon at the centre rounds into a circle mid-screen and opens into a soft N-lobed flower
# at the edges, each band turned a little more than the one inside, so the nest whirls (nautilus whorls,
# rose windows, Vasarely's polygon spirals).  P12 Evolve: one shape everywhere -> the default metamorphosis
# -> a steep one with a doubled twist.  K5 Drift streams the bands out of (or into) the centre.  The camera
# never shows; its luma bends the bands.  See whorl.vhd and SUMMARY.md.

[program]
processing_delay_clks = 42
program_id = "com.czartroniks.whorl"
program_name = "Whorl"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Illusion", "Pattern", "Shape"]
program_type = "processing"
description = "Nested polygons that turn into circles, then flowers, as they go out; the nest whirls and streams. Video bends the bands."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "X"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Y"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Scale"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 420
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Sides"
value_labels = ["3", "4", "5", "6", "8"]
initial_value_label = "3"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = -100
display_max_value = 100
initial_value = 720
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Camera"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Glide"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Arms"
value_labels = ["Rings", "Spiral"]
initial_value_label = "Rings"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Tone"
value_labels = ["Grey", "Ink"]
initial_value_label = "Grey"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Weight"
value_labels = ["Bold", "Fine"]
initial_value_label = "Bold"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Source"
value_labels = ["Video", "Osc"]
initial_value_label = "Video"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Evolve"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[preset]]
name = "Whorl"

[[preset]]
name = "Nested Squares"
rotary_potentiometer_3 = 360
rotary_potentiometer_4 = 307
rotary_potentiometer_5 = 660
linear_potentiometer_12 = 0

[[preset]]
name = "Rose Window"
rotary_potentiometer_3 = 520
rotary_potentiometer_4 = 716
linear_potentiometer_12 = 680

[[preset]]
name = "Whirlpool"
rotary_potentiometer_3 = 440
rotary_potentiometer_5 = 820
toggle_switch_9 = 1
linear_potentiometer_12 = 1023

[[preset]]
name = "Fine Pentagons"
rotary_potentiometer_3 = 480
rotary_potentiometer_4 = 512
toggle_switch_9 = 1
toggle_switch_10 = 1
linear_potentiometer_12 = 650

[[preset]]
name = "Spiral Vortex"
rotary_potentiometer_4 = 307
rotary_potentiometer_5 = 760
toggle_switch_8 = 1
linear_potentiometer_12 = 800
