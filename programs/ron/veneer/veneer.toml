# VENEER -- flat matte regions filled with ink colour or generative organic textures.
# Generated by variants.py (do not edit by hand).  See veneer.vhd, DESIGN.md, CONTROLS.md.
# Sibling build: veneer_ink (line layers instead of textures).

[program]
processing_delay_clks = 84
program_id = "com.czartroniks.veneer"
program_name = "Veneer"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Organic", "Material", "Render", "Craft"]
program_type = "processing"
description = "Re-renders video as flat regions filled with generative organic textures (stone, timber, tide, hide) or ink colour."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Texture"
value_labels = ["Stone", "Timber", "Tide", "Moss", "Hide", "Ember", "Orchid", "Paper"]
initial_value_label = "Timber"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Depth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 768
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Colour"
value_labels = ["Source", "Tint", "Palette", "Patchwork"]
initial_value_label = "Palette"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Drift"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 64
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Relief"
value_labels = ["Flat", "Soft", "Embossed", "Deep"]
initial_value_label = "Embossed"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Fill"
value_labels = ["Ink", "Texture"]
initial_value_label = "Texture"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Thresholds"
value_labels = ["Fixed", "Adaptive"]
initial_value_label = "Adaptive"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Invert"
value_labels = ["Normal", "Invert"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Light"
value_labels = ["Left", "Right"]
initial_value_label = "Left"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Detail"
value_labels = ["Normal", "Dense"]
initial_value_label = "Normal"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Levels"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 512
display_float_digits = 0
suffix_label = ""

