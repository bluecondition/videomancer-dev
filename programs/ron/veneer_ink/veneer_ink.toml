# VENEER INK -- flat ink mattes with three line layers (outline, sketch, contour).
# Generated by programs/ron/veneer/variants.py (do not edit by hand); the VHDL beside it
# is a stamped copy of programs/ron/veneer/veneer.vhd.

[program]
processing_delay_clks = 84
program_id = "com.czartroniks.veneer_ink"
program_name = "Veneer Ink"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
author = "czartroniks"
license = "GPL-3.0"
categories = ["Edges", "Print", "Render", "Craft"]
program_type = "processing"
description = "Re-renders video as flat ink mattes with three line layers: region outline, sketch strokes and thin contours."
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Palette"
value_labels = ["Stone", "Timber", "Tide", "Moss", "Hide", "Ember", "Orchid", "Paper"]
initial_value_label = "Stone"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Sketch"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Colour"
value_labels = ["Source", "Tint", "Palette", "Patchwork"]
initial_value_label = "Source"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Contour"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 512
display_float_digits = 0
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Outline"
value_labels = ["Off", "Thin", "Medium", "Bold"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Ground"
value_labels = ["Black", "Colour"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Thresholds"
value_labels = ["Fixed", "Adaptive"]
initial_value_label = "Adaptive"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Ink"
value_labels = ["Black", "White"]
initial_value_label = "Black"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Strokes"
value_labels = ["Dark Side", "Both"]
initial_value_label = "Dark Side"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Paper"
value_labels = ["Colour", "Blank"]
initial_value_label = "Colour"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Levels"
control_mode = "linear"
display_min_value = 2
display_max_value = 8
initial_value = 365
display_float_digits = 0
suffix_label = ""

