[program]
program_id = "com.lzxindustries.warpfield"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
program_name = "Warpfield"
author = ""
license = "GPL-3.0"
categories = ["Render", "Pattern", "Screen"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Radial starfield: stars fly toward or away from you, with twinkle, shimmer palettes, centre drift, nebula and luma mode."
url = "https://github.com/lzxindustries/videomancer-sdk"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Layers"
value_labels = ["1", "2", "3", "4", "5", "6"]
initial_value_label = "6"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 400
display_min_value = 0
display_max_value = 100
name_label = "Density"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 900
display_min_value = 0
display_max_value = 100
name_label = "Brightness"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Palette"
value_labels = ["Mixed", "Cool", "Warm", "Rainbow", "Mixed+", "Cool+", "Warm+", "Rainbow+"]
initial_value_label = "Mixed"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 200
display_min_value = 0
display_max_value = 100
name_label = "Size"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Drift"
suffix_label = "%"

# --- Toggle Switches (7-11) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Direction"
value_labels = ["Toward", "Away"]
initial_value_label = "Toward"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Color Mode"
value_labels = ["Color", "B&W"]
initial_value_label = "Color"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Luma Mode"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Background"
value_labels = ["Off", "Deep Space"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Luma Gate"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Slider) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 350
display_min_value = 0
display_max_value = 100
name_label = "Warp"
suffix_label = "%"

