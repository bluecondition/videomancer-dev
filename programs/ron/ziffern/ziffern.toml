# Ziffern — Kraftwerk-inspired 3D zooming digit wall.
#
# A green "old computer screen" wall of pixelated digits 1-9 in an even grid.
# The digits change at random, staggered times; the whole field zooms toward the
# viewer (numbers enlarge) and recedes, centred on the screen.  Pure synthesis:
# ignores the incoming video and draws over a black / dark-tinted background.
# Forked structurally from the ziggurat accumulator-coordinate engine.

[program]
program_id = "com.bluecondition.ziffern"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Ziffern"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Pattern", "Color", "Generator"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "A zooming green wall of randomly-changing digits 1-9 (Kraftwerk-style number field)."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 480          # lands on green in the hue ring
display_min_value = 0
display_max_value = 360
name_label = "Color"
suffix_label = "deg"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 300
display_min_value = 0
display_max_value = 100
name_label = "Change Rate"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 0
display_min_value = 0
display_max_value = 100
name_label = "Number Set"
suffix_label = ""

[[parameter]]
parameter_id = "rotary_potentiometer_4"
