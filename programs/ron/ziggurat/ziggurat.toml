# Ziggurat — orthographic colored & shaded box structures.
#
# A small isometric grid of stacked boxes, each flat-shaded with a brighter top
# and progressively darker sides (Escher-like isometric blocks).
#
# v0.1 scaffold: Milestone A renders a single centered shaded box; the grid
# heightfield + painter-order occlusion follow in Milestone B.

[program]
program_id = "com.bluecondition.ziggurat"
program_version = "0.1.0"
abi_version = ">=1.0,<2.0"
program_name = "Ziggurat"
author = "bluecondition"
license = "GPL-3.0"
categories = ["Shape", "Render", "Demo"]
program_type = "synthesis"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
description = "Orthographic isometric boxes with flat directional face shading."
url = "https://github.com/bluecondition/videomancer-dev"

# --- Rotary Potentiometers (Knobs 1-6) ---

[[parameter]]
parameter_id = "rotary_potentiometer_1"
control_mode = "polar_degs_360"
name_label = "Base Hue"
suffix_label = "°"
initial_value = 160

[[parameter]]
parameter_id = "rotary_potentiometer_2"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 200
name_label = "Box Scale"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 500
display_min_value = 0
display_max_value = 100
name_label = "Height Spread"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 600
display_min_value = 0
display_max_value = 100
name_label = "Shade Contrast"
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 512
display_min_value = 0
display_max_value = 100
name_label = "Spare"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Height Pattern"
value_labels = ["Flat", "Pyramid", "Random", "Checker"]
initial_value_label = "Pyramid"

# --- Toggle Switches (7-11, binary) ---

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Outline"
value_labels = ["Off", "On"]
initial_value_label = "On"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Color Mode"
value_labels = ["Solid", "Varied"]
initial_value_label = "Varied"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "View Angle"
value_labels = ["Standard", "Shallow"]
initial_value_label = "Standard"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Luma Mod"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Video on Faces"
value_labels = ["Off", "On"]
initial_value_label = "Off"

# --- Linear Potentiometer (Fader 12) ---

[[parameter]]
parameter_id = "linear_potentiometer_12"
control_mode = "linear"
min_value = 0
max_value = 1023
initial_value = 1023
display_min_value = 0
display_max_value = 100
name_label = "Brightness"
suffix_label = "%"

# --- Presets ---

[[preset]]
name = "Pyramid City"
rotary_potentiometer_1 = 160
rotary_potentiometer_2 = 520
rotary_potentiometer_3 = 640
rotary_potentiometer_4 = 640
rotary_potentiometer_5 = 1023      # 3x3
rotary_potentiometer_6 = 300       # Pyramid
toggle_switch_7 = 1                # outline on
toggle_switch_8 = 1                # varied colour
toggle_switch_9 = 0
toggle_switch_10 = 0
toggle_switch_11 = 0
linear_potentiometer_12 = 1023

